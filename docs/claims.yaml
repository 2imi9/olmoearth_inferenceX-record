      and abs(R['FT-S2 v1']['test']['tests']['control NDWI level']['pooled_lead']) < 0.001 and R['FT-S2 v1']['test']['tests']['control NDWI level']['w'] > 3 * R['FT-S2 v1']['test']['tests']['control NDWI level']['l']
      and R['FT-S2 v1_2']['test']['tests']['control NDWI level']['pooled_lead'] >= 0.001
    )(A['exp/out/exp52_summary.json'], A['exp/out/exp52_summary.json']['results'])
  cited_in:
    - {file: docs/Findings.md, marker: finetune-dissolves-bolivia-exception}
    - {file: docs/TECHNIQUES.md, marker: finetune-dissolves-bolivia-exception}
    - {file: docs/results/comparisons.md, marker: finetune-dissolves-bolivia-exception}

- id: s1-adds-little-after-finetune
  statement: Adding Sentinel-1 to the fine-tuned Sentinel-2 model adds at most 0.1 window-accuracy points; fine-tuned Sentinel-1 alone stays below the frozen S2 head and the NDWI index still out-ranks its confidence on the multi-region split, so exp46's sensor lever is a frozen-feature property.
  status: measured
