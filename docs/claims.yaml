- id: exp101-shaking-does-not-help-under-transfer
  statement: "Under transfer the two-step rule does not catch more STRICT errors: at exp99's 271 plots (2017 imagery) the 10% review by R(0.6) (the most confident 60% of the design weight set aside, the rest ranked by how often the FT-AWF replica's class changes over 320 perturbed views) holds 13.5% of the STRICT errors against confidence alone's 17.9% (difference -4.4 points, 90% within-country bootstrap -8.1 to +4.3), so P1 does not hold; among the 112 plots not set aside, the instability ranks the errors at AUROC 0.541 against confidence's 0.528 (difference +0.013, -0.090 to +0.131), so P2 does not hold. The 38 STRICT errors in the confident 60% bound any review from low confidence; among the plots kept, errors change over 26.4% of the views and correct plots over 22.4%. The 54 grass/shrub plots change as often as correct plots (9.8% against 9.7%), the other 37 errors over 28.5%; report-only, under LENIENT the instability ranks the kept plots' errors at AUROC 0.676 against 0.518 (+0.158, +0.004 to +0.284)."
