- id: scene-typicality-loses-to-the-margin
  statement: "Neither a window's typicality of its own scene, nor its negation, nor the decontamination flip ranks errors better than the model's own margin on any of the 7 tasks; scene typicality's excess AURC runs 0.094 to 0.243 against the margin's 0.008 to 0.131 and it is worse than the best no-model control on 4 of the 7."
  status: rejected
  experiments: [exp77]
  artifacts: [exp/out/exp77_summary.json, exp/out/exp70_summary.json]
  check: |-
    (lambda s, r: (lambda T:
      s['prereg']['P4_no_new_reading_beats_the_margin']['holds'] is True
      and s['prereg']['P4_no_new_reading_beats_the_margin']['n_tasks_beaten'] == 0
      and all(v > x['excess_aurc']['margin'] for x in s['tasks'] for k, v in x['excess_aurc'].items() if k != 'margin')
      and round(min(x['excess_aurc']['scene_typicality'] for x in s['tasks']), 3) == 0.094
      and round(max(x['excess_aurc']['scene_typicality'] for x in s['tasks']), 3) == 0.243
      and sum(1 for x in s['tasks']
              if x['excess_aurc']['scene_typicality'] > min(v['excess_aurc'] for k, v in T[x['task']]['signals'].items()
                                                            if k.startswith('ctl_'))) == 4
    )(r['results']['tasks']))(A['exp/out/exp77_summary.json'], A['exp/out/exp70_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: scene-typicality-loses-to-the-margin}
    - {file: docs/TECHNIQUES.md, marker: scene-typicality-loses-to-the-margin}
    - {file: docs/related_work.md, marker: scene-typicality-loses-to-the-margin}
  note: >-
    The twelfth reading taken from inside the encoder, and it fails like the eleven before it. The decontamination
    flip also costs a second probe fit and a strength chosen on a labelled holdout, which the margin does not.

- id: the-ranking-ceiling-is-the-tasks-not-the-encoder
  statement: "The share of the random-to-perfect ranking gap the margin takes is a property of the task, not of the encoder: over the 16 encoders of Ai2's suite it runs from 0.551 (Satlas Base) to 0.693 (OlmoEarth Large), OlmoEarth Large is the best of the sixteen and Base ties for second, the OlmoEarth size series moves it only from 0.648 to 0.693 across four model sizes, and the spread between tasks (sd 0.160) is 2.8 times the spread within a task across all sixteen encoders (sd 0.058)."
  status: measured
  experiments: [exp74, exp70]
  artifacts: [exp/out/headroom_by_encoder.json, exp/out/exp70_summary.json, exp/out/exp74_summary.json]
  check: |-
    (lambda d, t70, t74: (lambda share: (lambda med: (lambda m:
      d['oracle'] == 'exact' and d['n_encoders'] == 16 and len(m) == 16
      and all(abs(m[e] - d['per_encoder_median_headroom'][e]) < 1e-12 for e in m)
      and d['best'] == 'olmoearth_large' and max(m, key=lambda e: m[e]) == 'olmoearth_large'
      and round(max(m.values()), 3) == 0.693 and round(min(m.values()), 3) == 0.551
      and min(m, key=lambda e: m[e]) == 'satlas_base'
      and sorted(m.values())[-2] >= m['olmoearth_base'] - 1e-9
      and round(min(m[k] for k in ('olmoearth_nano', 'olmoearth_tiny', 'olmoearth_base', 'olmoearth_large')), 3) == 0.648
      and round(max(m[k] for k in ('olmoearth_nano', 'olmoearth_tiny', 'olmoearth_base', 'olmoearth_large')), 3) == 0.693
      and d['spread_between_tasks_sd'] / d['spread_within_task_across_encoders_median_sd'] > 2.5
    )({e: med([share(r) for r in tasks.values()]) for e, tasks in list(t74.items()) + [('olmoearth_base', t70)]}))(
      lambda v: median(sorted(v))))(
      lambda r: 1 - r['signals']['margin']['excess_aurc'] / (r['error_rate'] - oracle_aurc(r['n_units'], int(round(r['error_rate'] * r['n_units']))))))(
      A['exp/out/headroom_by_encoder.json'],
      A['exp/out/exp70_summary.json']['results']['tasks'],
      A['exp/out/exp74_summary.json']['results']['tasks'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: the-ranking-ceiling-is-the-tasks-not-the-encoder}
  note: >-
    Derived from exp74's and exp70's committed per-task records by scripts/headroom_by_encoder.py, not a run of its
    own, and descriptive rather than preregistered. The check RECOMPUTES the statistic from those per-task records
    and requires the artifact to agree to 1e-12, rather than reading its pre-baked fields; it therefore fails if the
    artifact was generated with a different oracle, which is how a mixed definition moved the worst value from 0.553
    to 0.551 on 2026-09-21. It measures how much the statistic moves when the model changes; a different encoder has
    a different error set, so it is not an upper bound on what a better label-free reading of OlmoEarth's own errors
    could reach.

- id: exp78-export-reproduces-the-suite
  statement: "exp78's per-unit export refits exp70's probe on all seven segmentation tasks and reproduces every accuracy exp70 recorded to the four decimals the record states; the largest raw difference is 9e-05, on m-cashew-plant."
  status: supported
  experiments: [exp78]
  artifacts: [exp/out/exp78_summary.json, exp/out/exp70_summary.json]
  check: |-
    (lambda t, e70:
      len(t) == 7
      and all(abs(v['accuracy_minus_exp70']) < 1e-4 for v in t.values())
      and max(abs(v['accuracy_minus_exp70']) for v in t.values()) > 1e-5
      and all(round(v['exp70_accuracy'], 4) == round(e70[k]['test_accuracy'], 4) for k, v in t.items())
      and all(v['n_units'] == e70[k]['n_units'] for k, v in t.items())
    )(A['exp/out/exp78_summary.json']['tasks'], A['exp/out/exp70_summary.json']['results']['tasks'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: exp78-export-reproduces-the-suite}
  note: >-
    The gate the preregistration put before any prediction was graded: if arm A had not reproduced exp70, the export
    would not be the suite's per-unit data and every reanalysis built on it would be about a different map. The check
    recomputes the comparison against exp70's own summary rather than trusting exp78's copy of it, and asserts the
    residuals are non-zero as well as small, so an export that fabricated exact agreement would fail it.

- id: design-based-interval-is-honest
