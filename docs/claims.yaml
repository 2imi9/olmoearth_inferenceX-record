  note: >-
    The random design's user's-accuracy interval is the exact one since the sixth amendment, about 5% wider than the
    score form; under the two earlier forms the count was 3 and then 5 of the 14 classification tasks, because
    several tasks sit within 3% of a ratio of 1. The comparison now sets an exact, conservative interval (average
    coverage 0.97) against a nominal one (0.945), leaning about 5% in the confidence design's favour; under the
    like-for-like score form the median task's ratio is 0.88 to 0.96 on all five encoders. The verdict is the same
    under every form (exp81's second audit).

