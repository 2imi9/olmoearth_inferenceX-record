- id: exp110-ftw-map-confidence-ranks-its-window-errors
  statement: "In the record's first test on another organisation's deployed product outside land cover (exp110, preregistered, frozen cf59be4), FTW's 2nd-edition global field map, read by the package as a two-class field-extent probability (field + boundary) at the FTW benchmark v1 test chips of Belgium, Croatia, Slovenia and Sweden (1,295 chips, 8-px windows, truth the window majority of the benchmark's 2-class mask, which turned out to be field only), ranks its window errors at AUROC 0.837, 0.870, 0.936 and 0.863 (pooled 0.874), the least confident 10% holding 0.308, 0.393, 0.694 and 0.340 of them, and leads the best no-model control by 0.018 (Belgium, the predicted-class rarity; 90% chip bootstrap 0.004 to 0.034), 0.127, 0.098 and 0.307: preregistered P1 holds in 3 of 4 countries, Belgium meeting the AUROC and capture bars but not the lead of 0.05. The window error rates are 0.1356, 0.0972, 0.0419 and 0.1415 (pooled 0.1110, 146,597 errors in 1,321,132 windows), and 1.0% of the pooled errors are as confident as the median correct window."
