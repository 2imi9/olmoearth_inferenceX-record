- id: confident-errors-are-scene-typical
  statement: "Inside the more confident half of the windows, the error windows are closer to their own tile's mean token than the correct ones on 5 of the 7 segmentation tasks of Ai2's suite (3 of 5 distinct sources); the gap is negative on Sen1Floods11 and undefined on MADOS, whose confident half holds fewer than five errors."
  status: measured
  experiments: [exp77]
  artifacts: [exp/out/exp77_summary.json]
  check: |-
    (lambda s: (lambda g:
      s['prereg']['P1_confident_errors_are_more_scene_typical']['holds'] is True
      and s['prereg']['P1_confident_errors_are_more_scene_typical']['n'] == 5
      and s['prereg']['P1_confident_errors_are_more_scene_typical']['of'] == 7
      and sum(1 for v in g.values() if v is not None and v > 0) == 5
      and g['sen1floods11'] < 0 and g['mados'] is None
    )({r['task']: (r['contamination']['gap'] if r['contamination'] else None) for r in s['tasks']}))(A['exp/out/exp77_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: confident-errors-are-scene-typical}
  note: >-
    The gap is computed from the labels, since separating error windows from correct ones needs them, so it is not a
    label-free reading; the preregistration said otherwise and was corrected in a dated amendment before the numbers
    were read. There is no control for class frequency, which predicts the same sign on its own, and class rarity is
    the best no-model control on six of these seven tasks (exp70), so this does not identify the mechanism.

- id: removing-the-scene-direction-does-not-help
  statement: "Projecting out each token's component along its own tile's mean, then refitting the suite's probe, loses accuracy on all 7 segmentation tasks, from 0.03 to 0.98 points, where the preregistration asked for a gain of at least 0.5 points above the reseed floor on 4 of 7; the strength was chosen on a train holdout and came back the weaker of the two settings on all seven."
