- id: exp100-validation-points-agree-best-two-pixels-east
  statement: "Read at Ai2's 259 validation points moved by whole pixels, exp98's re-run map gives the labelled classes the most probability about 1.9 px east of the labelled pixel (90% task-bootstrap interval 0.7 to 2.4 px; north-south not resolved, -2.1 to 3.0), so the frozen rule calls V an offset; agreement there is 89.2% (231 points) against 87.3% (226) at the labelled pixel, a position chosen on these points, so not a corrected accuracy. Descriptive, written after the run: the position of highest probability is east of the pixel in 13 of the 20 annotation tasks and west in 3, and leaving any one task out keeps the estimate between 1.3 and 2.1 px east. The record's code can account for at most about a pixel of it (the training points' interval); the cause is not determined, and exp98's verdicts stand, graded at the labelled pixel as frozen."
