      and [x['class_with_most_confident_strict_only_errors'][k]['class'] for k in ('standardised', 'unweighted')] == ['shrubland_savanna'] * 2
      and min(x['counts']['nearest_p1_above_the_cut'], x['counts']['nearest_p1_below_the_cut']) > 1e-5
      and round(x['P2']['standardised']['pair_share'], 9) == round(s['P2a']['value'], 9)
