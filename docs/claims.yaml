# Claim ledger: one entry per claim the docs make, each pinned to the artifact under exp/out/ it rests on.
#
# id           stable slug, the name of the marker `<!-- claim:<id> -->` in the docs
# statement    the claim as the docs make it, one sentence
# status       supported | mixed | rejected | measured | superseded
# experiments  the runs behind it
# artifacts    paths under exp/out/ (summary JSON or CSV) the check reads
# check        a Python expression over A (artifact path -> parsed JSON, or a list of CSV row dicts of strings)
#              that is True while the artifacts still say what the statement says
# cited_in     the documents that carry the claim; each needs a marker with this id in that file
# superseded_by  the experiment that overturned it (status must then be superseded)
# note         scope or caveat
#
# tests/test_claims.py evaluates every check and matches every citation to a marker; scripts/claims.py stale
# prints the sentences to rewrite after a new artifact lands. See docs/method/claims.md.

- id: confidence-best-single-signal
  statement: The model's own max-softmax confidence is the best single label-free error ranker on the AWF points, the fine-tuned model and the multi-region Sen1Floods11 test split, under both backbones and both window designs, leading or tying, and it beats tiling instability on the flood testbeds and ties it on the fine-tuned model.
  status: supported
  experiments: [exp04, exp16, exp18, exp21, exp45, exp47, exp49]
  artifacts: [exp/out/exp16_summary.json, exp/out/exp18_sen1floods.csv, exp/out/exp21_summary.json, exp/out/exp45_summary.json, exp/out/exp47_summary.json]
  check: |-
    (lambda s16, c18, s21, s45, s47:
      s16['aurc']['baseline'] < min(s16['aurc']['boundary'], s16['aurc']['tile-phase'])
      and all(float(r['confidence (baseline)|pooled']) == min(float(r[k]) for k in r if k.endswith('|pooled')) for r in c18)
      and s21['crops']['16']['aurc']['confidence (neg logit margin)'] < min(v for k, v in s21['crops']['16']['aurc'].items() if k not in ('confidence (neg logit margin)', 'tiling instability (aligned)'))
      and s21['crops']['16']['bootstrap_vs_confidence (lo, hi, P(signal better))']['tiling instability (aligned)'][0] < 0 < s21['crops']['16']['bootstrap_vs_confidence (lo, hi, P(signal better))']['tiling instability (aligned)'][1]
      and s45['results']['test']['R1_best_ranker']['replicates'] is True
      and all(s47['results'][v][n]['tests']['tile-phase']['pooled_lead'] > 0 and s47['results'][v][n]['tests']['tile-phase']['sign_p'] < 0.05 for v in ('v1', 'v1_2') for n in ('bolivia', 'test'))
      and all(s47['results'][v]['test']['tests']['control NDWI level']['w'] > s47['results'][v]['test']['tests']['control NDWI level']['l'] for v in ('v1', 'v1_2'))
    )(A['exp/out/exp16_summary.json'], A['exp/out/exp18_sen1floods.csv'], A['exp/out/exp21_summary.json'], A['exp/out/exp45_summary.json'], A['exp/out/exp47_summary.json'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: confidence-best-single-signal}
  note: On the fine-tuned model tiling instability is indistinguishable from confidence (AURC 0.0235 vs 0.0262, CI spans zero); on the v1 test split with the shift-averaged decision the NDWI-level control's pooled E-AURC is 0.0003 below averaged confidence while confidence wins per tile 316/108 (exp47, exp49).

- id: exp18-confidence-best-both-splits
  statement: On Sen1Floods11 hand labels under v1 with the grid window, confidence has the lowest pooled E-AURC on Bolivia and on the test split and every other signal loses the per-tile sign test against it.
  status: supported
  experiments: [exp18]
  artifacts: [exp/out/exp18_sen1floods.csv]
  check: |-
    (lambda c18:
      [r['split'] for r in c18] == ['bolivia', 'test']
      and all(float(r['confidence (baseline)|pooled']) == min(float(r[k]) for k in r if k.endswith('|pooled')) for r in c18)
      and all(int(r[k].split('/')[0]) < int(r[k].split('/')[1]) for r in c18 for k in r if k.endswith('|W/L') and not k.startswith('confidence'))
      and c18[0]['tile-phase (aligned)|W/L'] == '163/187' and c18[0]['boundary indicator|W/L'] == '134/217'
      and c18[1]['tile-phase (aligned)|W/L'] == '173/305' and c18[0]['n_tiles_scored'] == '351' and c18[1]['n_tiles_scored'] == '482'
    )(A['exp/out/exp18_sen1floods.csv'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: exp18-confidence-best-both-splits}
  note: v1, grid window; the Bolivia exception (exp45, exp47) is under v1.2 and on the shift-averaged decision.

- id: bolivia-ndwi-exception
  statement: On Sen1Floods11 Bolivia, one flood event, the no-model NDWI-level control ranks the model's errors as well as its confidence under v1 and better under v1.2 Base, for the grid window and the shift-averaged decision alike.
  status: mixed
  experiments: [exp45, exp47]
  artifacts: [exp/out/exp36_summary.json, exp/out/exp45_summary.json, exp/out/exp47_summary.json]
  check: |-
    (lambda s36, s45, s47:
      s45['results']['bolivia']['R1_best_ranker']['pooled_eaurc']['control NDWI level'] < s45['results']['bolivia']['R1_best_ranker']['pooled_eaurc']['confidence']
      and s45['results']['bolivia']['R1_best_ranker']['replicates'] is False
      and s47['results']['v1_2']['bolivia']['pooled_eaurc']['control NDWI level'] < s47['results']['v1_2']['bolivia']['pooled_eaurc']['averaged confidence']
      and abs(s36['part_b']['pooled_eaurc']['control NDWI level'] - s36['part_b']['pooled_eaurc']['confidence (baseline)']) < 0.002
      and abs(s47['results']['v1']['bolivia']['tests']['control NDWI level']['pooled_lead']) < 0.002
    )(A['exp/out/exp36_summary.json'], A['exp/out/exp45_summary.json'], A['exp/out/exp47_summary.json'])
  cited_in:
    - {file: docs/Findings.md, marker: bolivia-ndwi-exception}
    - {file: docs/TECHNIQUES.md, marker: bolivia-ndwi-exception}
    - {file: docs/Summary.md, marker: bolivia-ndwi-exception}
  note: "'As well as' under v1 means within 0.002 pooled E-AURC (grid 0.0119 vs 0.0105, shift-averaged 0.0113 vs 0.0094); per tile the control loses 142/174 on the shift-averaged decision under v1 (exp47)."

- id: pixel-head-beats-encoder-bolivia
  statement: On Sen1Floods11 Bolivia a head on fifteen per-window pixel statistics with no encoder is more accurate than the linear probe on the frozen encoder (0.9199 vs 0.9116).
  status: measured
  experiments: [exp46]
  artifacts: [exp/out/exp46_summary.json]
  check: |-
    (lambda a: a['A0 no encoder'] > a['A1 S2 linear'] and round(a['A0 no encoder'], 4) == 0.9199 and round(a['A1 S2 linear'], 4) == 0.9116
    )(A['exp/out/exp46_summary.json']['results']['bolivia']['accuracy'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: pixel-head-beats-encoder-bolivia}

- id: bag-beats-confidence-v1-bolivia
  statement: The predictive entropy of eight tile-bootstrap heads' averaged maps beats the single head's confidence on Bolivia under v1 (pooled E-AURC 0.0076 vs 0.0094, 210/103 tiles).
  status: superseded
  superseded_by: exp50
  experiments: [exp49]
  artifacts: [exp/out/exp49_summary.json]
  check: |-
    (lambda r: r['pooled_eaurc']['ensemble predictive entropy'] < r['pooled_eaurc']['averaged confidence']
      and (r['tests']['ensemble predictive entropy']['l'], r['tests']['ensemble predictive entropy']['w']) == (210, 103)
    )(A['exp/out/exp49_summary.json']['results']['v1']['bolivia'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: bag-beats-confidence-v1-bolivia}
  note: exp50's sixteen fresh members lose on the same arm; the docs keep the exp49 number only as the run exp50 refuted.

- id: bag-not-replicated
  statement: A bag of bootstrap heads does not improve on the single head's confidence; the apparent gain under v1 on Bolivia did not replicate with a fresh draw and the sign flips across draws.
  status: rejected
  experiments: [exp49, exp50]
  artifacts: [exp/out/exp49_summary.json, exp/out/exp50_summary.json]
  check: |-
    (lambda s49, s50:
      s50['prereg']['P1'] is False
      and s49['results']['v1']['bolivia']['tests']['ensemble predictive entropy']['pooled_lead'] < -0.001
      and s50['results']['v1']['bolivia']['tests']['bag16 predictive entropy']['pooled_lead'] > 0
      and s50['results']['v1']['bolivia']['tests']['bag16 predictive entropy']['sign_p'] > 0.5
      and (s50['results']['v1']['bolivia']['tests']['bag16 predictive entropy']['w'], s50['results']['v1']['bolivia']['tests']['bag16 predictive entropy']['l']) == (140, 166)
      and s50['results']['v1_2']['test']['tests']['bag16 predictive entropy']['pooled_lead'] < 0
      and (s50['results']['v1_2']['test']['tests']['bag16 predictive entropy']['w'], s50['results']['v1_2']['test']['tests']['bag16 predictive entropy']['l']) == (248, 160)
      and all(abs(s50['results'][v][n]['pooled_eaurc']['bag16 predictive entropy'] - s50['results'][v][n]['pooled_eaurc']['averaged confidence']) < 0.0025 for v in ('v1', 'v1_2') for n in ('bolivia', 'test'))
    )(A['exp/out/exp49_summary.json'], A['exp/out/exp50_summary.json'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: bag-not-replicated}
    - {file: docs/results/comparisons.md, marker: bag-not-replicated}

- id: boundary-first-review-order
  statement: Reviewing boundary windows in confidence order and then the interior captures more of the errors than confidence alone at the 5% and 10% review budgets on Bolivia hand labels (preregistered), is no longer ahead at 20%, and picks the same 5% set as confidence on the fine-tuned model.
  crosscheck: tests/test_recorded.py::test_exp37_review_sets_cue_coverage_and_the_boundary_first_counts_recompute_from_the_per_window_table
  status: supported
  experiments: [exp36]
  artifacts: [exp/out/exp36_summary.json]
  check: |-
    (lambda s:
      all(s['part_b']['prereg_lexicographic'][b]['one_sided'] and s['part_b']['prereg_lexicographic'][b]['pooled'] > s['part_b']['prereg_lexicographic'][b]['pooled_confidence'] and s['part_b']['prereg_lexicographic'][b]['boot_lo'] > 0 and s['part_b']['prereg_lexicographic'][b]['sign_p'] < 1e-6 for b in ('0.05', '0.1'))
      and (s['part_b']['prereg_lexicographic']['0.05']['w'], s['part_b']['prereg_lexicographic']['0.05']['l'], s['part_b']['prereg_lexicographic']['0.05']['t']) == (85, 31, 235)
      and (s['part_b']['prereg_lexicographic']['0.1']['w'], s['part_b']['prereg_lexicographic']['0.1']['l'], s['part_b']['prereg_lexicographic']['0.1']['t']) == (112, 48, 191)
      and round(s['part_b']['prereg_lexicographic']['0.05']['pooled'], 3) == 0.274 and round(s['part_b']['prereg_lexicographic']['0.05']['pooled_confidence'], 3) == 0.259
      and round(s['part_b']['prereg_lexicographic']['0.1']['pooled'], 3) == 0.494 and round(s['part_b']['prereg_lexicographic']['0.1']['pooled_confidence'], 3) == 0.465
      and s['part_b']['capture_tests_vs_confidence']['boundary first, then confidence']['0.2']['pooled'] < s['part_b']['capture_tests_vs_confidence']['boundary first, then confidence']['0.2']['pooled_confidence']
      and round(s['part_b']['capture_tests_vs_confidence']['boundary first, then confidence']['0.2']['pooled'], 3) == 0.732
      and s['part_b']['pooled_eaurc']['boundary first, then confidence'] > s['part_b']['pooled_eaurc']['confidence (baseline)']
      and all(s['part_awf']['crops'][c]['lexicographic_vs_confidence']['0.05']['capture_lex'] == s['part_awf']['crops'][c]['lexicographic_vs_confidence']['0.05']['capture_confidence'] for c in ('16', '32'))
    )(A['exp/out/exp36_summary.json'])
  cited_in:
    - {file: docs/Findings.md, marker: boundary-first-review-order}
    - {file: docs/TECHNIQUES.md, marker: boundary-first-review-order}
    - {file: docs/results/comparisons.md, marker: boundary-first-review-order}

- id: errors-sit-on-boundaries
  statement: On Bolivia hand labels 75% of the error windows sit on a prediction boundary against 21% of the correct windows.
  crosscheck: tests/test_recorded.py::test_exp37_review_sets_cue_coverage_and_the_boundary_first_counts_recompute_from_the_per_window_table
  status: measured
  experiments: [exp18, exp36, exp37]
  artifacts: [exp/out/exp36_summary.json, exp/out/exp37_summary.json]
  check: |-
    (lambda s36, c:
      round(c['share_errors'], 3) == 0.750 and round(c['share_correct'], 3) == 0.214
      and round(s36['part_b']['boundary_share']['errors'], 2) == 0.75 and round(s36['part_b']['boundary_share']['correct'], 2) == 0.21
    )(A['exp/out/exp36_summary.json'], A['exp/out/exp37_summary.json']['part_b']['analysis']['cues']['boundary'])
  cited_in:
    - {file: docs/Findings.md, marker: errors-sit-on-boundaries}
    - {file: docs/results/comparisons.md, marker: errors-sit-on-boundaries}
  note: >-
    The test-split shares (73% vs 18%) quoted with exp18 were not in a committed artifact until 2026-09-23: exp65's
    readings (ranker/test/boundary and err, the v1 shift-averaged decision on 149,684 test windows) give 0.732 and
    0.180, pinned to the percent by tests/test_known_answer.py::test_the_test_split_boundary_shares_quoted_with_exp18_are_in_the_committed_readings;
    the check pins Bolivia.

- id: explanation-cues-cover-errors
  statement: 95% of the Bolivia error windows carry at least one label-free cue with a measured enrichment; spectral ambiguity is 7x enriched and, with the boundary cue, is the one that separates error rates inside confidence's review set.
  crosscheck: tests/test_recorded.py::test_exp37_review_sets_cue_coverage_and_the_boundary_first_counts_recompute_from_the_per_window_table
  status: measured
  experiments: [exp37]
  artifacts: [exp/out/exp37_summary.json]
  check: |-
    (lambda a:
      round(1 - a['unexplained']['share_of_errors_without_cue'], 2) == 0.95
      and round(a['cues']['ndwi_ambiguous']['enrichment'], 1) == 7.2
      and all(3.4 < a['cues'][k]['enrichment'] < 3.7 for k in ('boundary', 'low_confidence', 'unstable', 'dihedral_disagree'))
      and round(a['review_set']['0.05']['cues']['boundary']['error_rate_with_cue'], 2) == 0.46 and abs(a['review_set']['0.05']['cues']['boundary']['error_rate_without_cue'] - 0.155) < 0.006
      and round(a['review_set']['0.05']['cues']['ndwi_ambiguous']['error_rate_with_cue'], 2) == 0.51 and round(a['review_set']['0.05']['cues']['ndwi_ambiguous']['error_rate_without_cue'], 2) == 0.33
      and all(abs(a['review_set']['0.05']['cues'][k]['error_rate_with_cue'] - a['review_set']['0.05']['cues'][k]['error_rate_without_cue']) < 0.05 for k in ('unstable', 'dihedral_disagree'))
    )(A['exp/out/exp37_summary.json']['part_b']['analysis'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: explanation-cues-cover-errors}
  note: The error rate without the boundary cue inside the 5% set is 0.1547 (the docs print 0.16).

- id: cue-enrichment-table
  statement: Among Bolivia error windows against correct windows the cue shares are boundary 0.750/0.214 (3.5x, error rate 0.25), least-confident 20% 0.589/0.163 (3.6x, 0.26), unstable 0.583/0.164 (3.6x, 0.26) and NDWI-ambiguous 0.483/0.067 (7.2x, 0.41).
  crosscheck: tests/test_recorded.py::test_exp37_review_sets_cue_coverage_and_the_boundary_first_counts_recompute_from_the_per_window_table
  status: measured
  experiments: [exp37]
  artifacts: [exp/out/exp37_summary.json]
  check: |-
    (lambda c: all((round(c[k]['share_errors'], 3), round(c[k]['share_correct'], 3), round(c[k]['enrichment'], 1), round(c[k]['precision'], 2)) == v for k, v in
      {'boundary': (0.750, 0.214, 3.5, 0.25), 'low_confidence': (0.589, 0.163, 3.6, 0.26), 'unstable': (0.583, 0.164, 3.6, 0.26), 'ndwi_ambiguous': (0.483, 0.067, 7.2, 0.41)}.items())
    )(A['exp/out/exp37_summary.json']['part_b']['analysis']['cues'])
  cited_in:
    - {file: docs/Findings.md, marker: cue-enrichment-table}

