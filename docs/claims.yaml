- id: agent-benchmark-decline-holds
  statement: "Preregistered P3 holds as graded, and it does not show that the package causes the decline. At 27B the tool arm declines to pick a side on all 30 comparison runs (10 cards, 3 runs each at temperature 0); the sandbox arm declines on 3, picks a side on 18 and leaves 9 unanswered. Arm D, which has only the card's text, with no rasters and no package, also declines on 30 of 30. The rubric scores any decline as full marks. Every arm without a code sandbox declined, so the benchmark cannot tell whether the package adds anything to the decline."
  crosscheck: tests/test_recorded.py::test_exp64_declines_recount_from_the_recorded_answers
  status: mixed
  experiments: [exp64, exp58]
  artifacts: [exp/out/exp64_summary.json]
  check: |-
    (lambda V, S: (lambda runs:
      V['holds'] is True and V['declined_A'] == 1.0 and V['declined_B'] == 0.1
      and V['n_cards_A'] == 10 and V['n_cards_B'] == 10
      and S['samples_per_card'] == 3 and S['temperature'] == 0.0
      # runs recounted from the per-card means: each card's comparison was asked on all of its three runs
      and runs('declined_share', 'A') == 30 and runs('declined_share', 'D') == 30 and S['declined_share']['D']['n_cards'] == 10
      and runs('declined_share', 'B') == 3 and runs('comparison_unanswered_share', 'B') == 9
      and 30 - runs('declined_share', 'B') - runs('comparison_unanswered_share', 'B') == 18
      and runs('comparison_unanswered_share', 'A') == 0 and runs('comparison_unanswered_share', 'D') == 0
      # every other arm, the fixed template and the shipped agent included, declined on every comparison card
      and all(v['pooled'] == 1.0 for a, v in S['declined_share'].items() if a != 'B')
    )(lambda k, a: round(sum(S[k][a]['per_card'].values()) * S['samples_per_card']))
    )(A['exp/out/exp64_summary.json']['verdicts']['P3_declines'], A['exp/out/exp64_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: agent-benchmark-decline-holds}
    - {file: docs/Findings.md, marker: agent-benchmark-decline-holds}
    - {file: docs/TECHNIQUES.md, marker: agent-benchmark-decline-holds}
  note: >-
    Status mixed: P3 as preregistered (the tool arm declines on at least 80% of cards, the sandbox arm on fewer than
    half) holds, and the reading that the package supplies the decline does not, because arm D declines as often as
    arm A. The grader (exp/exp64_arms.py, grade_comparison) gives a decline a side score of 1.0 and a pick the share
    of differing windows it gets right, so a decline cannot score below a pick. Runs are at temperature 0, so the
    three runs per card are close to repeats and the effective sample is the 10 cards. The declines are counted
    from the summary's per-card shares times the three runs per card; exp64_answers.jsonl holds the same answers.

