      and len(P3) == 17 and sum(v >= 0.8 for v in P3.values()) == 16 and round(min(P3.values()), 3) == 0.644
      and len(P5) == 10 and sum(v >= 0.8 for v in P5.values()) == 9 and round(min(P5.values()), 3) == 0.684
      and round(cl('planteur|loio:Guyane|oe13', '1')['by_n']['400']['share']['flag_too_little'], 3) == 1.0
