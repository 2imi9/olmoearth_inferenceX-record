- id: suite-margin-beats-the-strong-alternatives
  statement: "On the 24 tasks, published embeddings, probe recipe and 6,435,473 graded units of exp70, the model's own margin beats a five-seed probe ensemble (mutual information on classification, vote disagreement on the window path) on 22 of 24 tasks (one-sided sign test p = 1.8e-05, median lead +0.0153 of excess AURC, 13 of 14 distinct sources), the distance to the tenth nearest of a seeded bank of at most 20,000 training units on 24 of 24 (p = 6.0e-08, median lead +0.0954) and the minimum class-conditional Mahalanobis distance with class means fitted on predicted classes on 24 of 24 (p = 6.0e-08, median lead +0.1123); the ensemble's two losses are awf_landsat at -0.0030, m_eurosat at -0.0003; preregistered P1, P2 and P3 all hold at exp70's bar of 18 of 24."
  status: supported
  experiments: [exp73, exp70]
  artifacts: [exp/out/exp73_summary.json]
  check: |-
    (lambda R, sign_p: (lambda prim: (lambda lead: (lambda W, L:
      len(R) == 24 and sum(R[t]['n_units'] for t in R) == 6435473
      # the ensemble's primary reading is fixed by the family, and the artifact says the same
      and all(prim[t] == R[t]['ensemble_primary'] for t in R)
      # every alternative's per-task lead of the margin (its excess AURC minus the margin's) recomputed from the signals
      and all(abs(lead[a][t] - R[t]['lead'][a]) < 1e-12 for a in lead for t in R)
      # P1-P3 at exp70's bar: at least 18 of 24 won at a one-sided exact sign p < 0.05
      and all(W[a] >= 18 and sign_p(W[a], L[a]) < 0.05 for a in lead)
      and (W['ensemble'], L['ensemble']) == (22, 2) and round(sign_p(22, 2), 6) == 1.8e-05
      and (W['knn_dist'], L['knn_dist']) == (24, 0) and (W['mahalanobis'], L['mahalanobis']) == (24, 0)
      and round(sign_p(24, 0), 9) == 6e-08
      and sorted(t for t in R if lead['ensemble'][t] < 0) == ['awf_landsat', 'm_eurosat']
      and round(lead['ensemble']['awf_landsat'], 4) == -0.0030 and round(lead['ensemble']['m_eurosat'], 4) == -0.0003
      and [round(median(lead[a].values()), 4) for a in ('ensemble', 'knn_dist', 'mahalanobis')] == [0.0153, 0.0954, 0.1123]
      # 13 of 14 distinct sources for the ensemble: a source is won when the mean lead over its tasks is positive
      and (lambda srcs: len(srcs) == 14 and sum(1 for v in srcs.values() if sum(v) / len(v) > 0) == 13)(
        {R[t]['source']: [lead['ensemble'][u] for u in R if R[u]['source'] == R[t]['source']] for t in R})
    )({a: sum(1 for v in lead[a].values() if v > 0) for a in lead}, {a: sum(1 for v in lead[a].values() if v < 0) for a in lead}))(
      {a: {t: R[t]['signals'][prim[t] if a == 'ensemble' else a]['excess_aurc'] - R[t]['signals']['margin']['excess_aurc'] for t in R}
       for a in ('ensemble', 'knn_dist', 'mahalanobis')}))(
      # mutual information on classification, vote disagreement on the window path
      {t: 'ens_mi' if R[t]['family'] == 'classification' else 'ens_vote_dis' for t in R}))(
      A['exp/out/exp73_summary.json']['results']['tasks'],
      lambda w, l: sum(round(2 ** (sum(log((w + l - k + i) / i) for i in range(1, k + 1)) / log(2))) for k in range(w, w + l + 1)) / 2 ** (w + l))
  cited_in:
    - {file: docs/results/comparisons.md, marker: suite-margin-beats-the-strong-alternatives}
    - {file: docs/Findings.md, marker: suite-margin-beats-the-strong-alternatives}
    - {file: docs/TECHNIQUES.md, marker: suite-margin-beats-the-strong-alternatives}

- id: suite-alternatives-clear-the-control-and-still-lose
  statement: "The alternatives clear the suite's near-chance controls on some tasks and still lose: on the 24-task suite the five-seed ensemble beats the best no-model control on 15 tasks, the nearest-neighbour distance on 14 and the Mahalanobis distance on 12; the two distance signals beat the margin on none of those tasks and the ensemble on two of its fifteen (EuroSAT by 0.0003 and AWF Landsat by 0.0030, a statement corrected on 2026-09-23 when the check was made to recompute); the ensemble is nearly the margin's equal on classification (median lead of the margin +0.0114) and behind on segmentation (+0.1336, a lead over a near-random vote disagreement), the feature-space signals are far behind on both (medians +0.0913 and +0.1118 on classification, +0.1121 and +0.1166 on segmentation), mutual information beats vote disagreement on 17 of 17 classification tasks, and the bag margin beats the single margin on 6 of 17."
  status: measured
  experiments: [exp73]
  artifacts: [exp/out/exp73_summary.json]
  check: |-
    (lambda R: (lambda prim, ctl: (lambda lead, beats:
      # an alternative clears the control on a task when its excess AURC is below the smaller of the two controls'
      {a: len(beats[a]) for a in beats} == {'ensemble': 15, 'knn_dist': 14, 'mahalanobis': 12}
      and all(R[t]['lead']['beats_control'][a] == (t in beats[a]) for a in beats for t in R)
      # the feature-space signals never beat the margin where they clear the control (the ensemble does, on m_eurosat
      # and awf_landsat, the two tasks it wins outright)
      and all(lead[a][t] > 0 for a in ('knn_dist', 'mahalanobis') for t in beats[a])
      and sum(1 for t in R if R[t]['family'] == 'classification') == 17 and sum(1 for t in R if R[t]['family'] == 'segmentation') == 7
      # the margin's median lead by family, from the per-task signals
      and [round(median(lead[a][t] for t in R if R[t]['family'] == f), 4)
           for a in ('ensemble', 'knn_dist', 'mahalanobis') for f in ('classification', 'segmentation')]
          == [0.0114, 0.1336, 0.0913, 0.1121, 0.1118, 0.1166]
      and sum(1 for t in R if R[t]['family'] == 'classification' and R[t]['signals']['ens_mi']['excess_aurc'] < R[t]['signals']['ens_vote_dis']['excess_aurc']) == 17
      and sum(1 for t in R if 'bag_margin' in R[t]['signals']) == 17
      and sum(1 for t in R if 'bag_margin' in R[t]['signals'] and R[t]['signals']['bag_margin']['excess_aurc'] < R[t]['signals']['margin']['excess_aurc']) == 6
    )({a: {t: R[t]['signals'][prim[t] if a == 'ensemble' else a]['excess_aurc'] - R[t]['signals']['margin']['excess_aurc'] for t in R}
       for a in ('ensemble', 'knn_dist', 'mahalanobis')},
      {a: [t for t in R if R[t]['signals'][prim[t] if a == 'ensemble' else a]['excess_aurc'] < ctl[t]]
       for a in ('ensemble', 'knn_dist', 'mahalanobis')}))(
      {t: 'ens_mi' if R[t]['family'] == 'classification' else 'ens_vote_dis' for t in R},
      {t: min(R[t]['signals'][c]['excess_aurc'] for c in ('ctl_embedding_distance', 'ctl_class_rarity')) for t in R}))(
      A['exp/out/exp73_summary.json']['results']['tasks'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: suite-alternatives-clear-the-control-and-still-lose}
    - {file: docs/TECHNIQUES.md, marker: suite-alternatives-clear-the-control-and-still-lose}

- id: exp73-segmentation-ensemble-vote-is-near-random
  statement: "On exp73's seven segmentation tasks the ensemble's primary reading, the vote disagreement of five probe seeds, is near random: its AUROC for errors runs from 0.505 to 0.537 and it loses to the better no-model control on all seven. So the margin's median lead of 0.134 over the ensemble on segmentation is a lead over a near-random reading. Against the ensemble's other window reading, the spread of the five seeds' margins, the margin still wins on 7 of 7, by a median 0.018 of excess AURC."
  status: measured
  experiments: [exp73]
  artifacts: [exp/out/exp73_summary.json]
  check: |-
    (lambda T: (lambda seg:
      len(seg) == 7 and all(T[t]['ensemble_primary'] == 'ens_vote_dis' for t in seg)
      and round(min(T[t]['signals']['ens_vote_dis']['auroc'] for t in seg), 3) == 0.505
      and round(max(T[t]['signals']['ens_vote_dis']['auroc'] for t in seg), 3) == 0.537
      and all(T[t]['signals']['ens_vote_dis']['excess_aurc'] > min(T[t]['signals'][c]['excess_aurc'] for c in ('ctl_embedding_distance', 'ctl_class_rarity')) for t in seg)
      and round(median([T[t]['signals']['ens_vote_dis']['excess_aurc'] - T[t]['signals']['margin']['excess_aurc'] for t in seg]), 3) == 0.134
      and all(T[t]['signals']['margin']['excess_aurc'] < T[t]['signals']['ens_margin_std']['excess_aurc'] for t in seg)
      and round(median([T[t]['signals']['ens_margin_std']['excess_aurc'] - T[t]['signals']['margin']['excess_aurc'] for t in seg]), 3) == 0.018
    )([t for t in T if T[t]['family'] == 'segmentation'])
    )(A['exp/out/exp73_summary.json']['results']['tasks'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: exp73-segmentation-ensemble-vote-is-near-random}
    - {file: docs/Findings.md, marker: exp73-segmentation-ensemble-vote-is-near-random}
    - {file: docs/TECHNIQUES.md, marker: exp73-segmentation-ensemble-vote-is-near-random}
  note: >-
    Read from the committed summary after the red team of 30 September 2026. On the window path the probe ensemble
    yields no bag margin, so exp73 graded vote disagreement as the ensemble's primary reading there and recorded the
    spread of margins beside it.

- id: suite-holds-under-every-encoder
  statement: "exp70's protocol on the fifteen other encoders Ai2 published the suite for (AnySat, Clay large, Panopticon, OlmoEarth tiny, nano and large, Galileo tiny, nano and base, CROMA base and large, TerraMind base and large, Satlas base, Copernicus-FM), each with Ai2's own per-model probe settings: across 332 scored (encoder, task) pairs and 92,019,785 graded units the margin beats the best no-model control on 322, every encoder on at least 90.5% of its scored tasks with a one-sided sign test p of at most 1.1e-04 (preregistered P1, bar 75% and p < 0.05, holds for all fifteen), eight encoders undefeated; the ten losses are CropHarvest Togo in its three modality variants (seven) and Nandi Sentinel-1 (three); the 28 (encoder, task) pairs an encoder does not carry are recorded as absent, never as losses, and are files that do not exist on the Hub."
  status: supported
  experiments: [exp74, exp70]
  artifacts: [exp/out/exp74_summary.json]
  check: |-
    (lambda T, R, X, sign_p: (lambda lead: (lambda W, L:
      len(T) == 15 and set(T) == set(R) == set(X)
      # every encoder carries 24 tasks, scored plus absent, so nothing was dropped silently
      and all(len(T[e]) + len(X[e]) == 24 for e in T) and sum(len(v) for v in X.values()) == 28
      # recounted from the per-task signals: the margin wins a pair when its excess AURC is below the smaller control's
      and all(abs(lead[e][t] - T[e][t]['margin_lead']) < 1e-12 for e in T for t in T[e])
      and sum(len(T[e]) for e in T) == 332 and sum(W.values()) == 322 and sum(L.values()) == 10
      # P1's bar, encoder by encoder: at least 75% of the scored tasks won at a one-sided exact sign p < 0.05
      and all(W[e] / len(T[e]) >= 0.75 and sign_p(W[e], L[e]) < 0.05 for e in T)
      and min(W[e] / len(T[e]) for e in T) > 0.90 and max(sign_p(W[e], L[e]) for e in T) < 1.2e-04
      and sum(1 for e in T if L[e] == 0) == 8
      and sorted(t for e in T for t in T[e] if lead[e][t] < 0) == sorted(['cropharvest_Togo_12_sentinel2_sentinel1'] * 2 + ['cropharvest_Togo_12_sentinel1'] * 4 + ['cropharvest_Togo_12_sentinel2'] + ['nandi_sentinel1'] * 3)
      and sum(T[e][t]['n_units'] for e in T for t in T[e]) == 92019785
      # and the artifact's own per-encoder tally agrees with the recount
      and all((W[e], L[e], len(T[e])) == (R[e]['wins'], R[e]['losses'], R[e]['scored']) and abs(sign_p(W[e], L[e]) - R[e]['p']) < 1e-12 for e in T)
    )({e: sum(1 for v in lead[e].values() if v > 0) for e in T}, {e: sum(1 for v in lead[e].values() if v < 0) for e in T}))(
      {e: {t: min(T[e][t]['signals'][c]['excess_aurc'] for c in ('ctl_embedding_distance', 'ctl_class_rarity'))
              - T[e][t]['signals']['margin']['excess_aurc'] for t in T[e]} for e in T}))(
      A['exp/out/exp74_summary.json']['results']['tasks'], A['exp/out/exp74_summary.json']['results']['per_encoder'],
      A['exp/out/exp74_summary.json']['results']['absent'],
      lambda w, l: sum(round(2 ** (sum(log((w + l - k + i) / i) for i in range(1, k + 1)) / log(2))) for k in range(w, w + l + 1)) / 2 ** (w + l))
  cited_in:
    - {file: docs/results/comparisons.md, marker: suite-holds-under-every-encoder}
    - {file: docs/TECHNIQUES.md, marker: suite-holds-under-every-encoder}

- id: suite-outside-families-hold-at-twenty-two
  statement: "The three families outside OlmoEarth that carry all 24 tasks win on 23 of 24 (AnySat, losing cropharvest_Togo_12_sentinel2_sentinel1 only), 24 of 24 (Clay large) and 24 of 24 (Panopticon), each at a one-sided sign test p of at most 1.5e-06, meeting preregistered P2's bar of 22 of 24, so the suite result is not a property of the OlmoEarth family."
  status: supported
  experiments: [exp74]
  artifacts: [exp/out/exp74_summary.json]
  check: |-
    (lambda T, sign_p: (lambda lead: (lambda W, L:
      # each outside family carries all 24 tasks and, recounted from the per-task signals, wins at least P2's 22
      all(len(T[e]) == 24 and W[e] >= 22 for e in W)
      and {e: str(W[e]) + '/' + str(len(T[e])) for e in W} == {'anysat': '23/24', 'clay_large': '24/24', 'panopticon': '24/24'}
      and [t for t in sorted(T['anysat']) if lead['anysat'][t] < 0] == ['cropharvest_Togo_12_sentinel2_sentinel1']
      and all(sign_p(W[e], L[e]) < 1.5e-06 for e in W)
    )({e: sum(1 for v in lead[e].values() if v > 0) for e in lead}, {e: sum(1 for v in lead[e].values() if v < 0) for e in lead}))(
      {e: {t: min(T[e][t]['signals'][c]['excess_aurc'] for c in ('ctl_embedding_distance', 'ctl_class_rarity'))
              - T[e][t]['signals']['margin']['excess_aurc'] for t in T[e]} for e in ('anysat', 'clay_large', 'panopticon')}))(
      A['exp/out/exp74_summary.json']['results']['tasks'],
      lambda w, l: sum(round(2 ** (sum(log((w + l - k + i) / i) for i in range(1, k + 1)) / log(2))) for k in range(w, w + l + 1)) / 2 ** (w + l))
  cited_in:
    - {file: docs/results/comparisons.md, marker: suite-outside-families-hold-at-twenty-two}
    - {file: docs/TECHNIQUES.md, marker: suite-outside-families-hold-at-twenty-two}

- id: suite-lead-across-olmoearth-sizes
  statement: "Across the OlmoEarth size series the margin's median lead of excess AURC over the best no-model control is +0.1310 at tiny (median accuracy 0.759, 22 of 24 tasks won), +0.1314 at nano (0.749, 23 of 24), +0.1158 at Base (0.754, 24 of 24, from exp70) and +0.1134 at large (0.729, 24 of 24): a spread of 0.018, flat to slightly narrowing with capacity while the count of tasks won rises; descriptive P3, no trend claimed."
