- id: augrc-leaves-the-suite-result-standing
  statement: "For a fixed set of errors AUGRC orders readings as the failure AUROC does, and by AUROC the margin beats the best no-model control on 23 of exp70's 24 tasks, in exp70's own artifact and again in exp76; the exception is cropharvest_Togo_12_sentinel1, where the class-rarity control leads by under 0.001 of AUROC. Across every reading exp76 computed, the best one is the same under excess AURC and under AUROC on 22 of 24 tasks. exp76's probability margin reproduces exp70's excess AURC to within 1e-4 on 18 of 24 tasks and to within 0.004 on all."
  status: measured
  experiments: [exp76, exp70]
  artifacts: [exp/out/exp76_summary.json, exp/out/exp70_summary.json]
  check: |-
    (lambda V, R, E:
      V['descriptive']['margin_beats_best_control_by_auroc'] == 23
      and sum(1 for t in E if E[t]['signals']['margin']['auroc'] > max(E[t]['signals'][c]['auroc'] for c in ('ctl_embedding_distance', 'ctl_class_rarity'))) == 23
      and [t for t in E if E[t]['signals']['margin']['auroc'] <= max(E[t]['signals'][c]['auroc'] for c in ('ctl_embedding_distance', 'ctl_class_rarity'))] == ['cropharvest_Togo_12_sentinel1']
      and E['cropharvest_Togo_12_sentinel1']['signals']['ctl_class_rarity']['auroc'] - E['cropharvest_Togo_12_sentinel1']['signals']['margin']['auroc'] < 0.001
      and V['P4']['same_best_reading_under_both_statistics'] == 22 and V['P4']['of'] == 24
      and V['consistency']['max_abs_deviation_of_margin_eaurc_from_exp70'] < 0.004
      and sum(1 for t in R if abs(R[t]['signals']['margin']['excess_aurc'] - E[t]['signals']['margin']['excess_aurc']) < 1e-4) == 18
    
      and all(abs(augrc_from_auroc(sig['auroc'], r['error_rate'], r['n_units'])
                   - ((1 - sig['auroc']) * r['error_rate'] * (1 - r['error_rate'])
                      + r['error_rate'] ** 2 / 2 + r['error_rate'] / (2 * r['n_units']))) < 1e-12
              for r in E.values() for sig in r['signals'].values() if 'auroc' in sig)
      and all((max(r['signals'], key=lambda k: r['signals'][k]['auroc'])
               == min(r['signals'], key=lambda k: augrc_from_auroc(r['signals'][k]['auroc'], r['error_rate'], r['n_units'])))
              for r in E.values())
    )(A['exp/out/exp76_summary.json']['verdicts'], A['exp/out/exp76_summary.json']['results']['tasks'], A['exp/out/exp70_summary.json']['results']['tasks'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: augrc-leaves-the-suite-result-standing}
    - {file: docs/TECHNIQUES.md, marker: augrc-leaves-the-suite-result-standing}

- id: top1-beats-the-margin-on-multiclass
  statement: "Among the model's own confidence readings on exp70's 24 tasks, one minus the top probability ranks errors better than top-1 minus top-2 on 14 of the 16 multi-class tasks, all 6 multi-class segmentation tasks (preregistered P1) and 8 of 10 classification tasks, under excess AURC and under AUROC alike, and captures more errors at a 5% and at a 10% budget on 13 of them against 2; it loses on awf_sentinel2 and on nandi_sentinel1. The difference is small, a median 0.0006 of excess AURC beside a median lead of the margin over the best no-model control of 0.116, and on the 8 binary tasks the forms are one ranking."
  status: supported
  experiments: [exp76, exp70]
  artifacts: [exp/out/exp76_summary.json]
  check: |-
    (lambda V, R, M:
      V['P1']['holds'] is True and V['P1']['one_minus_top1_better'] == 6 and V['P1']['margin_better'] == 0 and V['P1']['of'] == 6
      and V['descriptive']['one_minus_top1_vs_margin_multiclass'] == {'excess_aurc': [14, 2], 'auroc': [14, 2]} and V['descriptive']['n_multiclass'] == 16
      and sorted(t for t in M if R[t]['signals']['one_minus_top1']['excess_aurc'] > R[t]['signals']['margin']['excess_aurc']) == ['awf_sentinel2', 'nandi_sentinel1']
      and [sum(1 for t in M if R[t]['signals']['one_minus_top1']['capture'][b] > R[t]['signals']['margin']['capture'][b]) for b in ('0.05', '0.1')] == [13, 13]
      and [sum(1 for t in M if R[t]['signals']['one_minus_top1']['capture'][b] < R[t]['signals']['margin']['capture'][b]) for b in ('0.05', '0.1')] == [2, 2]
      and sum(1 for t in R if R[t]['n_classes'] == 2) == 8
      and (lambda d: round((d[7] + d[8]) / 2, 4) == 0.0006)(sorted(R[t]['signals']['margin']['excess_aurc'] - R[t]['signals']['one_minus_top1']['excess_aurc'] for t in M))
      and (lambda d: round((d[11] + d[12]) / 2, 3) == 0.116)(sorted(R[t]['margin_lead'] for t in R))
    )(A['exp/out/exp76_summary.json']['verdicts'], A['exp/out/exp76_summary.json']['results']['tasks'], [t for t in A['exp/out/exp76_summary.json']['results']['tasks'] if A['exp/out/exp76_summary.json']['results']['tasks'][t]['n_classes'] > 2])
