  experiments: [exp77]
  artifacts: [exp/out/exp77_summary.json]
  check: |-
    (lambda s:
      s['prereg']['P2_decontamination_improves_accuracy']['holds'] is False
      and s['prereg']['P2_decontamination_improves_accuracy']['n'] == 0
      and all(r['gain'] < 0 for r in s['tasks'])
      and all(r['lambda'] == 0.5 for r in s['tasks'])
      and round(min(r['gain'] for r in s['tasks']) * 100, 2) == -0.98
      and max(r['seed_floor'] for r in s['tasks']) < 0.005
    )(A['exp/out/exp77_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: removing-the-scene-direction-does-not-help}
  note: >-
    The strength grid was {0.5, 1.0} and could not express "remove nothing", so a unanimous 0.5 means the holdout
    was choosing between two harms. Arm A reproduces exp70's accuracy exactly on three tasks and within that task's
    reseed spread on three more; on PASTIS Sentinel-1 it is 5.7e-05 away against a 4.1e-05 spread.

- id: scene-contamination-diagnosis-has-nothing-to-locate
  statement: "The size of the typicality gap does not rank positively with the size of the accuracy change across the seven tasks (Spearman rho = -0.49); with every change negative the correlation is among failures, and the label-free variant of the prediction was gated on the intervention paying and is not graded."
