- id: exp97-sequential-certificate-holds-at-every-look
  statement: "A sequential certificate (each grid zone tested by a uniform-weight mixture of likelihood ratios for sampling without replacement, in a fixed sequence from an anchor fixed before the labels, passes kept) held its guarantee at every look on 366 maps (exp95's 34 and exp96's 332; preregistered): over 3,122 violation rates, the largest was 0.1175 at delta 0.1 (bound 0.175, none above three standard errors), the default anchors' at most 0.0975, and the median full-claim violation 0.03; its certified zone never shrank, and the harness equalled the package on 37,764 comparisons."
  crosscheck: tests/test_exp97.py::test_exp97_verdicts_from_the_summary
  status: supported
  experiments: [exp97]
  artifacts: [exp/out/exp97_summary.json, exp/out/exp96_summary.json]
  check: |-
    (lambda d, h: (lambda C, S: d["preregistered"] is True and len(C) == 366
      and d["input_sha256"] == h["input_sha256"]
      and set(C) == {"exp96:" + k[:-4] for k in h["input_sha256"]} | {k for k in C if k.startswith("exp95:")}
      and sum(k.startswith("exp95:") for k in C) == 34
      and len([r for k, a in S for r in (C[k]["arm"][a]["pathwise_violation"], C[k]["arm"][a]["full_claim_violation"])]) == 3122
      and max(max(C[k]["arm"][a]["pathwise_violation"], C[k]["arm"][a]["full_claim_violation"]) for k, a in S) == 0.1175
      and not any(max(C[k]["arm"][a]["pathwise_violation"], C[k]["arm"][a]["full_claim_violation"]) > 0.1 + 3 * (0.09 / 400) ** 0.5 for k, a in S)
      and max(C[k]["arm"][a]["full_claim_violation"] for k, a in S if a.startswith("S(n0=")) == 0.0975
      and median(C[k]["arm"][a]["full_claim_violation"] for k, a in S) == 0.03
      and all(C[k]["arm"][a]["full_claim_violation"] >= C[k]["arm"][a]["pathwise_violation"] and C[k]["arm"][a]["never_falls"] for k, a in S)
      and sum(v["check"]["comparisons"] for v in C.values()) == 37764
      and all(v["check"]["mismatches"] == [] and v["check"]["refused"] == 0 for v in C.values())
      and d["prereg"]["P1"]["holds"] is True and d["prereg"]["P2"]["holds"] is True and d["prereg"]["decision"]["ships_as_option"] is True
