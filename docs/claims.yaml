- id: exp98-validation-points-sit-in-the-confident-part
  statement: "Ai2's AWF validation points sit in the more confident part of the record's re-run map (preregistered; P5 holds): on average a point is more confident than 64.7% of the map's pixels (one-sided 95% task-cluster lower bound 61.4%; 50% if the points' confidence were distributed as the map's). The design does not say why (experts may label where a class is clear; the validation cells border training cells) and gives no map accuracy. If points and map pixels of equal confidence were equally accurate, an assumption expert placement does not let the record check, the map would be less accurate than the points, since at the points the error rate rises as the confidence falls; under that assumption the points' error rate reweighted to the map's confidence fifths reads 21%, a model-based reading with no interval resting on 22 points (12 errors) in the least confident fifth, not an estimate."
