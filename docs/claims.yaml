- id: geoid-boundary-first-minority
  statement: "Across GEOID-Flood's events neither review order wins consistently. At the 5% budget the boundary-first order captures more errors than confidence on 18, 12 and 14 events and fewer on 9, 18 and 10 (permanent water, post-event water, flooded only; the rest tie), so it wins outright on a minority of events, 40%, 27% and 32%. By per-event excess AURC it is ahead on 30 of 45, 29 of 45 and 28 of 44 events, by medians under 1e-5. Pooled, the two tie."
  status: measured
  experiments: [exp55, exp36]
  artifacts: [exp/out/exp55_summary.json]
  check: |-
    (lambda d, R:
      all(d[k]['holds'] is False and d[k]['share'] < 0.5 for k in ('A_boundary_first_beats_confidence_at_5pct_on_majority',
          'B_boundary_first_beats_confidence_at_5pct_on_majority', 'C_boundary_first_beats_confidence_at_5pct_on_majority'))
      # capture at 5%: boundary-first wins, losses and ties per target
      and [tuple(R[t]['across_events']['boundary_first_vs_confidence_capture5'][k] for k in ('lex_wins', 'confidence_wins', 'ties'))
           for t in 'ABC'] == [(18, 9, 18), (12, 18, 15), (14, 10, 20)]
      # per-event excess AURC: the boundary-first order (the "control" side of that test) ahead on most events, by tiny medians
      and [(R[t]['across_events']['boundary first, then confidence']['control_wins'], R[t]['across_events']['boundary first, then confidence']['confidence_wins']
            + R[t]['across_events']['boundary first, then confidence']['control_wins'] + R[t]['across_events']['boundary first, then confidence']['ties'])
           for t in 'ABC'] == [(30, 45), (29, 45), (28, 44)]
      and all(abs(R[t]['across_events']['boundary first, then confidence']['median_lead']) < 1e-5 for t in 'ABC')
    )(A['exp/out/exp55_summary.json']['prereg']['descriptive'], A['exp/out/exp55_summary.json']['results'])
  cited_in:
    - {file: docs/Findings.md, marker: geoid-boundary-first-minority}
    - {file: docs/TECHNIQUES.md, marker: geoid-boundary-first-minority}

