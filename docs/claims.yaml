- id: dfc2020-atlas-holds-with-our-own-encoder
  statement: "On DFC2020's 4,320,000 windows per arm the atlas findings hold under our own encoder on eight-class land cover: every one of the five compared pairs has differing windows that are boundary-enriched 2.32 to 3.30 times and low-margin-enriched 4.65 to 5.37 times, and the five difference sets are close to independent, median pairwise phi 0.078; the two references agree on 71.3% of the windows both label, and the three arms reach pixel mean intersection over union 0.431, 0.322 and 0.435, the joint arm above both single sensors."
