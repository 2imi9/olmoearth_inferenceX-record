- id: exp113-which-embedding-agrees-best
  statement: "In exp113 the map that agrees best with the labels is v1.3's in Guadeloupe, Martinique, Réunion and Mayotte and TESSERA v2's in Guyane. The gaps are 0.12 points or less in Guyane, Mayotte and between v1.3 and TESSERA v2 in Réunion, where 400 labels drawn where two maps differ name the better map with probability 0.04 to 0.16 (Mayotte's maps differ on 40 to 120 windows, a census); 0.4 to 1.9 points in Guadeloupe and Martinique (probability 0.65 to 1.0); and 10.6 to 10.7 points against AlphaEarth in Réunion. The mean held-out pixel mIoU orders the maps v1.3 (0.200), TESSERA v2 (0.185), AlphaEarth (0.168), the order of the v1.3 report's PLANTEUR table; that is consistent with the report, not a test of it."
  crosscheck: tests/test_exp113.py::test_exp113_recorded_by_a_second_route
