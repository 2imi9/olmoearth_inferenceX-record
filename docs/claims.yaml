      and [round(cl('planteur|loio:Guyane|oe13', '1')[k], 3) for k in ('m', 'p')] == [0.001, 0.143]
      and round(max(cl('planteur|loio:Mayotte|oe13', str(k))['by_n']['400']['share']['flag_too_little'] for k in range(1, 8) if '400' in cl('planteur|loio:Mayotte|oe13', str(k))['by_n']), 3) == 0.716
