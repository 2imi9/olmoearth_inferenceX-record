      and C['verdicts']['P3']['holds'] is True and C['verdicts']['P4']['holds'] is True
      and set(S['verdicts']['P3']['maps']) == {'Guadeloupe', 'Martinique', 'Guyane', 'Réunion', 'Mayotte'}
      and min(S['verdicts']['P3']['maps'].values()) == 1.0 and min(S['verdicts']['P3']['exact'].values()) > 0.9999
      and round(S['verdicts']['P4']['max_size_exact'], 3) == 0.023 and S['verdicts']['P4']['cells'] == 36
      and round(S['maps']['default']['oe13']['random']['400']['reject_em_exact'], 3) == 0.875
      and [round(S['maps'][c]['oe13']['random']['400']['label_corrected_mean']['main_producer_accuracy'], 3) for c in ('loio:Guyane', 'loio:Réunion')] == [0.072, 0.089]
