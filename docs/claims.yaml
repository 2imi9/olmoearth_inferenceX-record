- id: accuracy-needs-coverage
  statement: The fine-tuned AWF model is overconfident (ECE 0.080; 0.93 accurate where it claims 0.99), so a stated accuracy needs a coverage; keeping the 80% most confident windows raises accuracy from 0.881 to 0.945.
  crosscheck: tests/test_recorded.py::test_exp21_fine_tuned_model_metrics_from_the_per_window_table
  status: supported
  experiments: [exp21]
  artifacts: [exp/out/exp21_summary.json]
  check: |-
    (lambda c:
      round(c['ece_10bins'], 3) == 0.080 and round(c['accuracy'], 3) == 0.881
      and round(c['selective_accuracy_at_coverage']['0.8'], 3) == 0.945 and round(c['selective_accuracy_at_coverage']['0.9'], 3) == 0.919
      and c['reliability'][-1][2] == 299 and round(c['reliability'][-1][3], 2) == 0.99 and round(c['reliability'][-1][4], 2) == 0.93
    )(A['exp/out/exp21_summary.json']['crops']['16'])
  cited_in:
    - {file: docs/Findings.md, marker: accuracy-needs-coverage}
    - {file: docs/results/comparisons.md, marker: accuracy-needs-coverage}

- id: served-product-boundary-triage
  statement: The served land cover change rasters export no class confidence, and boundary fraction alone captures a median 0.88 of the WorldCover water disagreements at a 5% review budget on the sites that have any.
  status: supported
  experiments: [exp20]
  artifacts: [exp/out/exp20_lcc_production.json]
  check: |-
    (lambda s:
      round(s['water_capture@0.05_median_over_sites_with_disagreements'], 2) == 0.88 and s['sites_with_water_disagreements'] == 6
      and s['water_aurc_boundary_below_random_sites'] == 6 and s['n_sites'] == 10
      and round(s['water_boundary_share_errors_median'], 2) == 0.92 and round(s['water_boundary_share_correct_median'], 2) == 0.01
    )(A['exp/out/exp20_lcc_production.json']['summary'])
  cited_in:
    - {file: docs/Findings.md, marker: served-product-boundary-triage}
    - {file: docs/TECHNIQUES.md, marker: served-product-boundary-triage}
    - {file: docs/results/comparisons.md, marker: served-product-boundary-triage}
  note: Legends and dates differ, so these are reference disagreements, not counted model errors.

- id: w1-accuracy-gain
  statement: Averaging the four tilings' decisions per pixel raises pixel accuracy on hand labels by 1.0 points on Bolivia (0.897 to 0.907, better on 321 tiles, worse on 66) and 0.9 on the test split (0.941 to 0.950, 583/78), preregistered, with no labels and no retraining.
  status: supported
  experiments: [exp42]
  artifacts: [exp/out/exp42_summary.json]
  check: |-
    (lambda s:
      s['prereg']['supported'] is True
      and (s['results']['bolivia']['prereg_W1_vs_W0_pixel']['w'], s['results']['bolivia']['prereg_W1_vs_W0_pixel']['l']) == (321, 66)
      and (s['results']['test']['prereg_W1_vs_W0_pixel']['w'], s['results']['test']['prereg_W1_vs_W0_pixel']['l']) == (583, 78)
      and round(s['results']['bolivia']['pixel_accuracy_mean']['W0 grid'], 3) == 0.897 and round(s['results']['bolivia']['pixel_accuracy_mean']['W1 shift-averaged'], 3) == 0.907
      and round(s['results']['test']['pixel_accuracy_mean']['W0 grid'], 3) == 0.941 and round(s['results']['test']['pixel_accuracy_mean']['W1 shift-averaged'], 3) == 0.950
      and round(100 * s['results']['bolivia']['prereg_W1_vs_W0_pixel']['mean_gain'], 1) == 1.0 and round(100 * s['results']['test']['prereg_W1_vs_W0_pixel']['mean_gain'], 1) == 0.9
    )(A['exp/out/exp42_summary.json'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: w1-accuracy-gain}
    - {file: docs/results/comparisons.md, marker: w1-accuracy-gain}

- id: mixed-label-windows-not-a-ceiling
  statement: Mixed-label windows are 10% of the windows and carry 45% (Bolivia) and 58% (test split) of the grid window's errors, but the block-constant oracle limit is 3% of pixels, so the block forces at most 29% and 49% of those errors and the averaged map still puts 43% and 56% of its own errors there.
  status: measured
  experiments: [exp42, exp43]
  artifacts: [exp/out/exp42_summary.json, exp/out/exp43_summary.json]
  check: |-
    (lambda s42, s43:
      round(s42['results']['bolivia']['purity']['share_of_errors_on_impure_windows'], 2) == 0.45 and round(s42['results']['test']['purity']['share_of_errors_on_impure_windows'], 2) == 0.58
      and all(round(s42['results'][n]['purity']['share_of_windows_impure'], 1) == 0.1 for n in ('bolivia', 'test'))
      and round(s43['results']['bolivia']['block_constant_oracle_limit']['rate'], 3) == 0.030 and round(s43['results']['test']['block_constant_oracle_limit']['rate'], 3) == 0.029
      and round(s43['results']['bolivia']['block_constant_oracle_limit']['rate'] / (1 - s42['results']['bolivia']['pixel_accuracy_mean']['W0 grid']), 2) == 0.29
      and round(s43['results']['test']['block_constant_oracle_limit']['rate'] / (1 - s42['results']['test']['pixel_accuracy_mean']['W0 grid']), 2) == 0.49
      and round(s43['results']['bolivia']['w1_errors_by_grid_window_purity']['share_of_w1_errors_on_impure_windows'], 2) == 0.43
      and round(s43['results']['test']['w1_errors_by_grid_window_purity']['share_of_w1_errors_on_impure_windows'], 2) == 0.56
    )(A['exp/out/exp42_summary.json'], A['exp/out/exp43_summary.json'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: mixed-label-windows-not-a-ceiling}
    - {file: docs/results/comparisons.md, marker: mixed-label-windows-not-a-ceiling}

- id: label-fitted-fusion-three-of-four
  statement: A logistic combination of ten label-free signals fitted on the head's own training split beats confidence by 24-38% of excess AURC on Bolivia under both backbones and on the v1 test split; on the v1.2 test split its lead is below the worthwhile threshold, and the degree-2 combiner is worse than the linear one everywhere.
  status: mixed
  experiments: [exp47, exp49]
  artifacts: [exp/out/exp49_summary.json]
  check: |-
    (lambda s:
      {(v, n): s['results'][v][n]['tests']['fusion linear (labelled)']['beats_confidence'] for v in ('v1', 'v1_2') for n in ('bolivia', 'test')} == {('v1', 'bolivia'): True, ('v1', 'test'): True, ('v1_2', 'bolivia'): True, ('v1_2', 'test'): False}
      and all(0.0027 <= round(-s['results'][v][n]['tests']['fusion linear (labelled)']['pooled_lead'], 4) <= 0.0041 for v, n in (('v1', 'bolivia'), ('v1', 'test'), ('v1_2', 'bolivia')))
      and all(0.23 <= 1 - s['results'][v][n]['pooled_eaurc']['fusion linear (labelled)'] / s['results'][v][n]['pooled_eaurc']['averaged confidence'] <= 0.38 for v, n in (('v1', 'bolivia'), ('v1', 'test'), ('v1_2', 'bolivia')))
      and round(-s['results']['v1_2']['test']['tests']['fusion linear (labelled)']['pooled_lead'], 4) == 0.0004
      and all(s['results'][v][n]['pooled_eaurc']['fusion poly2 (labelled)'] > s['results'][v][n]['pooled_eaurc']['fusion linear (labelled)'] for v in ('v1', 'v1_2') for n in ('bolivia', 'test'))
    )(A['exp/out/exp49_summary.json'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: label-fitted-fusion-three-of-four}
    - {file: docs/results/comparisons.md, marker: label-fitted-fusion-three-of-four}
  note: The relative gains on the three winning arms are 29%, 38% and 24% of confidence's excess AURC (the docs print 24-38%); the absolute leads are 0.0027, 0.0041 and 0.0027.

- id: fusion-weight-on-ndwi
  statement: The label-fitted fusion's weight sits on the no-model NDWI-level control with the ensemble entropies and confidence behind it, and dropping NDWI level costs the most on three of four arms, returning the fusion to confidence's level on Bolivia under v1.2.
  status: measured
  experiments: [exp50]
  artifacts: [exp/out/exp50_summary.json]
  check: |-
    (lambda s:
      all(max(s['results'][v]['fusion_weights'], key=lambda k: abs(s['results'][v]['fusion_weights'][k])) == 'control NDWI level' and round(s['results'][v]['fusion_weights']['control NDWI level'], 2) == 0.87 for v in ('v1', 'v1_2'))
      and all(s['results'][v]['fusion_weights'][k] > 0.5 for v in ('v1', 'v1_2') for k in ('ensemble average entropy', 'ensemble predictive entropy'))
      and all(0.3 <= s['results'][v]['fusion_weights']['averaged confidence'] <= 0.4 for v in ('v1', 'v1_2'))
      and all(max(s['results'][v][n]['drop_one_pooled_eaurc'], key=s['results'][v][n]['drop_one_pooled_eaurc'].get) == 'control NDWI level' for v, n in (('v1', 'bolivia'), ('v1', 'test'), ('v1_2', 'bolivia')))
      and abs(s['results']['v1_2']['bolivia']['drop_one_pooled_eaurc']['control NDWI level'] - s['results']['v1_2']['bolivia']['pooled_eaurc']['averaged confidence']) < 0.0005
    )(A['exp/out/exp50_summary.json'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: fusion-weight-on-ndwi}
    - {file: docs/results/comparisons.md, marker: fusion-weight-on-ndwi}

