- id: dw-errors-carry-the-cues
  statement: "The explanation layer transfers to a served product: among Dynamic World's error windows the boundary cue fires 2.93 times as often as among its correct ones (59% against 20%), the bottom margin quintile 3.93 times and the top entropy quintile 3.51 times; preregistered P3 holds, and the boundary-first review order nonetheless loses to the margin at nine classes as it does at eight, fifteen and nineteen."
