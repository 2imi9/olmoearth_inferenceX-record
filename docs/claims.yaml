  statement: "On the demo's tile 19% of the scored windows are wrong; of the 5% of windows flagged without labels 67% are wrong, and they hold 17% of the map's errors where no 5% could hold more than 26% (the 10% flagged hold 32%, the 20% flagged 55%); 97% of the flagged windows sit on a boundary of the model's own map."
