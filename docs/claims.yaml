    Not preregistered: a reading of committed per-unit files after exp88 was recorded, prompted by the red team of
    30 September 2026. The matched probe is exp70's seed-0 probe as exported per unit by exp78 (Base, committed) and
    exp79 (Large; exp79_units is not committed, and each file is used only when its sha256 equals the one
    exp/out/exp79_seeds/olmoearth_large.json records). The probes differ in learning rate: Base's S1 probe was
