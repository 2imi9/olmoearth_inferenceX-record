- id: window-aggregator-is-not-the-lever
  statement: "On the 7 segmentation tasks the mean over a window's pixels of one minus the top probability beats the record's window score, the margin of window-mean probabilities, on 6, so preregistered P3, that no aggregator would reach 6, fails as written; but the same form computed on window-mean probabilities beats that pixel-level aggregate on 6 of 7, so the gain is the form's and not the aggregation's. The pixel-level margin beats the window margin on 3 of 7, the smallest pixel margin and the share of low-margin pixels on none, and the mean over the 3x3 windows around a window on 1, m_sa_crop_type, 0.0638 against 0.0672. The aggregator option the preregistration named was not added to the package; the form option was."
