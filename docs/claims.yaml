- id: per-class-intervals-wald-fails-wilson-nearly-holds
  statement: "On the 24 tasks of the suite (17 classification tasks from exp78's export, 7 segmentation tasks from exp79's OlmoEarth Base export) at 300 and 1,000 random or confidence-designed labels, per-class intervals for user's accuracy, producer's accuracy and class share (classes with at least 30 expected labels): the shipped forms leave 14 of 628 cells below 0.93, none below 0.879, five on the near-census Togo tasks under the confidence design and nine rare-error cells (three on Brick Kiln and Nandi Landsat, five producer's-accuracy and share cells on EuroSAT, one MADOS producer's accuracy of 0.9998); no graded random-design user's-accuracy cell, the exact hypergeometric interval, covers below 0.947; with the field's Wald form 107 of 522 cells cover below 0.93, the worst 0.019."
  crosscheck: tests/test_estimate.py::test_the_exact_interval_is_the_tail_inversion_and_covers_at_least_nominal_by_enumeration
  status: mixed
  experiments: [exp81]
  artifacts: [exp/out/exp81_summary.json]
  check: |-
    (lambda s: (lambda p, w, ua:
      p['n_cells'] == 628 and len(p['failing']) == 14 and round(min(f['coverage'] for f in p['failing']), 3) == 0.879
      and sum(f['task'].startswith('cropharvest_Togo') and f['design'] == 'confidence' for f in p['failing']) == 5
      and sum(f['task'] in ('m_brick_kiln', 'nandi_landsat') and f['design'] == 'confidence' for f in p['failing']) == 3
      and sum(f['task'] == 'm_eurosat' and f['quantity'] in ('producer_accuracy', 'reference_share') for f in p['failing']) == 5
      and [(f['task'], f['class'], f['quantity']) for f in p['failing'] if f['task'] == 'mados'] == [('mados', 7, 'producer_accuracy')]
      and not any(f['design'] == 'random' and f['quantity'] == 'user_accuracy' for f in p['failing'])
      and round(min(ua), 3) == 0.947
      and w['n_cells'] == 522 and w['n_failing'] == 107 and round(w['min_coverage'], 3) == 0.019
      and len(s['tasks']) == 24 and s['config']['draws'] == 2000
    )(s['prereg']['P1_every_reported_interval_is_honest'], s['prereg']['P1_under_the_wald_form'],
      [pc['user_accuracy']['coverage'] for row in s['tasks'].values() for c in row['cells'] if c['design'] == 'random' and c['interval'] == 'wilson'
       for pc in c['per_class'].values() if pc['user_accuracy']['coverage'] is not None and pc['user_accuracy']['eligible_share'] >= 0.5])
    )(A['exp/out/exp81_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: per-class-intervals-wald-fails-wilson-nearly-holds}
    - {file: docs/Findings.md, marker: per-class-intervals-wald-fails-wilson-nearly-holds}
  note: >-
    The counts are read from the graded blocks, which `exp/exp81_per_class.py --stage grade` recomputes from the
    per-cell coverages; the minimum random-design user's-accuracy coverage is recomputed here from the cells. The
    crosscheck writes the exact interval out by scanning every count and enumerates its coverage. Preregistered P1
    (every cell at or above 0.93) is recorded as failed. Rerun on 23 September under the sixth amendment: until then
    the random-design user's accuracy was a finite-population Wilson form that covered 0.70 on a one-error class, and
    six EuroSAT cells were passed by an exemption that compared each with its own exact coverage.

- id: confidence-design-serves-the-classes-too
