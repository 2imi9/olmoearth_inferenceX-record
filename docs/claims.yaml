    - {file: docs/results/comparisons.md, marker: lucas-provenance-gap-is-not-boundary-specific}
  note: >-
    The two arms differ in geometry far more than in provenance: within the same matched cells the photo arm's median
    polygon is 44 sqm against the field arm's 2,096 and its median window purity 0.012 against 0.590, so class and
