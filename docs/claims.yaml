- id: exp110-ftw-certified-share-at-300-labels
  statement: "In the record's first test on another organisation's deployed product outside land cover (exp110, preregistered), certify at alpha 0.05, delta 0.10 and 300 random labels (2,000 draws, draw r with seed 110 + r) gives FTW's 2nd-edition field map a median certified share of 0.40 (Belgium), 0.45 (Croatia), 0.90 (Slovenia) and 0.00 (Sweden), so preregistered P3(b), a quarter in 2 of 4 countries, holds in 3 of 4, but the verdict is fragile: each country certifies any zone with an exact probability near one half (0.525, 0.517, 0.525 and 0.484; pooled 0.515), so the certified share has two modes, no zone or a large one, and each median sits on that edge. Sweden's 0.00 follows from its 0.484; an independent set of 2,000 draws gave Croatia 0.55; with these exact probabilities P3(b) holds in 3 of 4 in the limit of many draws, and 2,000 draws put a median at zero with probability about 0.07 (Croatia) and 0.014 (Belgium, Slovenia). Those probabilities sit at or below the limit any map has at this budget: at 300 labels and alpha 0.05 the 15% level enters expecting exactly the 45 labels it needs, so even a perfect map certifies with probability at most about 0.525 (Belgium and Slovenia are at it), and P3(b) here turned on whether each country's most confident 15% was almost free of errors (exp112). A certified zone's true error rate has a median of 0.022 to 0.029. Between 22% and 51% of each country's windows sit at confidence exactly 1.0, so which of them enter a zone is set by the package's tie rule (by index, the mosaic's raster order), not by evidence; the rule is fixed before any label is read, so the guarantee stands."
  crosscheck: tests/test_exp110.py::test_exp110_recorded_by_a_second_route
  status: supported
  experiments: [exp110, exp112]
  artifacts: [exp/out/exp110_summary.json, exp/out/exp110_crosscheck.json]
  check: |-
    (lambda S, C: (lambda P, V, L, X, cs: V['P3b']['holds'] is True and V['P3b']['countries_meeting'] == ['belgium', 'croatia', 'slovenia']
      and [V['P3b']['median_certified_share'][c] for c in cs] == [0.4, 0.45, 0.9, 0.0]
      and [round(X[c]['arm3']['exact_p_certify_any_0.05'], 3) for c in cs + ('pooled',)] == [0.525, 0.517, 0.525, 0.484, 0.515]
      and X['croatia']['arm3']['0.05']['independent_seeds']['median_certified_share'] == 0.55
      and C['verdicts_independent_certify_draws']['P3b']['countries_meeting'] == ['belgium', 'croatia', 'slovenia']
      and round(X['croatia']['arm3']['p_at_most_half_of_2000_draws_certify'], 2) == 0.07
      and [round(X[c]['arm3']['p_at_most_half_of_2000_draws_certify'], 3) for c in ('belgium', 'slovenia')] == [0.014, 0.014]
      and [round(P[c]['arm3']['by_alpha']['0.05']['zone_true_error']['median'], 3) for c in cs] == [0.022, 0.029, 0.027, 0.022]
      and [round(f(L[c]['map_windows_at_confidence_1'] / L[c]['windows'] for c in cs), 2) for f in (min, max)] == [0.22, 0.51]
    )(S['populations'], S['verdicts'], S['label_free']['countries'], C['populations'], ('belgium', 'croatia', 'slovenia', 'sweden')))(A['exp/out/exp110_summary.json'], A['exp/out/exp110_crosscheck.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: exp110-ftw-certified-share-at-300-labels}
    - {file: docs/Findings.md, marker: exp110-ftw-certified-share-at-300-labels}
  note: >-
    The exact probability of certifying any zone (the first testable level, 0.15 of the windows at alpha 0.05 and 300
    labels, passing; the review-set guard aside) and the independent draws are the crosscheck's (exp/exp110_crosscheck.py,
    seed 20261014), not the run's. The run computed certify_zone's steps once per population and called certify_zone
    itself on 20 draws per population, which agreed; the crosscheck reproduces all 2,000 draws count for count.

- id: exp110-ftw-which-map-at-100-labels
  statement: "In the record's first test on another organisation's deployed product outside land cover (exp110, preregistered), 100 labels drawn where FTW's 2nd-edition field map and FTW's PRUE B3 model (the CC-BY checkpoint of ftw-baselines v3.1, run by the record on the benchmark's two Sentinel-2 windows) differ name the better-agreeing map, by the exact sign test, with probability 0.858 in Belgium (B3: 7,773 windows where only the 2e map is right against 14,811 where only B3 is), 0.999 in Croatia (the 2e map: 35,408 against 12,378) and 0.993 in Sweden (B3: 16,238 against 41,516): preregistered P4(b) holds in 3 of 4 countries. Slovenia (0.141; 6,415 against 5,210) and the pooled population (0.063; B3, 65,834 against 73,915) do not reach 0.8 at 100 labels (0.410 and 0.153 at 300). B3 is the better-agreeing map in Belgium, Sweden and pooled under both the graded and the field + boundary truth. The page expected the 2e map to lead because B3 never saw these countries; after freezing, before any label was read, the B3 run's reading of FTW's v3.1 release notes and prue_efnet3.yaml showed that B3 most likely trained on their train chips too, and the owner withdrew that expectation in a dated amendment, bars and verdicts unchanged: the result says which map agrees better with these labels on these test chips, not which generalises better."
  crosscheck: tests/test_exp110.py::test_exp110_recorded_by_a_second_route
  status: supported
  experiments: [exp110]
  artifacts: [exp/out/exp110_summary.json, exp/out/exp110_crosscheck.json]
  check: |-
    (lambda S, C: (lambda P, V, pops: V['P4b']['holds'] is True and V['P4b']['countries_meeting'] == ['belgium', 'croatia', 'sweden']
      and [round(P[c]['arm4']['budgets']['100']['p_right'], 3) for c in pops] == [0.858, 0.999, 0.141, 0.993, 0.063]
      and [round(P[c]['arm4']['budgets']['300']['p_right'], 3) for c in ('slovenia', 'pooled')] == [0.41, 0.153]
      and [(P[c]['arm4']['K_A'], P[c]['arm4']['K_B']) for c in pops] == [(7773, 14811), (35408, 12378), (6415, 5210), (16238, 41516), (65834, 73915)]
      and [P[c]['arm4']['better_agreeing'] for c in pops] == ['b3', '2e', '2e', 'b3', 'b3']
      and [C['field_plus_boundary'][c]['arm4']['better_agreeing'] for c in ('belgium', 'sweden', 'pooled')] == ['b3', 'b3', 'b3']
      and all(P[c]['arm4']['budgets']['100']['rule'] == 'sign' for c in pops)
    )(S['populations'], S['verdicts'], ('belgium', 'croatia', 'slovenia', 'sweden', 'pooled')))(A['exp/out/exp110_summary.json'], A['exp/out/exp110_crosscheck.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: exp110-ftw-which-map-at-100-labels}
    - {file: docs/Findings.md, marker: exp110-ftw-which-map-at-100-labels}
    - {file: docs/Summary.md, marker: exp110-ftw-which-map-at-100-labels}
  note: >-
    Arithmetic on (N, D, K_A, K_B) once the counts are known, as the page says; what it measures is mostly the size of
    the gap. The two maps differ in model, input imagery (the benchmark's two Sentinel-2 windows against quarterly
    mosaics) and label definition (B3 was trained on v1's own masks), and both most likely trained on these
    countries' train chips; the population leaves out windows with a pixel zero in every band of either Sentinel-2
    window (713 in Sweden, 7 in Belgium). B3's run (checkpoint opened with weights_only=True) passed both label-free
    stop rules (agreement with the 2e map 0.867 to 0.950, above 0.70; the band-swapped control lower everywhere).

- id: exp110-ftw-labelled-routes-keep-their-guarantees
  statement: "The three checks of exp110 hold on FTW's 2nd-edition field map at 1,295 FTW benchmark test chips, in the record's first test on another organisation's deployed product outside land cover (preregistered; checks of the package's reading of a third party's map, not predictions): the package's exact interval covers the window error rate with probability at least 0.957 in all 10 cells (four countries and pooled, 100 and 300 random labels; bar 0.95), 2,000 draws per cell agreeing within 1.69 Monte Carlo standard errors (P2); at alpha 0.05 and 300 labels the share of 2,000 draws certifying a zone wrong more often than alpha is 0.038, 0.040, 0.000 and 0.0185 in Belgium, Croatia, Slovenia and Sweden and 0.0105 pooled (bar 0.115; an independent set of 2,000 draws at most 0.048) (P3(a)); and labels drawn where the map and PRUE B3 differ name the worse-agreeing map with probability at most 0.0036 (pooled, 100 labels; bar 0.025) (P4(a)). The labels are the benchmark's masks, taken as right."
  crosscheck: tests/test_exp110.py::test_exp110_recorded_by_a_second_route
  status: measured
  experiments: [exp110]
