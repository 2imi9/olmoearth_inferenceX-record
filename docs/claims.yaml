    - {file: docs/results/comparisons.md, marker: encode-path-reproduces-their-probe}

- id: finetune-corrects-frozen-errors
  statement: Fine-tuning OlmoEarth Base on Sen1Floods11 with Ai2's recipe corrects at least 40% of the frozen head's shift-averaged errors on both testbeds (66% Bolivia, 44% multi-region under v1) and lifts window accuracy from 0.917 / 0.955 to 0.954 / 0.967 (preregistered P2).
  status: supported
  experiments: [exp52]
  artifacts: [exp/out/exp52_summary.json]
  check: |-
    (lambda s, r:
      s['prereg']['P2'] is True and s['prereg']['complete'] is True
      and all(r[n]['vs_frozen_head']['share_corrected'] >= 0.40 and r[n]['vs_frozen_head']['corrected'] > r[n]['vs_frozen_head']['broken'] for n in ('bolivia', 'test'))
      and round(r['bolivia']['vs_frozen_head']['share_corrected'], 2) == 0.66 and round(r['test']['vs_frozen_head']['share_corrected'], 2) == 0.44
      and all(r[n]['window_accuracy'] > r[n]['frozen_window_accuracy'] + 0.01 for n in ('bolivia', 'test'))
    )(A['exp/out/exp52_summary.json'], A['exp/out/exp52_summary.json']['results']['FT-S2 v1'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: finetune-corrects-frozen-errors}
    - {file: docs/results/comparisons.md, marker: finetune-corrects-frozen-errors}

- id: finetune-dissolves-bolivia-exception
  statement: The fine-tuned S2 model's own confidence beats the no-model NDWI-level control on Bolivia under both backbones (preregistered P1), so the Bolivia exception belonged to the frozen encoder; on the multi-region split it ties pooled under v1 while winning per tile, and beats it under v1.2.
