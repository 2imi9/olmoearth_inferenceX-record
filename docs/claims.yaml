- id: boundary-fraction-equals-tile-phase
  statement: The zero-cost boundary fraction of the shift-0 map is statistically indistinguishable from aligned tile-phase (boundary better on 12 scenes, tile-phase on 15, sign p=0.70), beats confidence on 19 of 27 (p=0.052) and the pixel control on 22 of 27.
  status: measured
  experiments: [exp14]
  artifacts: [exp/out/exp13_summary.json, exp/out/exp14_boundary_ablation.csv]
  check: |-
    (lambda e, c:
      (e['boundary_vs_tile']['w'], e['boundary_vs_tile']['l']) == (12, 15) and round(e['boundary_vs_tile']['sign_p'], 2) == 0.70
      and (e['boundary_vs_baseline']['w'], e['boundary_vs_baseline']['l']) == (19, 8) and round(e['boundary_vs_baseline']['sign_p'], 3) == 0.052
      and (e['boundary_vs_control']['w'], e['boundary_vs_control']['l']) == (22, 5) and (e['gradient_vs_tile']['w'], e['gradient_vs_tile']['l']) == (2, 25)
      and e['best_tally'] == {'pred-boundary': 10, 'tile-phase (aligned)': 10, 'control': 5, 'baseline': 2}
      and sum(float(r['pred-boundary']) < float(r['tile-phase (aligned)']) for r in c) == 12 and sum(float(r['pred-boundary']) < float(r['baseline']) for r in c) == 19
    )(A['exp/out/exp13_summary.json']['exp14'], A['exp/out/exp14_boundary_ablation.csv'])
  cited_in:
