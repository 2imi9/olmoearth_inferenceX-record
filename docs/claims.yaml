- id: dw-margin-beats-naive-confidence
  statement: "On Dynamic World's test tiles the top-1 minus top-2 margin beats one minus the top-1 probability as a ranker of the product's own errors (pooled excess AURC 0.0637 against 0.0651, better on 238 tiles against 167, one-sided p = 2.4e-04), and the reason is ties: the naive form takes the same value on 1,017,570 of the 4,348,526 windows (23.4%) where the margin ties on 156,842 (3.6%); preregistered P2 holds, on a model this project had no hand in, for the design choice made in exp13."
