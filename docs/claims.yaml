      and [round(v1['P2b'][k], 3) for k in ('auc_strict_only_vs_correct', 'auc_lenient_vs_correct', 'gap')] == [0.646, 0.78, 0.135]
      and [round(x1['P2'][k]['auc_strict_only_vs_correct'], 3) for k in ('region_weighted', 'unweighted')] == [0.665, 0.653]
