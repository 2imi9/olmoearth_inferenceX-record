    (lambda s: (lambda c:
      s['prereg']['P1_the_interval_is_honest']['holds'] is True
      and len(c) == 7 and min(c) >= 0.93 and round(min(c), 3) == 0.933 and round(max(c), 3) == 0.961
      and s['prereg']['P1_the_interval_is_honest']['n'] == 7
      and s['config']['R'] == 2000 and s['config']['headline_budget'] == 300
    )([v['budgets']['300']['D1/E1']['coverage'] for v in s['tasks'].values()]))(A['exp/out/exp78_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: design-based-interval-is-honest}
    - {file: docs/Findings.md, marker: design-based-interval-is-honest}
    - {file: docs/Summary.md, marker: design-based-interval-is-honest}
  note: >-
    MADOS sits on the 0.93 bar. The pilot had already shown it there (0.933), and the preregistration named it in
    advance as Wilson's discreteness at about 22 errors in a 300-window sample rather than a defect. The check recomputes the coverages from the per-task records
    instead of reading the verdict, so editing the verdict block alone cannot make it pass.

- id: tile-sampling-breaks-the-naive-interval
  statement: "Spending a 300-window budget as 18 tiles of 16 windows (300 // 16) and then applying the ordinary independent-sample formula gives a nominal-95% interval that covers on 0.506 to 0.777 of draws on 6 of the 7 segmentation tasks, with a median design effect of 2.94; a cluster-corrected ratio estimator restores coverage to 0.913-0.932 on the four tasks with full tiles, to 0.824 on Sen1Floods11, and not on MADOS, whose tiles hold 1 to 400 valid windows, where it covers 0.598."
  crosscheck: tests/test_recorded.py::test_exp78_coverages_reproduce_in_a_small_seeded_monte_carlo_from_the_per_unit_files
  status: supported
  experiments: [exp78]
  artifacts: [exp/out/exp78_summary.json]
  check: |-
    (lambda s: (lambda t, naive, deff:
      s['prereg']['P2_the_naive_interval_is_badly_wrong']['holds'] is True
      and sum(1 for v in naive.values() if v < 0.85) == 6
      and median(deff.values()) >= 2.5 and round(median(deff.values()), 2) == 2.94
      and round(min(naive.values()), 3) == 0.506 and naive['m_cashew_plant'] > 0.93
      and round(deff['m_cashew_plant'], 2) == 1.17
      and s['prereg']['P2_the_naive_interval_is_badly_wrong']['out_of_sample_tasks'] == ['m_sa_crop_type']
      and all(t[k]['budgets']['300']['D4/E1_cluster']['coverage'] > v for k, v in naive.items() if v < 0.85)
      and round(min(t[k]['budgets']['300']['D4/E1_cluster']['coverage'] for k in ('pastis_sentinel1', 'pastis_sentinel2', 'pastis_sentinel1_sentinel2', 'm_sa_crop_type')), 3) == 0.913
      and round(t['sen1floods11']['budgets']['300']['D4/E1_cluster']['coverage'], 3) == 0.824
      and round(t['mados']['budgets']['300']['D4/E1_cluster']['coverage'], 3) == 0.598
      and t['m_cashew_plant']['budgets']['300']['D4/E1_cluster']['coverage'] < naive['m_cashew_plant']
    )(s['tasks'],
      {k: v['budgets']['300']['D4/E2_naive']['coverage'] for k, v in s['tasks'].items()},
      {k: v['design_effect'] for k, v in s['tasks'].items()}))(A['exp/out/exp78_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: tile-sampling-breaks-the-naive-interval}
    - {file: docs/Findings.md, marker: tile-sampling-breaks-the-naive-interval}
    - {file: docs/Summary.md, marker: tile-sampling-breaks-the-naive-interval}
    - {file: docs/method/protocol.md, marker: tile-sampling-breaks-the-naive-interval}
  note: >-
    Five of the seven tasks were seen in the pilot disclosed in the preregistration, which is also what moved P2's
    threshold from 0.75 to 0.85. Of the two genuinely out-of-sample tasks only m-SA-crop-type confirms; m-cashew-plant
    has a design effect of 1.17 and its naive interval is fine, so the out-of-sample support is 1 of 2 and the check
    pins that asymmetry rather than letting 6 of 7 stand alone. The chip is not the unit a reviewer opens, so the
    tile-level design effect is a lower bound on the deployment one. Corrected 2026-09-22: the cluster arm was the
    unweighted mean of tile means, 1.78 times the truth on MADOS, whose recorded coverage of 0.904 came from an
    interval inflated by one-window tiles; the statement said the correction restored coverage everywhere. It is
    now the ratio estimator, and the check pins MADOS at 0.598 so the old sentence cannot quietly return.

- id: confidence-helps-most-where-the-map-is-good
  statement: "Choosing which windows to label by the model's own confidence narrows the error-rate interval to a median 0.80 of the simple-random width with coverage intact on all 7 tasks, and to 0.63 and 0.79 on the two tasks under 10% error; but the preregistered clause asking for a ratio above 0.94 on a task over 30% error fails at 0.9361."
  status: mixed
  experiments: [exp78]
  artifacts: [exp/out/exp78_summary.json]
  check: |-
    (lambda p: (lambda r:
      p['holds'] is False
      and median(r.values()) <= 0.92 and round(median(r.values()), 3) == 0.802
      and all(r[k] <= 0.88 for k in p['low_error_tasks']) and len(p['low_error_tasks']) == 2
      and max(r[k] for k in p['high_error_tasks']) < 0.94
      and round(max(r[k] for k in p['high_error_tasks']), 4) == 0.9361
      and 0.94 - max(r[k] for k in p['high_error_tasks']) < 0.005
      and min(r[k] for k in p['high_error_tasks']) < 0.82
      and all(p['coverage_kept'].values())
    )(p['per_task_ratio']))(A['exp/out/exp78_summary.json']['prereg']['P3_confidence_helps_most_where_the_map_is_good'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: confidence-helps-most-where-the-map-is-good}
  note: >-
    Two of three clauses passed and the third missed by 0.0039, recorded as a failure rather than rounded. The
    mechanism is the flatness of sqrt(p(1-p)) between 0.25 and 0.7, which m-cashew-plant obeys at 34.7% error and
    m-SA-crop-type does not, reaching 0.809 at 34.0% because its confidence separates stratum error rates more
    sharply than its overall rate suggests. The check pins both the near-miss and the disobedient task, so a rerun
    that merely cleared 0.94 would not silently satisfy it.

- id: confidence-saves-a-quarter-to-a-half-of-the-labels
  statement: "Confidence-guided labelling saves up to 2.51x the labels at equal half-width, on MADOS with coverage intact at 0.941, above the 1.8x the preregistered honesty check allowed; no arm reaches a half-width below +/-4 points on any task whose error rate exceeds 20%."
  crosscheck: tests/test_recorded.py::test_exp78_coverages_reproduce_in_a_small_seeded_monte_carlo_from_the_per_unit_files
  status: mixed
  experiments: [exp78]
  artifacts: [exp/out/exp78_summary.json]
  check: |-
    (lambda s: (lambda p, t:
      p['holds'] is False
      and p['max_budget_saving'] > 1.8 and round(p['max_budget_saving'], 2) == 2.51
      and abs(p['max_budget_saving'] - 1.0 / s['prereg']['P3_confidence_helps_most_where_the_map_is_good']['per_task_ratio']['mados'] ** 2) < 1e-9
      and t['mados']['budgets']['300']['D2c/E1']['coverage'] >= 0.93
      and all(p['half_widths'][k] >= 0.04 for k, v in t.items() if v['error_rate'] > 0.20)
      and sum(1 for v in t.values() if v['error_rate'] > 0.20) == 3
    )(s['prereg']['P4_no_order_of_magnitude'], s['tasks']))(A['exp/out/exp78_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: confidence-saves-a-quarter-to-a-half-of-the-labels}
    - {file: docs/Findings.md, marker: confidence-saves-a-quarter-to-a-half-of-the-labels}
  note: >-
    P4 was the guard against a too-good answer and it fired, but the bound was wrong rather than the assumption: the
    model-free ceiling behind 1.8x was derived off a two-stratum split and the run uses five strata. The check
    recomputes the saving from P3's width ratio, so the two verdict blocks cannot disagree without failing. The second
    clause held everywhere, which is why the headline stands: on estimating how wrong a map is, the ranking is worth
    between a quarter and a half of the labels, not the order of magnitude it is worth for finding errors.

- id: trust-zone-guarantee-holds
  statement: "From 300 (or 100 or 1,000) random labels on OlmoEarth Base's 24 suite tasks, a zone certified as wrong at most alpha of the time by the exact-test rules (the prefix rule, which is fixed-sequence testing, or Bonferroni over the grid; both are valid on any map) exceeded alpha on at most 0.080 (prefix) and 0.0045 (Bonferroni) of 2,000 draws on every one of 112 cells, against a bound of delta + 3 SE = 0.120 at delta = 0.1; the plug-in a reviewer would use exceeded it on up to 0.557."
  crosscheck: tests/test_known_answer.py::test_exp80_zone_guarantee_and_coverage_reproduce_from_a_fresh_draw
  status: supported
  experiments: [exp80]
  artifacts: [exp/out/exp80_summary.json]
  check: |-
    (lambda s: (lambda cells, bound:
      len(cells) == 110 and s['config']['delta'] == 0.1 and s['config']['draws'] == 2000
      and sum(len(r['cells']) for r in s['tasks'].values()) == 112
      and max(c['rules']['prefix']['violation_rate'] for c in cells) <= bound
      and round(max(c['rules']['prefix']['violation_rate'] for c in cells), 3) == 0.080
      and max(c['rules']['bonferroni']['violation_rate'] for c in cells) <= bound
      and round(max(c['rules']['bonferroni']['violation_rate'] for c in cells), 4) == 0.0045
      and round(max(c['rules']['plugin']['violation_rate'] for c in cells), 3) == 0.557
      and all(c['rules']['prefix']['violation_rate'] <= 0.1 for c in cells if not c['monotone']['nondecreasing'])
    )([c for r in s['tasks'].values() for c in r['cells'] if c['monotone'] is not None],
      s['config']['delta'] + 3 * (s['config']['delta'] * (1 - s['config']['delta']) / s['config']['draws']) ** 0.5))(A['exp/out/exp80_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: trust-zone-guarantee-holds}
    - {file: docs/Findings.md, marker: trust-zone-guarantee-holds}
    - {file: docs/Summary.md, marker: trust-zone-guarantee-holds}
  note: >-
    The bound and the maxima are recomputed from every cell's violation rate, not read from the verdict block. Two
    cells (EuroSAT at B = 100 for both alphas) have no testable level and count as trivially valid; the 110 cells
    with levels are the ones graded. The prefix rule is fixed-sequence testing, valid whatever the shape of the zone
    risk across the tested levels; the note said until 3 October 2026 that its theorem covered only a nondecreasing
    risk, a condition tests/test_trust_zone.py shows is not needed by enumerating every error pattern of small maps.

- id: trust-zone-arithmetic-agrees-outside-census
  statement: "At 300 labels and alpha = half the map's error rate, running each rule once on the expected counts predicts the run's modal outcome (zone or no zone) and its median certified coverage to within two grid steps on 19 of the 21 tasks large enough for that budget; the two exceptions are the CropHarvest Togo tasks, where 300 labels are 98% of the population and the expected-count arithmetic rounds to the wrong side of delta at the first tested level."
  crosscheck: tests/test_known_answer.py::test_exp80_zone_guarantee_and_coverage_reproduce_from_a_fresh_draw
  status: mixed
  experiments: [exp80]
  artifacts: [exp/out/exp80_summary.json]
  check: |-
    (lambda s: (lambda rows: (lambda fails:
      len({t for t, _, _ in rows}) == 21 and len(rows) == 42
      and sorted(fails) == [('cropharvest_Togo_12_sentinel1', 'prefix'), ('cropharvest_Togo_12_sentinel2_sentinel1', 'prefix')]
      and all(s['tasks'][t]['n_units'] == 306 for t, _ in fails)
    )([(t, rule) for t, rule, r in rows
       if not (r['modal_outcome'] == r['arithmetic_outcome']
               and (r['median_coverage'] is None or r['arithmetic'] is None or abs(r['median_coverage'] - r['arithmetic']) <= 0.1 + 1e-9))])
    )([(t, rule, c['rules'][rule]) for t, row in s['tasks'].items() for c in row['cells']
       if c['alpha_kind'] == 'half_theta' and c['budget'] == 300 for rule in ('prefix', 'bonferroni')]))(A['exp/out/exp80_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: trust-zone-arithmetic-agrees-outside-census}
  note: >-
    Preregistered as "on every task" and recorded as failed as written; the check pins the two failing cells and the
    19 passing ones so that a rerun where the arithmetic drifts elsewhere is caught. The crosscheck re-draws the
    MADOS cell and reproduces its median coverage, one of the 19.

- id: plugin-zone-violates-on-most-tasks
  statement: "At 300 labels and alpha = half the map's error rate, the plug-in rule (accept the largest zone whose sample error rate is at most alpha) exceeds alpha on more than delta = 0.1 of draws on 16 of the 21 tasks large enough for that budget; the five below delta are the three near-census CropHarvest Togo tasks, Nandi Sentinel-1 (no zone exists at that alpha) and EuroSAT (alpha = 0.009). The preregistration's bar of 18 of 24 was written for 24 tasks and is recorded as mis-stated."
  crosscheck: tests/test_known_answer.py::test_exp80_zone_guarantee_and_coverage_reproduce_from_a_fresh_draw
  status: mixed
  experiments: [exp80]
  artifacts: [exp/out/exp80_summary.json]
  check: |-
    (lambda s: (lambda v:
      len(v) == 21 and sum(1 for x in v.values() if x > 0.1) == 16
      and sorted(t for t, x in v.items() if x <= 0.1) == ['cropharvest_Togo_12_sentinel1', 'cropharvest_Togo_12_sentinel2',
                                                          'cropharvest_Togo_12_sentinel2_sentinel1', 'm_eurosat', 'nandi_sentinel1']
      and min(x for t, x in v.items() if x > 0.1) > 0.2
    )({t: c['rules']['plugin']['violation_rate'] for t, row in s['tasks'].items() for c in row['cells']
       if c['alpha_kind'] == 'half_theta' and c['budget'] == 300}))(A['exp/out/exp80_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: plugin-zone-violates-on-most-tasks}

- id: trust-zone-coverage-at-300-labels
  statement: "At 300 labels and alpha = half the map's error rate, the prefix rule certifies a zone on most draws on 14 of the 21 tasks large enough for that budget, with a median certified coverage of 0.50 against an oracle median of 0.60; the Bonferroni rule on 13, median 0.35."
  crosscheck: tests/test_known_answer.py::test_exp80_zone_guarantee_and_coverage_reproduce_from_a_fresh_draw
  status: measured
  experiments: [exp80]
  artifacts: [exp/out/exp80_summary.json]
  check: |-
    (lambda s: (lambda cells: (lambda med:
      len(cells) == 21
      and sum(1 for c in cells if c['rules']['prefix']['no_zone_rate'] < 0.5) == 14
      and sum(1 for c in cells if c['rules']['bonferroni']['no_zone_rate'] < 0.5) == 13
      and med([c['rules']['prefix']['median_coverage'] or 0.0 for c in cells]) == 0.5
      and med([c['rules']['bonferroni']['median_coverage'] or 0.0 for c in cells]) == 0.35
      and med([c['oracle_coverage'] for c in cells]) == 0.6
      # the prose beside it: Brick Kiln's Bonferroni median is over a quarter of the draws, and over all 112 cells
      # which rule certified on more draws
      and (lambda bk: bk['bonferroni']['no_zone_rate'] == 0.748 and bk['bonferroni']['median_coverage'] == 0.75
           and bk['prefix']['no_zone_rate'] == 0.0 and bk['prefix']['median_coverage'] == 0.5)(
          [c for c in s['tasks']['m_brick_kiln']['cells'] if c['alpha_kind'] == 'half_theta' and c['budget'] == 300][0]['rules'])
      and (lambda ch: round(1 - ch['bonferroni']['no_zone_rate'], 3) == 0.932 and round(1 - ch['prefix']['no_zone_rate'], 4) == 0.4375)(
          [c for c in s['tasks']['cropharvest_Peoples_Republic_of_China_6_sentinel1']['cells']
           if c['alpha_kind'] == 'half_theta' and c['budget'] == 300][0]['rules'])
      and (lambda all_cells: (len(all_cells),
           sum(1 for c in all_cells if c['rules']['bonferroni']['no_zone_rate'] < c['rules']['prefix']['no_zone_rate']),
           sum(1 for c in all_cells if c['rules']['bonferroni']['no_zone_rate'] > c['rules']['prefix']['no_zone_rate']))
          == (112, 25, 72))([c for row in s['tasks'].values() for c in row['cells']])
    )(lambda v: sorted(v)[len(v) // 2]))([c for row in s['tasks'].values() for c in row['cells']
                                          if c['alpha_kind'] == 'half_theta' and c['budget'] == 300]))(A['exp/out/exp80_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: trust-zone-coverage-at-300-labels}
    - {file: docs/Findings.md, marker: trust-zone-coverage-at-300-labels}
    - {file: docs/Summary.md, marker: trust-zone-coverage-at-300-labels}
  note: >-
    Medians over 21 tasks are the 11th sorted value of each task's median coverage over the draws on which the rule
    certified a zone; a task whose rule never certifies enters as 0. A task whose rule certifies on few draws enters
    with the median of those few: Bonferroni on Brick Kiln certifies nothing on 74.8% of draws and enters as 0.75
    (corrected on 30 September 2026; this note said a task certifying nothing on most draws enters as 0). The check
    also pins the counts the comparisons paragraph gives beside the claim: over all 112 cells Bonferroni certified a
    zone on more draws than the prefix rule on 25 and on fewer on 72.

