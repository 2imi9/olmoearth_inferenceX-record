- id: exp88-matched-head-ranks-normally
  statement: "On the same 458,638 PASTIS windows, the confident errors belong to a probe read on an input it was not trained on. OlmoEarth Base's S1+S2 probe read on the S1 embeddings errs on 73.6% of the windows; 59.8% of its errors have a margin at or above 0.8206, the median margin of the windows it gets right on S1+S2, and its margin's AUROC for errors is 0.59. The probe the record trained on the S1 embeddings errs on 28.4%; 3.9% of its errors are that confident, and its AUROC is 0.79 (the S1+S2 probe on S1+S2: 19.5%, 6.0% and 0.83). On exp88's half-cloudy map with the S1 probe on the cloudy tiles, the parts err on 28.3% and 19.7%, and the 5% review set by margin holds 13.4% of the cloudy part's errors and 12.9% of the clear part's (4.3% and 18.3% with exp88's probe). OlmoEarth Large: 49.9%, 12.8% and 0.72 with the S1+S2 probe on S1; 27.9%, 2.9% and 0.80 with the S1 probe; 14.0% and 12.6% in the review set. On CropHarvest China 6, with a probe trained on each input, the optical input is the more useful one: Base's S1 probe errs on 35.6% and its S2 probe on 26.6% (the S1+S2 probe: 22.6% on S1+S2 and 28.9% read on S1 without refit), and Large's on 36.7% and 27.4% (full input 26.9%)."
