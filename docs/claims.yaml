    samples, exp92 and exp94). v1's verdict is report-only and turns on the weighting.

- id: exp111-v12-twenty-label-audit-does-not-reliably-flag-the-pair
  statement: "In exp111's blind test (preregistered, graded for the v1.2 fine-tune), v1.2's shrubland_savanna confident zone at the fresh plots (76 plots with input) is wrong at a region-weighted 13.8% under STRICT (90% bootstrap 8.1% to 20.4%) and 4.3% under LENIENT (0 to 9.5%). With 20 labels the package's per-class audit calls a class above alpha 0.05 at 4 or more errors (k* = 4), so its note (STRICT above, the crosswalk's LENIENT pairs not) fires with probability 0.287 (0.140 at 15 labels, 0.394 at 30): preregistered P3, at least 0.5, does not hold, against exp109's prediction of 0.81. v1, report-only: 81 plots, 17.6% and 1.3%, P(note) 0.478. Report-only, one literal unweighted draw of 20 labels at v1.2's zone found 4 STRICT errors, all on Open Grassland and none under the also-accept reading, and the note fired; on both models it also fired on montane_forest (7 of 7 and 8 of 8 STRICT errors, all Dense Forest)."
  crosscheck: tests/test_exp111.py::test_exp111_recorded_by_a_second_route
  status: rejected
  experiments: [exp111]
  artifacts: [exp/out/exp111_summary.json, exp/out/exp111_crosscheck.json]
  check: |-
    (lambda S, C: (lambda s, x, v1, L12, L1: S['verdicts_graded']['P3'] == {'v12': 'does not hold'} and s['P3']['verdict'] == 'does not hold'
      and s['P3']['zone_plots'] == 76 and (round(s['P3']['zone_eS'], 3), round(s['P3']['zone_eL'], 3)) == (0.138, 0.043)
      and [round(a, 3) for a in s['P3']['zone_eS_interval90'] + s['P3']['zone_eL_interval90']] == [0.081, 0.204, 0.0, 0.095]
      and s['P3']['k_star'] == 4 and round(s['P3']['p_note'], 3) == 0.287
      and [(r['k_star'], round(r['p_note'], 3)) for r in (s['report_only']['P3']['labels_15'], s['report_only']['P3']['labels_30'])] == [(4, 0.14), (5, 0.394)]
      and round(x['P3']['labels']['20']['p_note'], 9) == round(s['P3']['p_note'], 9)
      and (v1['P3']['verdict'], v1['P3']['zone_plots'], round(v1['P3']['zone_eS'], 3), round(v1['P3']['zone_eL'], 3), round(v1['P3']['p_note'], 3)) == ('does not hold', 81, 0.176, 0.013, 0.478)
      and (L12['2']['n_labelled'], L12['2']['strict_wrong'], L12['2']['strict_verdict'], L12['2']['also_accept_wrong'], L12['2']['note_fires']) == (20, 4, 'above', 0, True)
      and 'reference classes the alternative accepts (4: 4)' in L12['2']['package_note']
      and (L12['6']['strict_wrong'], L12['6']['n_labelled'], L12['6']['note_fires'], L1['6']['strict_wrong'], L1['6']['n_labelled'], L1['6']['note_fires']) == (7, 7, True, 8, 8, True)
      and L12['4']['note_fires'] is False and L1['4']['note_fires'] is False and L1['2']['note_fires'] is False
    )(S['models']['v12'], C['models']['v12'], S['models']['v1'], S['models']['v12']['report_only']['literal_audit']['per_class'],
      S['models']['v1']['report_only']['literal_audit']['per_class']))(A['exp/out/exp111_summary.json'], A['exp/out/exp111_crosscheck.json'])
