    frozen by me on the owner's overnight approval; a review of the write-up corrected Mayotte's first reading (prior
    shift) before it was committed.

- id: exp114-label-free-priors-mislead-under-feature-shift
  statement: "In exp114, preregistered P2, that EM's label-free estimate of the held-out territory's class shares (Saerens et al. 2002) is closer to the true shares than the map's own predicted shares in at least 10 of 15 held-out maps, does not hold: it is closer in 3 (its distance 0.006 to 0.681). Under feature shift EM amplifies the map's biases (Guyane, v1.3: 31.4% Pineapple and 17.5% Tropical tuber where the truth is 0.1% and 0.2%). BBSE is closer in 8 of 15 but far off on all three default-split maps (0.300, 0.191, 0.905), where there is no shift."
  crosscheck: tests/test_exp114.py::test_exp114_recorded_by_a_second_route
  status: rejected
  experiments: [exp114]
  artifacts: [exp/out/exp114_summary.json, exp/out/exp114_crosscheck.json]
  check: |-
    (lambda S, C: (lambda held: S['verdicts']['P2']['holds'] is False and S['verdicts']['P2']['count'] == 3 and C['verdicts']['P2']['holds'] is False
      and sum(S['maps'][c][e]['em']['tv_to_pi_t'] < S['maps'][c][e]['tv_predicted_shares'] for c, e in held) == 3
      and sum(S['maps'][c][e]['bbse']['tv_to_pi_t'] < S['maps'][c][e]['tv_predicted_shares'] for c, e in held) == 8
      and [round(S['maps']['default'][e]['bbse']['tv_to_pi_t'], 3) for e in ('oe13', 'tessera2', 'aef')] == [0.3, 0.191, 0.905]
      and [round(S['maps']['loio:Guyane']['oe13']['em']['pi'][k], 3) for k in (6, 7)] == [0.314, 0.175]
      and [round(S['maps']['loio:Guyane']['oe13']['pi_t'][k], 3) for k in (6, 7)] == [0.001, 0.002]
      and [round(f(S['maps'][c][e]['em']['tv_to_pi_t'] for c, e in held), 3) for f in (min, max)] == [0.006, 0.681]
    )([(c, e) for c in S['maps'] if c != 'default' for e in ('oe13', 'tessera2', 'aef')]))(A['exp/out/exp114_summary.json'], A['exp/out/exp114_crosscheck.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: exp114-label-free-priors-mislead-under-feature-shift}
    - {file: docs/Findings.md, marker: exp114-label-free-priors-mislead-under-feature-shift}
    - {file: docs/Summary.md, marker: exp114-label-free-priors-mislead-under-feature-shift}
  note: >-
    EM converged on every map (at most 296 iterations); the second route's estimates match to 3.3e-15. In-distribution
    (default split) EM is within 0.014 to 0.041. EM maximises a likelihood concave in the priors; the run does not
    show the maximum is unique.

- id: exp114-random-labels-catch-a-wrong-prior-estimate
  statement: "In exp114, an exact test of a label-free class-share estimate from 400 random pixel labels (each class's hypergeometric interval at level 1 - 0.05/8) rejects EM's estimate with probability 1.000 on every held-out v1.3 map, all at least 0.05 from the truth (P3 holds), and rejects the true shares with exact probability at most 0.023 (P4 holds, 36 cells). It also rejects EM on the default split (exact 0.875 for v1.3) where EM is close but sets rare classes to about zero, so a rejection says the label-free shares are not to be trusted, not which pathway failed. Correcting with the shares the 400 labels estimate (mean over 100 draws) finds 7.2% of Guyane's Meadow and 8.9% of Réunion's Sugarcane, about what the oracle does."
  crosscheck: tests/test_exp114.py::test_exp114_recorded_by_a_second_route
  status: supported
