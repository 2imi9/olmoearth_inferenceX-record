  experiments: [exp21]
  artifacts: [exp/out/exp21_summary.json]
  check: |-
    (lambda f: f['probe_only_wrong'] == 35 and f['both_wrong'] == 28 and f['ft_only_wrong'] == 13 and f['probe_only_wrong'] / (f['probe_only_wrong'] + f['both_wrong']) > 0.5
    )(A['exp/out/exp21_summary.json']['crops']['16']['ft_vs_probe'])
  cited_in:
    - {file: docs/Findings.md, marker: fine-tuning-corrects-half}

- id: modality-dominates-shared-errors
  statement: Reading Sentinel-1 instead of Sentinel-2 moves the error set far more (phi 0.38-0.39) than swapping the backbone (0.70), a two-layer or 3x3 head barely beats a backbone swap and stays far from fine-tuning's 0.475, and label impurity and chip clustering do not explain the overlap; the sensor is the largest lever and the backbone the smallest.
  status: measured
  experiments: [exp46]
  artifacts: [exp/out/exp46_summary.json]
  check: |-
    (lambda s:
      s['prereg']['P1_readout'] is True and s['prereg']['P2_modality'] is True and s['prereg']['complete'] is True
      and all(0.38 <= round(s['results'][n]['pairwise']['A1 S2 linear vs A2 S1 linear']['phi'], 2) <= 0.39 and round(s['results'][n]['prereg']['backbone_swap_phi'], 2) == 0.70 for n in ('bolivia', 'test'))
      and all(0.6 < s['results'][n]['pairwise'][k]['phi'] < s['results'][n]['prereg']['backbone_swap_phi'] for n in ('bolivia', 'test') for k in ('A1 S2 linear vs A3 S2 MLP', 'A1 S2 linear vs A4 S2 3x3 linear'))
      and all(abs(st['pure'] - st['mixed']) < 0.2 for n in ('bolivia', 'test') for st in s['results'][n]['purity_strata'].values())
    )(A['exp/out/exp46_summary.json'])
  cited_in:
    - {file: docs/Findings.md, marker: modality-dominates-shared-errors}
    - {file: docs/TECHNIQUES.md, marker: modality-dominates-shared-errors}

