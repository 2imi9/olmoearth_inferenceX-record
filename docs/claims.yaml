- id: shrug-signals-rejected
  statement: SHRUG-FM's reliability signals ported to the window do not beat the model's own confidence; under v1.2 confidence beats ensemble mutual information and -NCDD on both testbeds (preregistered, supported), the embedding and input signals are several times worse, and cluster-normalized NCDD is worse than the raw deficit on all four arms.
  status: rejected
  experiments: [exp49]
  artifacts: [exp/out/exp49_summary.json]
  check: |-
    (lambda s:
      s['prereg'] == {'supported': True, 'complete': True}
      and (s['results']['v1_2']['bolivia']['tests']['ensemble mutual information']['w'], s['results']['v1_2']['bolivia']['tests']['ensemble mutual information']['l']) == (263, 61)
      and (s['results']['v1_2']['test']['tests']['ensemble mutual information']['w'], s['results']['v1_2']['test']['tests']['ensemble mutual information']['l']) == (352, 76)
      and round(s['results']['v1_2']['bolivia']['tests']['ensemble mutual information']['pooled_lead'], 4) == 0.0060 and round(s['results']['v1_2']['test']['tests']['ensemble mutual information']['pooled_lead'], 4) == 0.0022
      and all(0.03 <= round(s['results'][v][n]['tests']['embedding NCDD']['pooled_lead'], 2) <= 0.08 for v in ('v1', 'v1_2') for n in ('bolivia', 'test'))
      and all(s['results'][v][n]['pooled_eaurc']['embedding NCDD raw'] < s['results'][v][n]['pooled_eaurc']['embedding NCDD'] for v in ('v1', 'v1_2') for n in ('bolivia', 'test'))
      and all(s['results'][v][n]['pooled_eaurc'][k] > 2.9 * s['results'][v][n]['pooled_eaurc']['averaged confidence'] for v in ('v1', 'v1_2') for n in ('bolivia', 'test') for k in ('embedding normalized distance', 'embedding NCDD', 'input extremity max', 'input extremity mean'))
      and all(s['results'][v]['bolivia']['tile_level']['per_ranker']['ensemble mutual information']['aurc'] > s['results'][v]['bolivia']['tile_level']['per_ranker']['averaged confidence']['aurc'] for v in ('v1', 'v1_2'))
    )(A['exp/out/exp49_summary.json'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: shrug-signals-rejected}
    - {file: docs/results/comparisons.md, marker: shrug-signals-rejected}
  note: At the tile level mutual information is the weakest task signal on Bolivia under both backbones; on the v1 test split it is 0.003 better than confidence (0.117 vs 0.120), so 'weakest on every arm' would overstate it.

