      and V['wins'] == 5 and V['losses'] == 1 and V['p_value'] > 0.05
      and S['claims_audit']['B']['pooled'] > 0.93 and S['claims_audit']['A']['pooled'] > 0.99
    )(A['exp/out/exp64_summary.json']['verdicts']['P1_claims_audit'], A['exp/out/exp64_summary.json'])
  cited_in:
