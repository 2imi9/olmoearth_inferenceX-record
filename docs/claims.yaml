- id: cross-encoder-phi-on-their-embeddings
  statement: On Ai2's published Sen1Floods11 embeddings with their probe, six of seven other encoders share OlmoEarth Base's error windows at phi 0.78-0.82 and Satlas (2 x 2 token grid) at 0.62; exp41's shared-error result replicates on their sensor and readout.
