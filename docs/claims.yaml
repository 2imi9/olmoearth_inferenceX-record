- id: exp113-transfer-drop-in-ranking-below-the-bar
  statement: "In exp113, preregistered P2, that v1.3's mean AUROC over the five held-out territories is at least 0.05 below its AUROC on the default spatial split, does not hold: 0.833 against 0.880, a drop of 0.047. The drop is 0.006 (Guadeloupe), 0.023 (Martinique), 0.064 (Guyane), 0.004 (Réunion) and 0.138 (Mayotte), so transfer does cost ranking, unevenly; for TESSERA v2 the mean drop is 0.054 and for AlphaEarth 0.079. The page set no interval for the drop, and the default split's test patches pool all territories."
