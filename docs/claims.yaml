      len(cells) == 3560 and len(E) == 16
      and all(c[0] > 0.5 for c in cells) and round(min(cells)[0], 3) == 0.503 and min(cells)[1:3] == ('clay_large', 'nandi_sentinel1')
      and all(c[3]['signals']['margin']['excess_aurc'] < c[3]['error_rate'] - oracle_aurc(c[3]['n_units'], round(c[3]['error_rate'] * c[3]['n_units'])) for c in cells)
    )([(s['signals']['margin']['auroc'], e, t, s) for e in sorted(E) for t, r in E[e]['tasks'].items() for s in r['seeds']])
    )({e: A['exp/out/exp79_seeds/' + e + '.json'] for e in ['anysat', 'clay_large', 'copernicusfm', 'croma_base', 'croma_large', 'galileo_base', 'galileo_nano', 'galileo_tiny', 'olmoearth_base', 'olmoearth_large', 'olmoearth_nano', 'olmoearth_tiny', 'panopticon', 'satlas_base', 'terramind_base', 'terramind_large']})
  cited_in:
    - {file: docs/results/comparisons.md, marker: exp79-margin-beats-random-everywhere}
    - {file: docs/Findings.md, marker: exp79-margin-beats-random-everywhere}
    - {file: docs/Summary.md, marker: exp79-margin-beats-random-everywhere}
    - {file: docs/method/protocol.md, marker: exp79-margin-beats-random-everywhere}
  note: >-
    A cell is one encoder, one task and one probe seed; the 3,560 are 24 tasks on seven encoders, 21 on eight and 20
    on TerraMind Base, each at ten seeds. The per-unit files behind the cells are not committed beyond OlmoEarth
    Base's seed 0 (exp78_units), so the crosscheck recomputes the AUROC there and the random order's excess AURC
    everywhere.

- id: suite-review-at-ten-percent
  statement: "On exp70's 24 tasks, reviewing the 10% of units with the lowest margin finds a median 0.214 of the errors, against 0.10 for a random 10% and a median 0.410 for a perfect order, so the margin closes a median 0.40 of the gap between the two. It finds more than 10% of the errors on every task; the lowest is 0.115, on Nandi Sentinel-1."
  crosscheck: tests/test_recorded.py::test_suite_controls_margin_and_ten_percent_review_by_a_second_route
  status: measured
  experiments: [exp70]
  artifacts: [exp/out/exp70_summary.json]
  check: |-
    (lambda T: (lambda cap, ceil:
      len(T) == 24 and all(cap[t] > 0.1 for t in T)
      and round(median(cap.values()), 3) == 0.214 and round(median(ceil.values()), 3) == 0.41
      and round(median([(cap[t] - 0.1) / (ceil[t] - 0.1) for t in T]), 2) == 0.4
      and min(cap, key=cap.get) == 'nandi_sentinel1' and round(cap['nandi_sentinel1'], 3) == 0.115
    )({t: T[t]['signals']['margin']['capture']['0.1'] for t in T},
      {t: attainable_ceiling(0.1, T[t]['error_rate'], T[t]['n_units']) for t in T})
    )(A['exp/out/exp70_summary.json']['results']['tasks'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: suite-review-at-ten-percent}
    - {file: docs/Findings.md, marker: suite-review-at-ten-percent}
    - {file: docs/Summary.md, marker: suite-review-at-ten-percent}
    - {file: docs/TECHNIQUES.md, marker: suite-review-at-ten-percent}
  note: >-
    The capture is exp70's tie-aware share of all errors inside the round(0.1 n) least confident units; the perfect
    order's is min(k, E) / E for that realised set (attainable_ceiling with n). A random 10% finds 0.10 in
    expectation.

- id: shipped-tile-design-coverage
  statement: "The tiles design as the package ships it (tiles in a random order until 300 labels are met, up to 16 per tile, and estimate_error_rate's ratio interval with a t quantile) covers the true error rate on 94.5% to 95.4% of 4,000 draws on five of exp78's seven segmentation tasks: the three PASTIS inputs, m-cashew-plant and m-SA-crop-type. It falls short on the other two, 84.3% on Sen1Floods11 and 68.5% on MADOS. Those are the two tasks where a tenth of the tiles hold most of the errors (56% and 91%, against 13% to 25% on the five). exp78's own tile design, exactly 18 tiles with a normal quantile, covered 91.3% to 93.6% on the five."
  crosscheck: tests/test_recorded.py::test_exp78_shipped_tile_design_coverage_by_an_independent_implementation
  status: measured
  experiments: [exp78]
  artifacts: [exp/out/exp78_shipped_tiles.json, exp/out/exp78_summary.json]
  check: |-
    (lambda T, R: (lambda five, cov, top:
      len(T) == 7 and sorted(five + ['sen1floods11', 'mados']) == sorted(T)
      and all(T[t]['shipped']['draws'] == 4000 and T[t]['shipped']['labels_min'] == T[t]['shipped']['labels_max'] == 300 for t in T)
      and all(abs(T[t]['error_rate'] - R[t]['error_rate']) < 1e-12 for t in T)
      and round(min(cov[t] for t in five), 3) == 0.945 and round(max(cov[t] for t in five), 3) == 0.954
      and round(cov['sen1floods11'], 3) == 0.843 and round(cov['mados'], 3) == 0.685
      and sorted(T, key=top.get)[-2:] == ['sen1floods11', 'mados']
      and round(top['sen1floods11'], 2) == 0.56 and round(top['mados'], 2) == 0.91
      and round(min(top[t] for t in five), 2) == 0.13 and round(max(top[t] for t in five), 2) == 0.25
      and all(T[t]['exp78_recorded']['D4/E1_cluster'] == R[t]['budgets']['300']['D4/E1_cluster']['coverage'] for t in T)
      and round(min(R[t]['budgets']['300']['D4/E1_cluster']['coverage'] for t in five), 3) == 0.913
      and round(max(R[t]['budgets']['300']['D4/E1_cluster']['coverage'] for t in five), 3) == 0.936
    )(['pastis_sentinel1', 'pastis_sentinel2', 'pastis_sentinel1_sentinel2', 'm_cashew_plant', 'm_sa_crop_type'],
      {t: T[t]['shipped']['covered'] / T[t]['shipped']['draws'] for t in T},
      {t: T[t]['tiles']['share_of_errors_in_top_tenth_of_tiles'] for t in T})
    )(A['exp/out/exp78_shipped_tiles.json']['tasks'], A['exp/out/exp78_summary.json']['tasks'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: shipped-tile-design-coverage}
    - {file: docs/Findings.md, marker: shipped-tile-design-coverage}
    - {file: docs/Summary.md, marker: shipped-tile-design-coverage}
  note: >-
    Not preregistered: a check of the shipped code (package 1.3.1) on exp78's per-unit files, prompted by the red team
    of 30 September 2026; draws use seeds 0 to 3,999, and the Monte Carlo standard error is about 0.0035 on the five
    and 0.006 to 0.007 on the two. The shipped design used 19 or 20 tiles per draw on the five, 19 to 21 on Sen1Floods11
    and 27 to 60 on MADOS; exp78's D4 used 300 // 16 = 18. Where the errors crowd into few tiles is a description of the two failing tasks, not a
    tested cause; MADOS's tiles are also small (median 6 valid windows) and Sen1Floods11's are mostly full.

- id: exp89-finetuned-report-only
  statement: "Report-only (exp89; no prediction graded, the validation sets being too small). On Ai2's fine-tuned FT-AWF (344 validation points, 41 errors; replica 88.1% against Ai2's 89.5%) and Forest Loss Driver (109 windows, 25 errors; 77.1% against 76.1%), the top-1 confidence ranks the errors with AUROC 0.867 and 0.808. A 10% review holds 41.5% and 32.0% of the errors (random 9.9% and 10.1%, ceiling 82.9% and 44.0%), against 19.5% and 18.3% for the best no-encoder control by AURC (the no-encoder classifier's uncertainty, AUROC 0.641; class rarity, 0.646). The capture difference's cluster-bootstrap 95% interval includes zero on both (-2.1 to +40.6 and -7.7 to +28.5 points); the AURC difference's excludes it (-0.064 to -0.022 and -0.117 to -0.014). On FT-AWF at 300 of 344 labels, the random design's exact interval covers on 96.1% of 2,000 draws and the confidence design's on 94.1% at 0.70 of its width; certify at alpha 0.05 certifies a median 75% (the no-encoder order 20%) and exceeds alpha on 1.75% of draws. With every label, the confidence order could certify 75% and 95% of FT-AWF at alpha 0.05 and 0.10 and 60% and 80% of Forest Loss Driver at 0.10 and 0.15, against 25%, 75%, 10% and 50% for the no-encoder classifier's order."
  crosscheck: tests/test_exp89.py::test_the_report_only_numbers_by_a_second_route
  status: measured
  experiments: [exp89, exp21]
  artifacts: [exp/out/exp89_summary.json]
  check: |-
    (lambda S: (lambda a, f, sig, cmb:
      S['prereg_status'] == 'frozen' and S['dirty'] is False
      and all(x['report_only'] is True and x['gate']['alignment'] == 'aligned' and 'verdict' not in x and 'verdict' not in x['reported'] for x in (a, f))
      and S['arms']['mangrove']['status'] == 'not run' and S['arms']['nandi']['status'] == 'not run'
      and (a['n_units'], a['n_errors'], f['n_units'], f['n_errors']) == (344, 41, 109, 25)
      and all(abs(x['accuracy']['accuracy_window'] - (1 - x['n_errors'] / x['n_units'])) < 1e-12 for x in (a, f))
      and [round(x['accuracy']['accuracy_window'], 3) for x in (a, f)] == [0.881, 0.771]
      and [x['gate']['ai2_accuracy'] for x in (a, f)] == [0.895, 0.761]
      and a['inputs']['exp21_agreement']['n_same_prediction'] == 344
      and len(set(f['gate']['attempts'][-1]['accuracy_by_flip'].values())) == 1
      and f['inputs']['n_val_windows'] == 113 and f['inputs']['dropped'] == {'new_label outside the ten classes': 4}
      # the best control is the lowest AURC among the frozen candidates
      and all(x['ranking']['best_control'] == min(x['ranking']['candidates'], key=lambda c: sig(x, c)['aurc']) for x in (a, f))
      and [x['ranking']['best_control'] for x in (a, f)] == ['k3a_no_encoder_uncertainty', 'k2_class_rarity']
      and [round(sig(x, s)['auroc'], 3) for x in (a, f) for s in ('confidence', x['ranking']['best_control'])] == [0.867, 0.641, 0.808, 0.646]
      and [round(sig(x, s)['capture']['0.1'], 3) for x in (a, f) for s in ('confidence', x['ranking']['best_control'])] == [0.415, 0.195, 0.32, 0.183]
      and [round(sig(x, 'confidence')[k]['0.1'], 3) for x in (a, f) for k in ('capture_random', 'ceiling')] == [0.099, 0.829, 0.101, 0.44]
      # the differences are confidence minus the control, recomputed, and their intervals are what the docs say
      and all(abs(cmb(x)['0.1']['difference'] - (sig(x, 'confidence')['capture']['0.1'] - sig(x, x['ranking']['best_control'])['capture']['0.1'])) < 1e-12
              and abs(cmb(x)['aurc']['difference'] - (sig(x, 'confidence')['aurc'] - sig(x, x['ranking']['best_control'])['aurc'])) < 1e-12 for x in (a, f))
      and [round(v, 3) for x in (a, f) for v in (cmb(x)['0.1']['bootstrap']['lo95'], cmb(x)['0.1']['bootstrap']['hi95'])] == [-0.021, 0.406, -0.077, 0.285]
      and all(cmb(x)['0.1']['bootstrap']['lo95'] < 0 and cmb(x)['aurc']['bootstrap']['hi95'] < 0 for x in (a, f))
      and [round(v, 3) for x in (a, f) for v in (cmb(x)['aurc']['bootstrap']['lo95'], cmb(x)['aurc']['bootstrap']['hi95'])] == [-0.064, -0.022, -0.117, -0.014]
      # FT-AWF's estimate and certify cells; Forest Loss Driver fits no budget
      and [round(v, 3) for v in (a['estimate']['cells']['random/300']['coverage'], a['estimate']['cells']['confidence/300']['coverage'], a['reported']['estimate']['300']['width_ratio'])] == [0.961, 0.941, 0.699]
      and abs(a['reported']['estimate']['300']['width_ratio'] - a['estimate']['cells']['confidence/300']['median_width'] / a['estimate']['cells']['random/300']['median_width']) < 1e-12
      and f['estimate']['budgets_run'] == [] and f['reported']['certify']['run'] is False
      and (a['certify']['confidence/prefix/300/0.05']['median_coverage'], a['certify']['k3a/prefix/300/0.05']['median_coverage'], a['certify']['confidence/prefix/300/0.05']['violation_rate']) == (0.75, 0.2, 0.0175)
      and (a['certify']['confidence/prefix/300/0.1']['median_coverage'], a['certify']['k3a/prefix/300/0.1']['median_coverage'], a['certify']['confidence/prefix/300/0.1']['violation_rate']) == (0.9, 0.4, 0.0)
      and [a['certify_best_coverage'][k] for k in ('confidence/0.05', 'confidence/0.1', 'k3a/0.05', 'k3a/0.1')] == [0.75, 0.95, 0.25, 0.75]
      and [f['certify_best_coverage'][k] for k in ('confidence/0.1', 'confidence/0.15', 'k3a/0.1', 'k3a/0.15')] == [0.6, 0.8, 0.1, 0.5]
    )(S['arms']['awf'], S['arms']['fld'],
      lambda x, s: x['ranking']['signals'][s],
      lambda x: x['ranking']['confidence_minus_best_control'])
    )(A['exp/out/exp89_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: exp89-finetuned-report-only}
    - {file: docs/Summary.md, marker: exp89-finetuned-report-only}
  note: >-
    Report-only by the owner's amendment of 1 October 2026, made before any result: the frozen page grades no
    prediction on these arms and the docs may cite them only as report-only. The best control is chosen on the same
    labels, which favours it; both best controls fall just under the 0.65 AUROC the graded arm asks of an
    informative control. FT-AWF's estimate and certify cells use 300 of 344 points, close to a census. Mangrove (the
    graded arm) waits for Ai2's validation split; Nandi is not public.

- id: exp92-products-labelled-routes-hold
  statement: "On published products graded against an independent probability sample (LCMAP Collection 1.3 and Esri 10 m Annual LULC v2, 2018, read at 24,968 of LCMAP's 25,000 simple-random reference plots, Esri crosswalked to LCMAP's classes; preregistered), LCMAP is 82.3% and Esri 79.6% accurate against the reference, and labels drawn among the 5,387 plots where they differ covered the 2.7-point difference on 99.0%, 98.6% and 98.5% of 2,000 draws at 50, 100 and 200 labels (P1), with a median width of 9.7 points at 100 labels against 20.4 for labels drawn from all plots (P2); they named LCMAP on 5.9%, 12.0% and 29.0% of draws and never named Esri, where labels drawn from all plots named LCMAP on 1.2%, 2.5% and 4.8% and Esri on 0.1%, 0.15% and 0.05%. Three hundred random plots gave an exact error-rate interval that covered on 95.0% (LCMAP) and 95.65% (Esri) of draws (P3)."
  crosscheck: tests/test_exp92.py::test_exp92_by_a_second_route
  status: supported
  experiments: [exp92, exp90]
  artifacts: [exp/out/exp92_summary.json]
  check: |-
    (lambda d: (lambda q, c: d["preregistered"] is True and (q["N"], q["D"], q["K_A"], q["K_B"]) == (24968, 5387, 2728, 2062)
      and [round(100 * q[k], 1) for k in ("acc_lcmap", "acc_esri", "delta")] == [82.3, 79.6, 2.7]
      and [round(100 * c[f"disagree_{n}"]["coverage"], 2) for n in (50, 100, 200)] == [98.95, 98.55, 98.5]
      and round(c["disagree_100"]["median_width_points"], 1) == 9.7 and round(c["random_100"]["median_width_points"], 1) == 20.4
      and [round(100 * c[f"{g}_{n}"]["decides_right"], 2) for g in ("disagree", "random") for n in (50, 100, 200)] == [5.9, 11.95, 29.0, 1.2, 2.5, 4.75]
      and [round(100 * c[f"random_{n}"]["decides_wrong"], 2) for n in (50, 100, 200)] == [0.1, 0.15, 0.05]
      and all(c[f"disagree_{n}"]["decides_wrong"] == 0 for n in (50, 100, 200))
      and [round(100 * d["Q2"][m]["coverage"], 2) for m in ("lcmap", "esri")] == [95.0, 95.65]
      and all(d["prereg"][p]["holds"] for p in ("P1", "P2", "P3"))
    )(d["Q1"], d["Q1"]["cells"]))(A["exp/out/exp92_summary.json"])
  cited_in:
    - {file: docs/results/comparisons.md, marker: exp92-products-labelled-routes-hold}
    - {file: docs/Findings.md, marker: exp92-products-labelled-routes-hold}
    - {file: docs/Summary.md, marker: exp92-products-labelled-routes-hold}
  note: >-
    Preregistered on 4 October 2026 (08d5985), amended before any value was analysed (5e365be). Corrected before
    recording: the first extraction left out 734 plots with Esri data by taking an empty window from an overlapping
    UTM tile (first analysis: 24,235 plots, 82.3% and 79.7%, the same verdicts). The plots stand in for the map
    population, so the gradings are exact against their truth. The reference uses LCMAP's legend, so Esri is graded
    through a crosswalk; whether reference plots trained LCMAP Collection 1.3 was not checked; one year; the certified
    zone was not graded. Found after the result: at 400, 800 and 1,600 labels the disagree design named LCMAP on 62%,
    95.5% and 100% of draws, the whole-map design on 10%, 22% and 55% (91% at 3,200).

