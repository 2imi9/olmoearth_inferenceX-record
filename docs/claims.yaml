- id: exp110-ftw-field-plus-boundary-reading
  statement: "Reported beside exp110's graded result, not in place of it, as the owner ruled on 14 October 2026, in the record's first test on another organisation's deployed product outside land cover: the FTW benchmark's 2-class mask is field only (it equals the 3-class mask's field class pixel for pixel in all four countries, with 449,464, 968,577, 334,035 and 951,825 boundary pixels coded background), while the map is read as field + boundary. With the truth taken instead as the window majority of field + boundary, a reading chosen after the labels were read with the maps, FTW's field map's window error rate is 0.1150 (Belgium), 0.0776 (Croatia), 0.0343 (Slovenia) and 0.1450 (Sweden), 0.1025 pooled, against 0.1356, 0.0972, 0.0419, 0.1415 and 0.1110 under the graded truth: lower in three countries and higher in Sweden, so the boundary pixels coded background account for only part of the window errors. The six verdicts are the same: P1 is met in all 4 countries (Belgium's AUROC 0.842, lead 0.056); P4(b) in 3 of 4 (Belgium falls to 0.673, B3 still the better-agreeing map; Slovenia rises to 0.963); P3(b) in 2 of 4 on the run's draw seeds (Croatia's median 0.00) and 3 of 4 on an independent set (Croatia 0.55); the exact coverage is at least 0.955, at most 0.0295 of draws certify a zone wrong more often than alpha, and the worse map is named with probability at most 0.0064."
  crosscheck: tests/test_exp110.py::test_exp110_recorded_by_a_second_route
  status: measured
  experiments: [exp110]
  artifacts: [exp/out/exp110_summary.json, exp/out/exp110_crosscheck.json]
  check: |-
    (lambda S, C: (lambda P, F, K, V, VI, pops: all(K[c]['mask2_eq_mask3_field'] and not K[c]['mask2_eq_mask3_field_or_boundary'] for c in pops[:4])
      and [S['checks']['labels'][c]['mask2_differs_from_mask3_field_or_boundary_pixels'] for c in pops[:4]] == [449464, 968577, 334035, 951825]
      and [round(F[c]['arm1']['theta'], 4) for c in pops] == [0.115, 0.0776, 0.0343, 0.145, 0.1025]
      and [round(P[c]['arm1']['theta'], 4) for c in pops] == [0.1356, 0.0972, 0.0419, 0.1415, 0.111]
      and [F[c]['arm1']['theta'] < P[c]['arm1']['theta'] for c in pops] == [True, True, True, False, True]
      and all(V[k]['holds'] is True for k in ('P1', 'P2', 'P3a', 'P3b', 'P4a', 'P4b'))
      and V['P1']['countries_meeting'] == ['belgium', 'croatia', 'slovenia', 'sweden']
      and [round(F['belgium']['arm1'][k], 3) for k in ('auroc', 'lead_over_best_control')] == [0.842, 0.056]
      and V['P4b']['countries_meeting'] == ['croatia', 'slovenia', 'sweden']
      and [round(V['P4b']['p_right'][c], 3) for c in ('belgium', 'slovenia')] == [0.673, 0.963] and F['belgium']['arm4']['better_agreeing'] == 'b3'
      and V['P3b']['countries_meeting'] == ['belgium', 'slovenia'] and V['P3b']['median_certified_share']['croatia'] == 0.0
      and VI['P3b']['countries_meeting'] == ['belgium', 'croatia', 'slovenia'] and VI['P3b']['median_certified_share']['croatia'] == 0.55
      and round(V['P2']['min_exact_coverage'], 3) == 0.955
      and round(max(list(V['P3a']['violation_share'].values()) + list(VI['P3a']['violation_share'].values())), 4) == 0.0295
      and round(V['P4a']['max_p_wrong'], 4) == 0.0064
    )(S['populations'], C['field_plus_boundary'], C['countries'], C['field_plus_boundary_verdicts'],
