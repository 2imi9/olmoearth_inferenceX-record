- id: lucas-two-dates-are-phenology
  statement: "One place read through two Sentinel-2 acquisitions a median 118 days apart changes the model's decision on 31.2% of 7,109 LUCAS polygons against a probe-reseed floor of 0.30%, about a hundred times more than reseeding the head, and the surveyor settles which side is right: among the 2,221 differences the near-date acquisition is correct 917 times against the far one's 591 (one-sided p = 2e-17) with both wrong on 713, the two dates' error sets overlapping at phi 0.579, and the differing polygons carry the low-margin cue at 2.96 times and the boundary cue at only 1.11; the change rate is phenology and not noise, cropland changing on 44.5% against woodland's 20.8% and artificial land's 21.3%, which is preregistered P5 holding, with bare land the least stable class of all at 46.4%, unpredicted and right for a survey year."
  status: supported
  experiments: [exp68]
  artifacts: [exp/out/exp68_summary.json]
  check: |-
    (lambda V, B:
      V['P5']['holds'] is True
      and round(V['P5']['cropland_change_rate'], 4) == 0.4454
      and round(V['P5']['woodland'], 4) == 0.2082 and round(V['P5']['artificial'], 4) == 0.2131
      and V['P5']['cropland_change_rate'] >= 2 * max(V['P5']['woodland'], V['P5']['artificial'])
      and V['P5']['cloud_clear_only']['cropland'] >= 2 * max(V['P5']['cloud_clear_only']['woodland'],
                                                             V['P5']['cloud_clear_only']['artificial'])
      and B['n'] == 7109 and round(B['disagreement_rate'], 4) == 0.3124
      and B['disagreement_rate'] > 50 * B['head_draw_floor']
      and B['which_side']['a_right'] == 917 and B['which_side']['b_right'] == 591
      and B['near_beats_far_sign_test']['p_greater'] < 1e-12
      and round(B['crosstab']['phi'], 3) == 0.579
      and B['where']['low_margin_near']['enrichment'] > 2.5 and B['where']['boundary_near']['enrichment'] < 1.3
      and max(v['change_rate'] for v in B['per_class'].values()) == B['per_class']['bare']['change_rate']
    )(A['exp/out/exp68_summary.json']['verdicts'], A['exp/out/exp68_summary.json']['results']['part_b'])
  cited_in:
    - {file: docs/Findings.md, marker: lucas-two-dates-are-phenology}
    - {file: docs/TECHNIQUES.md, marker: lucas-two-dates-are-phenology}
    - {file: docs/results/comparisons.md, marker: lucas-two-dates-are-phenology}
  note: >-
    P5 failed on the two runs before the window anchor was corrected: the chip is centred on the survey point at pixel 32
    and the encoder reads the 60 px crop from the top-left, so the point sits in window 8 of 15 while the grid centre is
    7, and a twelfth of polygons were graded on a window 40 m from the point. The probe-reseed rate is the floor for a
    different question, whether the head is stable; the floor for a two-date change rate is the rate on cover that did
    not change, whose closest observable bound here is the most stable class, woodland at 0.208.

- id: eurocrops-ranking-holds-on-declarations
  statement: "On 106,274 graded 4-px windows of farmers' declared crops across Austria, Denmark and Slovenia, a reference that is neither photointerpretation nor another model's output nor a field visit but a legal declaration of what was sown, the model's own margin beats the best no-model control in every region, by 0.0527, 0.1348 and 0.0521 of excess AURC, and on all but four of the 147 20 km grid cells carrying enough graded windows to score (50/3, 70/0 and 23/1; p = 3e-12, 8e-22 and 1e-06); preregistered P1 holds, the margin is within 0.001 of excess AURC of one minus the top-1 probability in every region (which is slightly ahead in Denmark and Slovenia) and ahead of entropy and the boundary-first order, and every number is reproduced at a fixed reference probe as well as at the tuned one, the leads differing by at most 0.003."
  crosscheck: tests/test_recorded.py::test_exp69_eurocrops_recomputes_from_the_committed_windows
  status: supported
  experiments: [exp69]
  artifacts: [exp/out/exp69_summary.json]
  check: |-
    (lambda V, R:
      V['P1']['holds'] is True and set(R) == {'at', 'dk', 'si'}
      and sum(R[r]['n_graded_windows_year0'] for r in R) == 106274
      and all(R[r]['part_a']['margin_lead'] >= 0.01 for r in R)
      and all(R[r]['part_a']['cell_sign_test']['p'] < 1e-5 for r in R)
      and sum(R[r]['part_a']['cell_sign_test']['losses'] for r in R) == 4
      and sum(R[r]['part_a']['cell_sign_test']['wins'] for r in R) == 143
      and round(R['at']['part_a']['margin_lead'], 4) == 0.0527
      and round(R['dk']['part_a']['margin_lead'], 4) == 0.1348
      and round(R['si']['part_a']['margin_lead'], 4) == 0.0521
      # the margin is within 0.001 of one minus top-1 in every region (top-1 ahead in Denmark and Slovenia),
      # and ahead of entropy and the boundary-first order everywhere
      and all(abs(R[r]['part_a']['signals']['margin']['excess_aurc'] - R[r]['part_a']['signals']['one_minus_top1']['excess_aurc']) < 0.001 for r in R)
      and [r for r in sorted(R) if R[r]['part_a']['signals']['one_minus_top1']['excess_aurc'] < R[r]['part_a']['signals']['margin']['excess_aurc']] == ['dk', 'si']
      and all(R[r]['part_a']['signals']['margin']['excess_aurc'] < min(R[r]['part_a']['signals'][k]['excess_aurc'] for k in ('entropy', 'boundary_first')) for r in R)
      # and the conclusion does not depend on how long the probe trained
      and all(abs(R[r]['reference_probe']['margin_lead'] - R[r]['part_a']['margin_lead']) <= 0.003 for r in R)
    )(A['exp/out/exp69_summary.json']['verdicts'], A['exp/out/exp69_summary.json']['results']['regions'])
  cited_in:
    - {file: docs/Findings.md, marker: eurocrops-ranking-holds-on-declarations}
    - {file: docs/TECHNIQUES.md, marker: eurocrops-ranking-holds-on-declarations}
    - {file: docs/results/comparisons.md, marker: eurocrops-ranking-holds-on-declarations}
    - {file: docs/Summary.md, marker: eurocrops-ranking-holds-on-declarations}
  note: >-
    A declaration is authoritative about crop identity and can be wrong about extent, which is a cadastral boundary
    rather than what the sensor sees, about timing, and about whether the declared crop was planted. Slovenia's codes
    join the harmonisation at 0.853 against Austria's 0.996 and Denmark's 0.999, and unmapped codes are not a random
    sample of crops, so its numbers carry a selection risk the other two do not.

- id: eurocrops-the-labelled-floor-for-a-two-date-difference
  statement: "The floor for a two-date change rate is measured here for the first time, because EuroCrops labels both years: the model changes its decision on 0.143 of Austrian, 0.366 of Danish and 0.060 of Slovenian windows whose declared crop did NOT change between the two summers, against 0.758, 0.843 and 0.589 of those where it did, ratios of 5.29, 2.31 and 9.85, so preregistered P2 holds and a two-date difference is mostly the ground moving rather than the model wavering; the floor tracks the model and not the place, being 0.060 where window accuracy is 0.845 and 0.366 where it is 0.695, and it is one to two orders of magnitude above the 0.3% probe-reseed rate that exp68 had to compare its 31% land-cover change rate against, which flattered that number."
  crosscheck: tests/test_recorded.py::test_exp69_eurocrops_recomputes_from_the_committed_windows
  status: supported
  experiments: [exp69, exp68]
  artifacts: [exp/out/exp69_summary.json, exp/out/exp68_summary.json]
  check: |-
    (lambda V, R, B:
      V['P2']['holds'] is True
      and all(R[r]['part_b']['ratio'] >= 2.0 for r in R)
      and round(R['at']['part_b']['model_change_rate_declared_same'], 3) == 0.143
      and round(R['dk']['part_b']['model_change_rate_declared_same'], 3) == 0.366
      and round(R['si']['part_b']['model_change_rate_declared_same'], 3) == 0.060
      and round(R['at']['part_b']['model_change_rate_declared_changed'], 3) == 0.758
      and round(R['dk']['part_b']['model_change_rate_declared_changed'], 3) == 0.843
      and round(R['si']['part_b']['model_change_rate_declared_changed'], 3) == 0.589
      # the floor tracks the model: the region with the best windows has the lowest floor and vice versa
      and min(R, key=lambda r: R[r]['part_b']['model_change_rate_declared_same'])
          == max(R, key=lambda r: R[r]['window_accuracy_report'])
      and max(R, key=lambda r: R[r]['part_b']['model_change_rate_declared_same'])
          == min(R, key=lambda r: R[r]['window_accuracy_report'])
      # every labelled floor is far above the head-reseed rate exp68 had to use
      and all(R[r]['part_b']['model_change_rate_declared_same'] > 10 * B['head_draw_floor'] for r in R)
      # and the ratios survive the fixed reference probe
      and all(R[r]['reference_probe']['ratio'] >= 2.0 for r in R)
    )(A['exp/out/exp69_summary.json']['verdicts'], A['exp/out/exp69_summary.json']['results']['regions'],
      A['exp/out/exp68_summary.json']['results']['part_b'])
  cited_in:
    - {file: docs/Findings.md, marker: eurocrops-the-labelled-floor-for-a-two-date-difference}
    - {file: docs/TECHNIQUES.md, marker: eurocrops-the-labelled-floor-for-a-two-date-difference}
    - {file: docs/results/comparisons.md, marker: eurocrops-the-labelled-floor-for-a-two-date-difference}
  note: >-
    Slovenia's ratio rests on 460 windows whose declared crop changed, 3.8% of its graded windows, because much of its
    sample is permanent grassland; Austria's rests on 13,402 and Denmark's on 30,082. The floor is not a pure model
    property either: a declaration can be identical in two years while the field was managed differently, so this is an
    upper bound on how stable the ground was and therefore a conservative floor.

- id: eurocrops-a-difference-can-be-the-model-tracking-the-ground
  statement: "Labelling both dates exposes a case a single reference cannot represent: among windows where two years' inferences differ, the model is right about BOTH years on 0.287 of Austrian, 0.367 of Danish and 0.051 of Slovenian ones, meaning the difference between the two inferences was the model correctly following a real crop rotation rather than either side being wrong; with one reference that case is scored as a side being wrong, which is how this repository has scored it since exp60, and preregistered P3 is comfortably met besides, the undecidable share where neither year is right falling to 0.206, 0.129 and 0.290 against a bar of one half."
  status: supported
  experiments: [exp69]
  artifacts: [exp/out/exp69_summary.json]
  check: |-
    (lambda V, R:
      V['P3']['holds'] is True
      and all(R[r]['part_b']['share_neither_right'] < 0.5 for r in R)
      # Shares are checked to 0.005, not to a bit-exact rounding: rerunning this stage on a CPU instead of a GPU flipped
      # one window of 13,373 and moved the third decimal of one share, which is not a change in the finding and must not
      # read as one. The load-bearing quantities, the leads and the change rates, are pinned tighter elsewhere.
      and abs(R['at']['part_b']['share_neither_right'] - 0.206) < 0.005
      and abs(R['dk']['part_b']['share_neither_right'] - 0.129) < 0.005
      and abs(R['si']['part_b']['share_neither_right'] - 0.290) < 0.005
      # right about both years = year0 right + year1 right + neither - 1, the four cells summing to one
      and all(0.0 <= (R[r]['part_b']['share_year0_right'] + R[r]['part_b']['share_year1_right']
                      + R[r]['part_b']['share_neither_right'] - 1.0) <= 1.0 for r in R)
      and abs(R['at']['part_b']['share_year0_right'] + R['at']['part_b']['share_year1_right']
              + R['at']['part_b']['share_neither_right'] - 1.0 - 0.287) < 0.005
      and abs(R['dk']['part_b']['share_year0_right'] + R['dk']['part_b']['share_year1_right']
              + R['dk']['part_b']['share_neither_right'] - 1.0 - 0.367) < 0.005
      and abs(R['si']['part_b']['share_year0_right'] + R['si']['part_b']['share_year1_right']
              + R['si']['part_b']['share_neither_right'] - 1.0 - 0.051) < 0.005
      and 48000 <= sum(R[r]['part_b']['n_differing'] for r in R) <= 48500
    )(A['exp/out/exp69_summary.json']['verdicts'], A['exp/out/exp69_summary.json']['results']['regions'])
  cited_in:
    - {file: docs/Findings.md, marker: eurocrops-a-difference-can-be-the-model-tracking-the-ground}
    - {file: docs/TECHNIQUES.md, marker: eurocrops-a-difference-can-be-the-model-tracking-the-ground}
    - {file: docs/results/comparisons.md, marker: eurocrops-a-difference-can-be-the-model-tracking-the-ground}
  note: >-
    The both-right share is derived from the three recorded shares by the identity that the four cells of the
    right-about-year-0 by right-about-year-1 table sum to one over the differing windows, which the check asserts rather
    than assumes. The shares are pinned to 0.005 rather than to an exact rounding because regenerating the artifact on a
    CPU rather than a GPU flipped one window of 13,373 and moved a third decimal, which is not a change in the finding.
    Slovenia's 0.051 is low because only 3.8% of its declarations changed at all, so there is little
    rotation for the model to follow.

- id: suite-margin-wins-every-task
  statement: "On all 24 scored tasks of Ai2's published embedding suite, chosen by them for their own paper and not by us, the model's own margin ranks its errors better than the better of the two no-model controls computable from the embeddings (distance to the training mean, and how rare the probe's predicted class is), with a lead from 0.0157 to 0.2278 of excess AURC and a median of 0.1158 (one-sided exact sign test over tasks, 24 of 24, p = 6e-08). The win also holds on all 14 distinct sources (sign test over sources, 14 of 14, p = 6.1e-05); the tasks are not 24 independent datasets, since fifteen of them (three AWF sensors, three nandi sensors, six cropharvest variants and three PASTIS variants) share five sources. It holds across an accuracy range from 0.333 to 0.979 over 6,435,473 graded units, and preregistered P1 holds. The two controls are near chance on this suite (suite-controls-are-near-chance), and six of the seven segmentation outcomes were on record before the preregistration (suite-six-segmentation-outcomes-were-on-record)."
  status: supported
  experiments: [exp70]
  artifacts: [exp/out/exp70_summary.json]
  check: |-
    (lambda R, sign_p: (lambda lead: (lambda srcs, w, l:
      # recounted from the per-task signals: the margin wins a task when its excess AURC is below the smaller control's
      len(R) == 24 and w == 24 and l == 0
      and all(abs(lead[t] - R[t]['margin_lead']) < 1e-12 for t in R)
      # the exact one-sided sign test over tasks, 24 of 24: 0.5 ** 24 = 6e-08
      and sign_p(w, l) < 1e-6 and round(sign_p(w, l), 9) == 6e-08
      # a source is won when the mean lead over the tasks sharing it is positive, as exp70 counts it: 14 of 14
      and len(srcs) == 14 and sum(1 for v in srcs.values() if sum(v) / len(v) > 0) == 14
      # the same exact test over the 14 sources, 14 of 14: 0.5 ** 14 = 6.1e-05
      and round(sign_p(14, 0), 6) == 6.1e-05
      # fifteen tasks share five sources; the other nine are one task each
      and sorted(len(v) for v in srcs.values()) == [1] * 9 + [3, 3, 3, 3, 3]
      and round(min(lead.values()), 4) == 0.0157 and round(max(lead.values()), 4) == 0.2278
      and round(median(lead.values()), 4) == 0.1158
      and round(min(R[t]['test_accuracy'] for t in R), 3) == 0.333
      and round(max(R[t]['test_accuracy'] for t in R), 3) == 0.979
      and sum(R[t]['n_units'] for t in R) == 6435473
    )({R[t]['source']: [lead[u] for u in R if R[u]['source'] == R[t]['source']] for t in R},
      sum(1 for v in lead.values() if v > 0), sum(1 for v in lead.values() if v < 0)))(
      {t: min(R[t]['signals'][c]['excess_aurc'] for c in ('ctl_embedding_distance', 'ctl_class_rarity'))
          - R[t]['signals']['margin']['excess_aurc'] for t in R}))(
      A['exp/out/exp70_summary.json']['results']['tasks'],
      # the exact binomial tail, with the binomial coefficient as a product taken through log (the only transcendental the ledger has)
      lambda w, l: sum(round(2 ** (sum(log((w + l - k + i) / i) for i in range(1, k + 1)) / log(2))) for k in range(w, w + l + 1)) / 2 ** (w + l))
  cited_in:
    - {file: docs/Findings.md, marker: suite-margin-wins-every-task}
    - {file: docs/TECHNIQUES.md, marker: suite-margin-wins-every-task}
    - {file: docs/results/comparisons.md, marker: suite-margin-wins-every-task}
    - {file: docs/Summary.md, marker: suite-margin-wins-every-task}
  note: >-
    The embeddings are Ai2's, extracted with their settings, so this inherits their extraction and is not an independent
    implementation of their models. The suite measures accuracy and no public benchmark measures label-free error
    ranking, so this is a task set and not a leaderboard result. The controls available from embeddings alone are
    weaker than the pixel indices used elsewhere here, because the imagery is not published with them.

- id: suite-six-segmentation-outcomes-were-on-record
  statement: "exp70's preregistration was not blind on six of its seven segmentation tasks. On five of them (MADOS, PASTIS Sentinel-2, PASTIS Sentinel-1+2, m-cashew-plant and m-SA-crop-type) exp54 had already scored OlmoEarth Base's margin on the same windows, with the same excess AURC, and found it ahead of an embedding-distance control; on Sen1Floods11 exp51's arm A had scored the same 592,385 windows with the same excess AURC. Both were committed three days before exp70's script and preregistration. On the other 18 tasks the margin beats both controls on 18 of 18 (one-sided exact sign test, p = 3.8e-06). Only one of them, AWF Sentinel-2, appears in earlier artifacts, and its outcome was partly seen: exp41 had scored OlmoEarth Base's confidence on its 200 test units with another probe (61 errors, against exp70's 34) and without exp70's controls, and exp04 and exp16 had found confidence ranking errors best of the signals they graded on AWF's expert labels with Sentinel-2, on the AWF project's own split (344 points). On the 17 tasks without an earlier artifact the margin wins 17 of 17 (p = 7.6e-06)."
  status: measured
  experiments: [exp70, exp54, exp51, exp41, exp04, exp16]
  artifacts: [exp/out/exp70_summary.json, exp/out/exp54_summary.json, exp/out/exp51_summary.json, exp/out/exp41_summary.json, exp/out/exp16_summary.json]
  check: |-
    (lambda T, s54, s51, s41, s16:
      # the five tasks exp54 scored for OlmoEarth Base: the same windows and the same margin excess AURC as exp70,
      # and the margin ahead of exp54's embedding-distance control
      sorted(s54) == ['m_cashew_plant', 'm_sa_crop_type', 'mados', 'pastis_sentinel1_sentinel2', 'pastis_sentinel2']
      and all(s54[t]['olmoearth_base']['n_windows'] == T[t]['n_units']
              and abs(s54[t]['olmoearth_base']['pooled_eaurc']['probe confidence'] - T[t]['signals']['margin']['excess_aurc']) < 1e-9
              and s54[t]['olmoearth_base']['pooled_eaurc']['probe confidence'] < s54[t]['olmoearth_base']['pooled_eaurc']['control embedding distance']
              for t in s54)
      # Sen1Floods11: exp51's arm A on Ai2's embeddings, the same windows, accuracy and margin excess AURC
      and s51['n_windows'] == T['sen1floods11']['n_units'] == 592385
      and abs(s51['accuracy'] - T['sen1floods11']['test_accuracy']) < 1e-12
      and abs(s51['pooled_eaurc']['probe confidence'] - T['sen1floods11']['signals']['margin']['excess_aurc']) < 1e-8
      # the seventh segmentation task, PASTIS Sentinel-1, was in neither
      and sorted(t for t in T if T[t]['family'] == 'segmentation') == sorted(list(s54) + ['sen1floods11', 'pastis_sentinel1'])
      # the other 18 tasks: the margin beats both controls on every one; the exact sign test, 0.5 ** 18
      and (lambda rest: len(rest) == 18 and all(
            T[t]['signals']['margin']['excess_aurc'] < min(T[t]['signals'][c]['excess_aurc'] for c in ('ctl_embedding_distance', 'ctl_class_rarity'))
            for t in rest))([t for t in T if t not in s54 and t != 'sen1floods11'])
      and round(0.5 ** 18, 7) == 3.8e-06
      # exp41 scored one of the 18, AWF Sentinel-2, with another probe on the same 200 test units
      and sorted(s41) == ['awf_sentinel2', 'sen1floods11']
      and s41['awf_sentinel2']['n_test_windows'] == T['awf_sentinel2']['n_units'] == 200
      and s41['awf_sentinel2']['n_test_errors'] == 61 and round(T['awf_sentinel2']['error_rate'] * 200) == 34
      # exp16 (exp04's errors, the AWF project's own split): confidence had the lowest AURC of the signals it graded
      and s16['n'] == 344 and s16['aurc']['baseline'] == min(s16['aurc'].values()) and len(s16['aurc']) == 3
      # without AWF Sentinel-2, 17 of 17; the exact sign test, 0.5 ** 17
      and T['awf_sentinel2']['signals']['margin']['excess_aurc'] < min(T['awf_sentinel2']['signals'][c]['excess_aurc'] for c in ('ctl_embedding_distance', 'ctl_class_rarity'))
      and round(0.5 ** 17, 7) == 7.6e-06
    )(A['exp/out/exp70_summary.json']['results']['tasks'], A['exp/out/exp54_summary.json']['results'],
      A['exp/out/exp51_summary.json']['results']['A_olmoearth_base']['matched'], A['exp/out/exp41_summary.json']['tasks'],
      A['exp/out/exp16_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: suite-six-segmentation-outcomes-were-on-record}
    - {file: docs/Findings.md, marker: suite-six-segmentation-outcomes-were-on-record}
    - {file: docs/TECHNIQUES.md, marker: suite-six-segmentation-outcomes-were-on-record}
  note: >-
    Not disclosed when exp70 was recorded; found by the red team of 30 September 2026. The dates are from the history,
    not from an artifact: exp51 was recorded in 486ef3f and exp54 in f74eb7c, both on 10 September 2026; exp70's script,
    which carries its preregistration, entered in f843556 on 13 September and its result in b899b73 the same day. exp54's
    embedding-distance control is not exp70's (its excess AURC differs), and exp51 scored a sensor-level and an NDWI
    control rather than exp70's two, so what was on record is the margin's own score on those windows, not the exp70
    comparison itself. Of the other 18 tasks, only AWF Sentinel-2 is named in an artifact committed before f843556
    (exp41, 2219ec0, 8 September 2026), with another probe. AWF's expert labels with Sentinel-2 were also graded from
    31 August on the AWF project's own split (exp04 in b6013ea, exp16 in 515118d on 2 September), where confidence
    ranked errors best (claim awf-confidence-lowest-aurc); that split is not the suite's 200 test units, but the
    outcome on that data was known, so the count without AWF Sentinel-2, 17 of 17, is given beside the 18 of 18. Added
    on 30 September 2026 after a reviewer of the red-team corrections pointed to exp04.

- id: external-references-carry-informative-controls
  statement: "Unlike the suite's two controls, the best no-model control on three external references finds errors above chance, about twice a random review on Dynamic World and less on LUCAS, and the margin beats it there too. On Dynamic World's expert tiles the class-rarity control finds 0.217 of the errors in a 10% review, where a random 10% finds 0.10, and the margin's lead over it is 0.048 of excess AURC; on EuroCrops the class-rarity control ranks errors with an AUROC of 0.70 in Austria and in Slovenia (in Denmark the pixel variance is the better control); on LUCAS the within-window pixel variance finds 0.149 of the design-weighted errors in a 10% review."
  status: measured
  experiments: [exp67, exp68, exp69]
  artifacts: [exp/out/exp67_summary.json, exp/out/exp68_summary.json, exp/out/exp69_summary.json]
  check: |-
    (lambda D, L, E:
      # Dynamic World: the class-rarity control's capture at a 10% budget, and the margin's pooled lead over it
      round(D['capture']['control class rarity']['0.1'], 3) == 0.217
      and round(D['tests']['control class rarity']['pooled_lead'], 3) == 0.048
      and D['pooled_excess_aurc']['margin'] < D['pooled_excess_aurc']['control class rarity']
      # LUCAS: the pixel variance is the best control; its design-weighted capture at 10%, and the margin ahead of it
      and L['best_control'] == 'ctl_pixel_variance'
      and round(L['signals']['ctl_pixel_variance']['capture_weighted']['0.1'], 3) == 0.149
      and round(L['signals']['ctl_pixel_variance']['capture_naive']['0.1'], 3) == 0.101
      and L['signals']['margin']['excess_aurc_weighted'] < L['signals']['ctl_pixel_variance']['excess_aurc_weighted']
      # EuroCrops: class rarity is the best control in Austria and Slovenia, AUROC 0.70 in both; the margin leads everywhere
      and {r: E[r]['part_a']['best_control'] for r in E} == {'at': 'ctl_class_rarity', 'dk': 'ctl_pixel_variance', 'si': 'ctl_class_rarity'}
      and round(E['at']['part_a']['signals']['ctl_class_rarity']['auroc'], 2) == 0.70
      and round(E['si']['part_a']['signals']['ctl_class_rarity']['auroc'], 2) == 0.70
      and all(E[r]['part_a']['margin_lead'] > 0 for r in E)
    )(A['exp/out/exp67_summary.json']['results']['ranking'], A['exp/out/exp68_summary.json']['results']['part_a'],
      A['exp/out/exp69_summary.json']['results']['regions'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: external-references-carry-informative-controls}
    - {file: docs/Findings.md, marker: external-references-carry-informative-controls}
    - {file: docs/Summary.md, marker: external-references-carry-informative-controls}
  note: >-
    Read from the three experiments' committed summaries after the red team of 30 September 2026 found the suite's
    controls near chance (suite-controls-are-near-chance). A random review of 10% finds 0.10 of the errors in
    expectation. LUCAS's capture is under the Horvitz-Thompson weights its design needs; unweighted the pixel
    variance finds 0.101, no better than random.

- id: suite-holds-in-both-families
  statement: "The result is not a property of one task family: the margin beats the best no-model control on 17 of 17 classification tasks, where the graded unit is the sample, and on 7 of 7 segmentation tasks, where it is the 4 px window used everywhere else in this repository, so preregistered P2 holds and the claim does not have to be narrowed to a family by name; six of the tasks come from GEO-Bench 1, a third-party benchmark with its own paper, and the margin wins on all six."
  status: supported
  experiments: [exp70]
  artifacts: [exp/out/exp70_summary.json]
  check: |-
    (lambda V, R:
      V['P2']['holds'] is True
      and V['P2']['classification'] == '17/17' and V['P2']['segmentation'] == '7/7'
      and sum(1 for t in R if R[t]['family'] == 'classification') == 17
      and sum(1 for t in R if R[t]['family'] == 'segmentation') == 7
      and all(R[t]['margin_lead'] > 0 for t in R if R[t]['geobench'])
      and sum(1 for t in R if R[t]['geobench']) == 6
    )(A['exp/out/exp70_summary.json']['verdicts'], A['exp/out/exp70_summary.json']['results']['tasks'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: suite-holds-in-both-families}
    - {file: docs/results/comparisons.md, marker: suite-holds-in-both-families}

- id: suite-probe-gap-degrades-the-ordering
  statement: "exp68's warning about linear probes replicates in direction and not in magnitude, and the scope matters because that warning is on the front page: splitting these 24 tasks at their median train-minus-test gap of 0.087, the margin's advantage over predictive entropy is -0.000148 on the worse-generalising half against +0.000215 on the better half, which is exp68's direction and passes preregistered P3, but is four ten-thousandths rather than the outright inversion exp68 saw, and the reason is visible in the gaps, a median of 0.087 here against 0.44 for exp68's default probe; so the ordering of confidence signals degrades with memorisation and only severe memorisation reverses it."
  crosscheck: tests/test_known_answer.py::test_exp70_p3_p_value_is_a_rank_sum_over_24_tasks_not_a_sign_test_over_144_pairs
  status: mixed
  experiments: [exp70, exp68]
  artifacts: [exp/out/exp70_summary.json, exp/out/exp68_summary.json]
  check: |-
    (lambda V, T:
      V['P3']['holds'] is True
      and V['P3']['margin_over_entropy_wide_gap'] < V['P3']['margin_over_entropy_tight_gap']
      and round(V['P3']['median_gap'], 3) == 0.087
      and V['P3']['n_wide'] == 12 and V['P3']['n_tight'] == 12
      and abs(V['P3']['margin_over_entropy_tight_gap'] - V['P3']['margin_over_entropy_wide_gap']) < 0.001
      and T['chosen']['weight_decay'] == 100.0
    )(A['exp/out/exp70_summary.json']['verdicts'], A['exp/out/exp68_summary.json']['results']['probe_tuning'])
  cited_in:
    - {file: docs/Findings.md, marker: suite-probe-gap-degrades-the-ordering}
    - {file: docs/results/comparisons.md, marker: suite-probe-gap-degrades-the-ordering}
  note: >-
    The magnitude clause is deliberately part of the statement. exp68's inversion was dramatic and this suite's probes
    do not reproduce it, so quoting exp68 alone would overstate how often the ordering flips in practice; quoting exp70
    alone would understate what a badly fitted probe can do. Both belong in the sentence.

- id: agent-skill-reproduces-the-package
  statement: "The OlmoEarth Agent's review-set skill computes what this repository computes, checked on real inference rather than on synthetic input: over the 17 single-label tasks of Ai2's published olmoearth_base embeddings, 143,776 graded units, the dependency-free pure-Python port and the numpy implementation every recorded number here was computed with agree bit-exactly on the arg-max decision (no disagreement on any unit) and, once numpy is promoted to the port's precision, on the top-1 minus top-2 margin (0.0 absolute) and on excess AURC, AUROC and capture at 5, 10 and 20 percent (worst 9.4e-16). At the probe's native float32 the margin differs by a constant 2.98e-08, which is that dtype's rounding and not a difference in what the two compute, and it moves excess AURC and AUROC by at most 2.7e-05 while leaving capture at every budget bit-identical, so the review set a reviewer acts on is the same set either way."
  status: supported
  experiments: [exp72]
  artifacts: [exp/out/exp72_agent_crosscheck.json]
  check: |-
    (lambda V, R, D, S:
      V['P1_decisions_and_margins_agree'] is True
      and V['P2_statistics_agree'] is True
      and V['P3_ties_exercised'] == 'holds'
      and len(R) == 17
      and sum(r['n'] for r in R) == 143776
      and all(r['n_decision_disagreements'] == 0 for r in R)
      and all(r['max_abs_margin_delta_f64'] == 0.0 for r in R)
      and all(r['max_stat_delta_f64'] <= 1e-09 for r in R)
      and all(r['probs_dtype'] == 'float32' for r in R)
      and all(round(r['max_abs_margin_delta'], 12) == round(2.9802322387695312e-08, 12) for r in R)
      and max(r['max_stat_delta'] for r in R) < 3e-05
      and all(r['deltas'][k] == 0.0 and r['deltas_f64'][k] == 0.0
              for r in R for k in ('capture@0.05', 'capture@0.10', 'capture@0.20'))
      and any(r['n_exact_margin_ties'] > 0 for r in R)
      and D['at_the_probe_dtype_float32']['P2'] is False
      and len(S) == 64
    )(A['exp/out/exp72_agent_crosscheck.json']['verdicts'],
      A['exp/out/exp72_agent_crosscheck.json']['results'],
      A['exp/out/exp72_agent_crosscheck.json']['dtype_note'],
      A['exp/out/exp72_agent_crosscheck.json']['skill_sha256'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: agent-skill-reproduces-the-package}
  note: >-
    A differential test, not a finding: it says the agent reports what the experiments report, so the evidence cited in
    the skill transfers to it, and it says nothing about whether the ranking is good, which is exp70's question. The
    float32 clause is in the statement because the synthetic unit test could not have found it: it generated float64
    matrices, so the two paths never disagreed, and only real probe output exposed the constant. The run pins the skill
    by sha256; editing that file invalidates this claim rather than silently weakening it.

- id: agent-benchmark-tool-arm-reproduces-the-package
  statement: "Handed the package as tools, nvidia/Qwen3.8-27B-NVFP4 reproduces the package: on the median card and pooled over forty cards its review set captures 1.000 of the package's own, 99.4% of the numbers it states are in its tool outputs, 99.5% of its stated cues hold, it declines the side question on every comparison card and fabricates no window in 120 runs; the OlmoEarth Agent as shipped, choosing among forty-one tools with only the score files named, picked the package's review-set tool on 40 of 40 runs and its compare tool on 10 of 10 comparison cards and did the same, 0.963 of the package's capture, 99.8% grounded, declining on 10 of 10."
  status: supported
  experiments: [exp64]
  artifacts: [exp/out/exp64_summary.json]
  check: |-
    (lambda S:
      S['model'] == 'nvidia/Qwen3.8-27B-NVFP4' and S['n_cards'] == 40 and S['n_runs'] == 480
      and S['share_of_package']['A']['pooled'] >= 0.999 and S['share_of_package']['A']['median'] >= 0.999
      and S['claims_audit']['A']['pooled'] > 0.99 and S['cue_accuracy']['A']['pooled'] > 0.99
      and S['declined_share']['A']['pooled'] == 1.0 and S['parse_failures']['A'] == 0
      and S['fabricated_windows']['A'] == 0
      and S['exploratory']['E']['pooled_claims'] > 0.99 and S['share_of_package']['E']['pooled'] > 0.95
      and S['exploratory']['E']['declined'] == 1.0 and S['exploratory']['E']['fabricated_windows'] == 0
      and S['exploratory']['E']['comparison_unanswered'] == 0.0
    )(A['exp/out/exp64_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: agent-benchmark-tool-arm-reproduces-the-package}
    - {file: docs/Findings.md, marker: agent-benchmark-tool-arm-reproduces-the-package}
    - {file: docs/TECHNIQUES.md, marker: agent-benchmark-tool-arm-reproduces-the-package}
  note: >-
    The model is at the low edge of the plan page's 30 to 70 billion range and NVFP4 is below its fp16-or-int8
    precision; both deviations are recorded in the section and in every output file. The agent arm was not
    preregistered and its numbers describe, they do not test.

- id: agent-benchmark-sandbox-rediscovers-the-ranking
  statement: "The package is not a ranking advantage over a model of this strength: preregistered P2 fails, because a numpy sandbox given the same arrays and no package captures 0.904 of the package's errors by itself, pooled 0.200 against the tool arm's 0.232, a difference of +0.032 below the preregistered 0.05 on 13 cards to 10, p = 0.34, which is the falsification the plan page named in advance; the half of P2 that holds is that the tool arm reaches the package's own capture on the median card."
  status: rejected
  experiments: [exp64]
  artifacts: [exp/out/exp64_summary.json]
  check: |-
    (lambda V, S:
      V['holds'] is False and 0 < V['difference'] < 0.05
      and V['wins'] == 13 and V['losses'] == 10 and V['p_value'] > 0.05
      and V['median_share_of_package_A'] >= 0.999
      and 0.89 < S['share_of_package']['B']['pooled'] < 0.92
    )(A['exp/out/exp64_summary.json']['verdicts']['P2_review_capture'], A['exp/out/exp64_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: agent-benchmark-sandbox-rediscovers-the-ranking}
    - {file: docs/Findings.md, marker: agent-benchmark-sandbox-rediscovers-the-ranking}
    - {file: docs/TECHNIQUES.md, marker: agent-benchmark-sandbox-rediscovers-the-ranking}
  note: >-
    The cards are binary water tasks and the sandbox is handed the margin by name, so its rediscovery is a sort
    and not the knowledge that the margin is the signal; a multi-class card set with raw per-class scores is the
    harder test and is open. A 7B pilot on four cards had the sandbox inventing margin values, so this is a
    property of a model of this strength.

- id: agent-benchmark-grounding-not-decisive
  statement: "Preregistered P1 fails once the claims audit reads numbers inside text outputs: the sandbox arm grounds 94.2% of its stated numbers in what it printed against 99.4% for the tool arm, a difference of 0.052 below the preregistered 0.2 on 5 cards to 1, p = 0.11; the first grading had scored the sandbox at zero and P1 as holding because the audit pooled numbers from JSON fields only, a bias toward the arm whose tools answer in JSON, and that reading was withdrawn."
  status: rejected
  experiments: [exp64]
  artifacts: [exp/out/exp64_summary.json]
