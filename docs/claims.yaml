- id: shared-errors-task-dependent
  statement: "Encoders share OlmoEarth's error windows on the multi-class tasks too, not only on binary water: against OlmoEarth Base the five other encoders sit at phi 0.38-0.58 on MADOS and 0.50-0.68 on PASTIS Sentinel-2, co-erring on 78.7-83.2% of OlmoEarth's PASTIS error windows. exp54's phi block reported 0.26-0.44 and 0.05-0.08 for the same pairs and is withdrawn: it aligned rows by a hash of the label tile, which collides on identical tiles, and 0.08 is what phi becomes under scrambling."
  status: measured
  experiments: [exp63, exp54]
  artifacts: [exp/out/exp63_summary.json, exp/out/exp54_summary.json]
  check: |-
    (lambda a, b: (lambda P, M:
      round(min(P), 2) == 0.50 and round(max(P), 2) == 0.68
      and round(min(M), 2) == 0.38 and round(max(M), 2) == 0.58
      and all(0.786 <= c['both'] / c['errors_a'] <= 0.833
              for c in [p['graded']['crosstab'] for n, p in a['results']['pastis_sentinel2']['pairs'].items()
                        if n.startswith('olmoearth_base vs') and 'graded' in p])
      and all(v['phi'] < 0.09 for v in b['results']['pastis_sentinel2']['phi_vs_olmoearth_base'].values())
      and max(abs(p['graded']['crosstab']['errors_a'] - 87167) for n, p in a['results']['pastis_sentinel2']['pairs'].items()
              if n.startswith('olmoearth_base vs') and 'graded' in p) == 0
    )([p['graded']['crosstab']['phi'] for n, p in a['results']['pastis_sentinel2']['pairs'].items() if n.startswith('olmoearth_base vs') and 'graded' in p],
      [p['graded']['crosstab']['phi'] for n, p in a['results']['mados']['pairs'].items() if n.startswith('olmoearth_base vs') and 'graded' in p]))(
      A['exp/out/exp63_summary.json'], A['exp/out/exp54_summary.json'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: shared-errors-task-dependent}
    - {file: docs/results/comparisons.md, marker: shared-errors-task-dependent}
  note: >-
    Corrected on 2026-09-20. The superseded number came from exp54's cross-encoder block, whose guard checked only that
    every label-tile key was found, never that the resulting index was a permutation; identical label tiles collide to
    one key, so where they are not adjacent the reorder permutes rows even when a model is aligned against itself. The
    two runs contradict each other on their face: exp54's own conditional (0.246 that OlmoEarth is wrong where Galileo
    is) implies at least 30.9% decision disagreement on PASTIS, while exp63 measures 13.6% on the same 458,638 windows.
    The check reads BOTH artifacts, so it fails if either the corrected numbers or the withdrawn ones change. exp54's
    preregistered result is computed per encoder before any alignment and is unaffected.
- id: boundary-first-many-classes-split
  statement: At 15-19 classes the boundary-first order captures slightly fewer errors than confidence, or as many, at the 5% budget pooled over windows, while winning the per-tile sign test on four of six PASTIS encoders, on cashew (34/6) and on SA crop type (647/196).
  status: measured
  experiments: [exp54]
  artifacts: [exp/out/exp54_summary.json]
  check: |-
    (lambda r:
      all(x['boundary_first_vs_confidence']['0.05']['pooled_boundary_first'] <= x['boundary_first_vs_confidence']['0.05']['pooled_confidence'] + 0.001 for t in r for m, x in r[t].items() if m != 'phi_vs_olmoearth_base')
      and sum(1 for m, x in r['pastis_sentinel2'].items() if m != 'phi_vs_olmoearth_base' and x['boundary_first_vs_confidence']['0.05']['sign_p'] < 0.05 and x['boundary_first_vs_confidence']['0.05']['w'] > x['boundary_first_vs_confidence']['0.05']['l']) >= 4
      and (r['m_cashew_plant']['olmoearth_base']['boundary_first_vs_confidence']['0.05']['w'], r['m_cashew_plant']['olmoearth_base']['boundary_first_vs_confidence']['0.05']['l']) == (34, 6)
      and (r['m_sa_crop_type']['olmoearth_base']['boundary_first_vs_confidence']['0.05']['w'], r['m_sa_crop_type']['olmoearth_base']['boundary_first_vs_confidence']['0.05']['l']) == (647, 196)
    )(A['exp/out/exp54_summary.json']['results'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: boundary-first-many-classes-split}
    - {file: docs/results/comparisons.md, marker: boundary-first-many-classes-split}

- id: geoid-exception-rate
  statement: "Over 45 scored GEOID-Flood areas of interest the NDWI index beats the S2 head's confidence on 2 for permanent water and the sensor-level control beats the S1 head's confidence on 1 for post-event water (preregistered P1 and P2); those 45 areas come from only 9 and 10 CEMS activations and both permanent-water exceptions sit inside a single activation, EMSR273, so the honest exception rate is one activation in nine rather than two areas in forty-five, and clustered by activation the preregistered tests hold at p = 2e-03 and 1e-02 rather than 3e-11 and 1e-12; Bolivia-type exceptions exist and are a minority, to be read against nine activations and not forty-five events."
  crosscheck: tests/test_known_answer.py::test_exp55_activation_clustered_figures_reproduce_from_the_per_event_records
  status: supported
  experiments: [exp55]
  artifacts: [exp/out/exp55_summary.json]
  check: |-
    (lambda s, R:
      s['prereg']['P1'] is True and s['prereg']['P2'] is True and s['prereg']['complete'] is True
      and R['A']['across_events']['control NDWI level']['control_wins'] == 2 and R['A']['across_events']['n_events_scored'] == 45
      and R['B']['across_events']['control S1 level']['control_wins'] == 1
      and R['A']['across_events']['control NDWI level']['exception_rate'] < 1 / 3
    )(A['exp/out/exp55_summary.json'], A['exp/out/exp55_summary.json']['results'])
  note: >-
    Recomputed from the committed artifact with activations as the unit, averaging areas of interest inside an a
    ctivation first. This repository's protocol votes once per river on Sen1Floods11 for exactly this reason, an
    d the per-event sign test here was counting correlated units; the clustered table is in the exp55 section of
     results/comparisons.md.
  cited_in:
    - {file: docs/Findings.md, marker: geoid-exception-rate}
    - {file: docs/TECHNIQUES.md, marker: geoid-exception-rate}
    - {file: docs/results/comparisons.md, marker: geoid-exception-rate}

- id: geoid-capture-effect-size
  statement: "On the median GEOID-Flood area of interest the 5% of windows confidence flags hold 88% of the permanent-water errors and 64% of the post-event water errors, 17.5 and 12.8 times a random 5% (preregistered P3, threshold 0.25); the 45 areas cluster into 9 and 10 CEMS activations with EMSR192 contributing about half of them, and clustering by activation barely moves the effect a reviewer would feel, to 0.843 and 0.607, or 16.9 and 12.1 times a random 5%."
  crosscheck: tests/test_known_answer.py::test_exp55_activation_clustered_figures_reproduce_from_the_per_event_records
  status: supported
  experiments: [exp55]
  artifacts: [exp/out/exp55_summary.json]
  check: |-
