- id: exp117-normal-theory-calls-a-difference-the-valid-interval-does-not
  statement: "In exp117, NLCD 2016 led LCMAP at eight classes by 1.34 points of overall accuracy by the primary-or-alternate rule, which normal theory calls significant (0.41 to 2.26) and the valid interval does not (-0.17 to 2.86); by the primary label 1.87 points, 0.71 to 3.03 against -0.01 to 3.75."
