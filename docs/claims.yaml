      and round(b['gap'], 3) == 0.122 and [round(a, 3) for a in b['gap_interval90']] == [0.083, 0.162]
      and S['models']['v12']['point']['strict_only'] == 190 and x['counts']['confident_strict_only_errors'] == 22
      and x['floors']['P2_counts'] is True and x['floors']['P2_counts_if_strict_only_were_counted_among_the_confident'] is False
      and round(x['P2']['standardised']['auc_strict_only_vs_correct'], 9) == round(b['auc_strict_only_vs_correct'], 9)
