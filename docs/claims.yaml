- id: exp114-prior-correction-leaves-the-gap
  statement: "In a preregistered test (exp114, frozen ec4f05e) on exp113's PLANTEUR maps, refitted identically, correcting the OlmoEarth v1.3 map's posteriors with the held-out territory's true class shares (p_s * pi_t / pi_s) leaves the mean corrected posterior 0.089 (Guyane) and 0.198 (Réunion) in total variation from the true shares, against 0.009 on the default split (P1 holds, 2 of 3): most of those failures are not a change of class shares but feature shift or miscalibration out of distribution, which the gap does not separate. The corrected maps find 7.1% of Guyane's Meadow and 9.7% of Réunion's Sugarcane (producer's accuracy), up from 0.7% and 1.3%. Mayotte is not determined by the gap (crops 0.6% of the pixels; 0.005) and its corrected map finds no crop."
  crosscheck: tests/test_exp114.py::test_exp114_recorded_by_a_second_route
  status: supported
  experiments: [exp114, exp113]
  artifacts: [exp/out/exp114_summary.json, exp/out/exp114_crosscheck.json]
  check: |-
    (lambda S, C: (lambda m: S['verdicts']['P1']['holds'] is True and C['verdicts']['P1']['holds'] is True and S['verdicts']['P1']['meeting'] == 2
      and [round(m(c)['pathway_gap'], 3) for c in ('loio:Guyane', 'loio:Réunion', 'loio:Mayotte', 'default')] == [0.089, 0.198, 0.005, 0.009]
      and [round(m(c)['oracle']['main_producer_accuracy'], 3) for c in ('loio:Guyane', 'loio:Réunion')] == [0.071, 0.097]
      and [round(m(c)['uncorrected']['main_producer_accuracy'], 3) for c in ('loio:Guyane', 'loio:Réunion')] == [0.007, 0.013]
      and m('loio:Mayotte')['oracle']['main_producer_accuracy'] == 0.0 and round(1 - m('loio:Mayotte')['pi_t'][0], 4) == 0.0061
      and all(abs(m(c)['pathway_gap'] - C['maps'][c.replace(':', '_')]['v1.3']['oracle']['gap_tv_mean_posterior_to_pi_t']) < 1e-9 for c in S['maps'])
      and all(v['window_class_agreement'] == 1.0 for v in S['reproduction'].values()) and len(S['reproduction']) == 18
    )(lambda c: S['maps'][c]['oe13']))(A['exp/out/exp114_summary.json'], A['exp/out/exp114_crosscheck.json'])
  cited_in:
