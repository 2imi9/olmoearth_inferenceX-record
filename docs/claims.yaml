      and [round(m('loio:' + t)['iou_per_class'][4], 2) for t in ('Guadeloupe', 'Martinique')] == [0.71, 0.72]
      and [round(m('loio:' + t)['iou_per_class'][5], 2) for t in ('Guadeloupe', 'Martinique')] == [0.49, 0.5]
