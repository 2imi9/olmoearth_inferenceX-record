- id: exp115-flag-on-near-right-classes
  statement: "In exp115, preregistered P4, that 400 labels flag at most 10% of the time a class drawn within 0.02 of its true share, does not hold: 69 of 164 such classes are flagged more often. Read after the run, 62 of the 69 are rare classes drawn at less than half or more than twice their share (86 such classes qualify); of the 59 drawn within 0.8 to 1.25 of their share, 3 are flagged above 0.10, all Mayotte's Background, drawn at 99.9% to 100% against 99.5%. The flag's power follows the gap measured in sampling errors, so, as the page set for this failure, it is not to be printed without its interval."
