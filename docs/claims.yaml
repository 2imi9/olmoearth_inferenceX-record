- id: tool-vs-diff-resolution
  statement: "Believing the side with the larger margin is right on more disagreement windows than a coin flip on every pair (51-70% pooled; one-sided per-tile sign tests p <= 0.03 on all 15), but the preregistered 55% is missed on the Bolivia crop offsets (51%) and three encoders (Galileo, TerraMind and AnySat, 54-55%), and wherever one side is known to be better the rule falls short of always choosing it (the S2 head is right on 84% of the test-split disagreements against the rule's 70%; the fine-tuned model on 75% / 72% (Bolivia / test) against 61% / 55%); P1 fails."
  status: mixed
  experiments: [exp58]
  artifacts: [exp/out/exp58_summary.json]
  check: |-
    (lambda s, d, r:
