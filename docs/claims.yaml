      and all(r['arms']['D1/E3d']['half_width'] <= r['arms']['D1/E1w']['half_width'] for r in seg.values())
    )({t: r for t, r in A['exp/out/exp85_summary.json']['tasks'].items() if r['family'].startswith('seg')})
  cited_in:
    - {file: docs/results/comparisons.md, marker: model-assisted-coefficient-is-one}

- id: trust-zone-guarantee-holds-on-other-encoders
  statement: "On the seed-0 exports of Clay Large (24 tasks), Copernicus-FM (21), AnySat (24) and CROMA Base (21) the certified zone exceeded alpha on at most 0.075, 0.082, 0.061 and 0.079 of draws for the prefix rule and at most 0.005 for Bonferroni on every cell (bound 0.120); at 300 labels and alpha = half the error rate the prefix rule certified a zone on most draws on 10 of 21, 12 of 19, 15 of 21 and 9 of 19 tasks, median coverages 0.25, 0.45, 0.25 and 0.50 against oracle medians 0.40, 0.50, 0.40 and 0.50."
  crosscheck: tests/test_trust_zone.py::test_both_rules_hold_delta_on_every_error_pattern_of_a_small_map
  status: measured
  experiments: [exp80]
  artifacts: [exp/out/exp80_zones/clay_large.json, exp/out/exp80_zones/copernicusfm.json, exp/out/exp80_zones/anysat.json, exp/out/exp80_zones/croma_base.json]
  check: |-
    (lambda D: (lambda cells, want:
      all(max(c['rules']['prefix']['violation_rate'] for c in cells[e]) <= 0.1201 and max(c['rules']['bonferroni']['violation_rate'] for c in cells[e]) <= 0.1201 for e in cells)
      and all(round(max(c['rules']['prefix']['violation_rate'] for c in cells[e]), 3) == want[e][0] for e in cells)
      and all(round(max(c['rules']['bonferroni']['violation_rate'] for c in cells[e]), 3) <= 0.005 for e in cells)
      and all((D[e]['prereg']['descriptive']['half_theta/B300']['prefix']['tasks_with_a_zone_on_most_draws'], D[e]['prereg']['descriptive']['half_theta/B300']['n_tasks']) == want[e][1] for e in cells)
      and all(D[e]['prereg']['descriptive']['half_theta/B300']['prefix']['median_of_median_coverage'] == want[e][2] and D[e]['prereg']['descriptive']['half_theta/B300']['oracle_median'] == want[e][3] for e in cells)
    )({e: [c for r in D[e]['tasks'].values() for c in r['cells'] if c['monotone'] is not None] for e in D},
      {'clay_large': (0.075, (10, 21), 0.25, 0.4), 'copernicusfm': (0.082, (12, 19), 0.45, 0.5), 'anysat': (0.061, (15, 21), 0.25, 0.4), 'croma_base': (0.079, (9, 19), 0.5, 0.5)})
    )({e: A[f'exp/out/exp80_zones/{e}.json'] for e in ('clay_large', 'copernicusfm', 'anysat', 'croma_base')})
  cited_in:
    - {file: docs/results/comparisons.md, marker: trust-zone-guarantee-holds-on-other-encoders}
  note: >-
    Descriptive: the same code and draws as the graded Base run on each encoder's seed-0 export; the maxima and
    counts are recomputed from the per-cell rows. Extended as further exports land.

- id: cue-verification-holds-on-other-encoders
  statement: "On the seed-0 exports of Clay Large, Copernicus-FM, AnySat and CROMA Base the boundary cue's enrichment runs from 1.26, 1.30, 0.99 and 1.31 (m-cashew-plant) to 8.9, 10.0, 4.1 and 9.7 (MADOS); the library value 3.5 lies outside the tile-clustered interval on 7 of 7 tasks for three encoders and 6 of 7 for AnySat (inside on its MADOS, 2.80 to 6.31); the conjunction of the two cues is purer than either on 7 of 7 for three and 6 of 7 for AnySat; the low-confidence cue's share among errors equals exp74's recorded capture at 20% within 2e-3 on every task; and the seven tasks rank identically by enrichment under all five encoders, the three PASTIS arms taken as one. AnySat's cashew and SA-crop-type exports carry 16 x 16 windows per tile against 64 x 64 for the others; on its cashew map 0.966 of windows sit on a boundary, the enrichment's interval reaches 1.00, and the error rate inside the boundary set is 0.81 times the rate outside, while on every other cell of the four encoders it is at least 1.81 times."
  crosscheck: tests/test_exp82.py::test_the_tile_count_bootstrap_matches_the_window_bootstrap_on_mados
  status: measured
  experiments: [exp82]
  artifacts: [exp/out/exp82_cues/clay_large.json, exp/out/exp82_cues/copernicusfm.json, exp/out/exp82_cues/anysat.json, exp/out/exp82_cues/croma_base.json, exp/out/exp82_summary.json, exp/out/exp74_summary.json]
  check: |-
    (lambda D, B, R: (lambda enr, L, rr, outside, purer:
      all(len(d['tasks']) == 7 for d in D.values())
      and [round(min(enr[e].values()), 2) for e in D] == [1.26, 1.30, 0.99, 1.31]
      and [round(max(enr[e].values()), 1) for e in D] == [8.9, 10.0, 4.1, 9.7]
      and [outside[e] for e in D] == [7, 7, 6, 7] and D['anysat']['tasks']['mados']['cues']['boundary']['boot_lo'] <= L <= D['anysat']['tasks']['mados']['cues']['boundary']['boot_hi']
      and round(D['anysat']['tasks']['mados']['cues']['boundary']['boot_lo'], 2) == 2.80 and round(D['anysat']['tasks']['mados']['cues']['boundary']['boot_hi'], 2) == 6.31
      and [purer[e] for e in D] == [7, 7, 6, 7] and not (D['anysat']['tasks']['m_cashew_plant']['cues']['boundary_and_low_confidence']['precision'] > D['anysat']['tasks']['m_cashew_plant']['cues']['low_confidence']['precision'])
      and all(abs(v['cues']['low_confidence']['share_errors'] - R[e][t]['signals']['margin']['capture']['0.2']) <= 2e-3 for e, d in D.items() for t, v in d['tasks'].items())
      and all((lambda o: [o[0], o[4], o[5], o[6]] == ['m_cashew_plant', 'm_sa_crop_type', 'sen1floods11', 'mados']
                       and set(o[1:4]) == {'pastis_sentinel1', 'pastis_sentinel2', 'pastis_sentinel1_sentinel2'})(sorted(enr[e], key=enr[e].get)) for e in enr)
      and D['anysat']['tasks']['m_cashew_plant']['n_units'] == 12800 and D['anysat']['tasks']['m_sa_crop_type']['n_units'] == 256000
      and all(D[e]['tasks']['m_cashew_plant']['n_units'] == 204800 for e in ('clay_large', 'copernicusfm', 'croma_base'))
      and round(D['anysat']['tasks']['m_cashew_plant']['cues']['boundary']['n_with_cue'] / D['anysat']['tasks']['m_cashew_plant']['n_units'], 3) == 0.966
      and round(D['anysat']['tasks']['m_cashew_plant']['cues']['boundary']['boot_hi'], 2) == 1.00
      and round(rr['anysat']['m_cashew_plant'], 2) == 0.81
      and round(min(v for e in rr for t, v in rr[e].items() if not (e == 'anysat' and t == 'm_cashew_plant')), 2) == 1.81
    )({e: {t: v['cues']['boundary']['enrichment'] for t, v in d['tasks'].items()} for e, d in list(D.items()) + [('base', B)]}, 0.750 / 0.214,
      {e: {t: (lambda b: b['precision'] / ((b['n_errors'] - b['precision'] * b['n_with_cue']) / (b['n'] - b['n_with_cue'])))(v['cues']['boundary']) for t, v in d['tasks'].items()} for e, d in D.items()},
      {e: sum(not (v['cues']['boundary']['boot_lo'] <= 0.750 / 0.214 <= v['cues']['boundary']['boot_hi']) for v in d['tasks'].values()) for e, d in D.items()},
      {e: sum(v['cues']['boundary_and_low_confidence']['precision'] > max(v['cues']['boundary']['precision'], v['cues']['low_confidence']['precision']) for v in d['tasks'].values()) for e, d in D.items()})
    )({e: A[f'exp/out/exp82_cues/{e}.json'] for e in ('clay_large', 'copernicusfm', 'anysat', 'croma_base')}, A['exp/out/exp82_summary.json'], A['exp/out/exp74_summary.json']['results']['tasks'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: cue-verification-holds-on-other-encoders}
  note: >-
    Descriptive, the same code as the graded Base run on each encoder's seed-0 export; extended as further exports
    land. The window grid is the export's, so AnySat's coarser grid on the two m-* tasks is a property of its probe's
    patch geometry, not of the map's content.

- id: per-class-intervals-hold-on-other-encoders
  statement: "On the classification tasks of Clay Large (17 tasks, 323 graded cells), Copernicus-FM (14, 274), AnySat (17, 323) and CROMA Base (14, 276), with the random-design user's accuracy the exact hypergeometric interval, no such cell covers below 0.943 (lowest 0.952, 0.949, 0.943, 0.952); the shipped forms fail 11, 15, 8 and 12 cells, the lowest coverage 0.858, none of them a random-design user's accuracy, one of them (a Copernicus-FM BreizhCrops producer's accuracy at coverage 0.946) on the 2% bias clause alone; the Wald form fails 39 of 268, 62 of 229, 30 of 269 and 53 of 228 cells (worst 0.152, 0.316, 0.333, 0.293); the confidence design widens the per-class user's-accuracy interval on 3 of 14, 3 of 12, 3 of 14 and 2 of 12 tasks; the adjusted share's exclusion rates fail no cell of the 128 classes with at least 30 expected reference labels (34, 31, 33 and 30)."
  crosscheck: tests/test_estimate.py::test_the_exact_interval_is_the_tail_inversion_and_covers_at_least_nominal_by_enumeration
  status: measured
  experiments: [exp81]
  artifacts: [exp/out/exp81_per_class/clay_large.json, exp/out/exp81_per_class/copernicusfm.json, exp/out/exp81_per_class/anysat.json, exp/out/exp81_per_class/croma_base.json]
  check: |-
    (lambda D: (lambda P, W, P2, P3, UA:
      [len(D[e]['tasks']) for e in D] == [17, 14, 17, 14] and [P[e]['n_cells'] for e in D] == [323, 274, 323, 276]
      and [len(P[e]['failing']) for e in D] == [11, 15, 8, 12] and round(min(f['coverage'] for e in D for f in P[e]['failing']), 3) == 0.858
      and [sum(f['coverage'] >= 0.93 for f in P[e]['failing']) for e in D] == [0, 1, 0, 0]
      and not any(f['design'] == 'random' and f['quantity'] == 'user_accuracy' for e in D for f in P[e]['failing'])
      and [round(UA[e], 3) for e in D] == [0.952, 0.949, 0.943, 0.952]
      and [W[e]['n_cells'] for e in D] == [268, 229, 269, 228] and [W[e]['n_failing'] for e in D] == [39, 62, 30, 53]
      and [round(W[e]['min_coverage'], 3) for e in D] == [0.152, 0.316, 0.333, 0.293]
      and [(P2[e]['n_tasks_wider'], P2[e]['of']) for e in D] == [(3, 14), (3, 12), (3, 14), (2, 12)]
      and [P3[e]['n_cells'] for e in D] == [34, 31, 33, 30] and all(P3[e]['failing'] == [] and P3[e]['holds'] for e in D)
    )({e: D[e]['prereg']['P1_every_reported_interval_is_honest'] for e in D}, {e: D[e]['prereg']['P1_under_the_wald_form'] for e in D},
      {e: D[e]['prereg']['P2_the_overall_design_widens_the_classes'] for e in D}, {e: D[e]['prereg']['P3_the_adjusted_share_moves_where_it_should'] for e in D},
      {e: min(pc['user_accuracy']['coverage'] for row in D[e]['tasks'].values() for c in row['cells'] if c['design'] == 'random' and c['interval'] == 'wilson'
              for pc in c['per_class'].values() if pc['user_accuracy']['coverage'] is not None and pc['user_accuracy']['eligible_share'] >= 0.5) for e in D})
    )({e: A[f'exp/out/exp81_per_class/{e}.json'] for e in ('clay_large', 'copernicusfm', 'anysat', 'croma_base')})
  cited_in:
    - {file: docs/results/comparisons.md, marker: per-class-intervals-hold-on-other-encoders}
  note: >-
    Descriptive, the same code and seeds as the graded Base run on each encoder's seed-0 export; the random-design
    cells were rerun on 23 September under the sixth amendment (`--designs random --merge`), the confidence-design
    cells carried over unchanged. Under the grading that took every class, one CROMA Base cell with fewer than 30
    expected reference labels (So2Sat class 7) sat at 0.755 against 0.80.

- id: boundary-cue-weakens-with-the-window-grain
  statement: "On OlmoEarth Base's export coarsened to 2 x 2 and 4 x 4 blocks (majority decision and reference per block, the tool's boundary indicator on the coarse grid) the boundary cue's enrichment and risk ratio fall on all seven segmentation tasks at both steps (cashew 1.24, 1.08, 1.04 and 2.14, 1.50, 1.30) and the prevalence rises on six of seven; at 4 x 4 the cashew map has 0.896 of its windows on a boundary; across the 21 (task, grain) cells the enrichment's rank correlation with the prevalence ceiling is 0.987; the addendum's G1 and G3 bars fail (0.896 against 0.90; a risk ratio of 1.2999 against 1.3) and G2 holds."
  crosscheck: tests/test_exp82.py::test_coarsening_is_majority_pooling_by_brute_force
  status: measured
  experiments: [exp82]
  artifacts: [exp/out/exp82_grain.json, exp/out/exp82_summary.json, exp/out/exp82_cues/olmoearth_base_x2.json, exp/out/exp82_cues/olmoearth_base_x4.json]
  check: |-
    (lambda G, B, X2, X4: (lambda enr, rr, prev:
      len(enr) == 7 and all(enr[t][0] > enr[t][1] > enr[t][2] for t in enr) and all(rr[t][0] > rr[t][1] > rr[t][2] for t in rr)
      and [round(v, 2) for v in enr['m_cashew_plant']] == [1.24, 1.08, 1.04] and [round(v, 2) for v in rr['m_cashew_plant']] == [2.14, 1.50, 1.30]
      and sum(prev[t][0] < prev[t][1] < prev[t][2] for t in prev) == 6 and round(prev['m_cashew_plant'][2], 3) == 0.896
      and round(G['verdicts']['G2_ceiling_governs_across_grains']['spearman'], 3) == 0.987 and G['verdicts']['G2_ceiling_governs_across_grains']['n_cells'] == 21
      and G['verdicts']['G1_saturation_is_the_grains']['holds'] is False and G['verdicts']['G3_saturation_threshold']['holds'] is False and G['verdicts']['G2_ceiling_governs_across_grains']['holds'] is True
      and round(G['verdicts']['G3_saturation_threshold']['unsaturated_at_or_below_1.3']['m_cashew_plant@x4'], 4) == 1.2999 and G['verdicts']['G3_saturation_threshold']['saturated_cells'] == {}
    )({t: [d['tasks'][t]['cues']['boundary']['enrichment'] for d in (B, X2, X4)] for t in B['tasks']},
      {t: [(lambda b: b['precision'] / ((b['n_errors'] - b['precision'] * b['n_with_cue']) / (b['n'] - b['n_with_cue'])))(d['tasks'][t]['cues']['boundary']) for d in (B, X2, X4)] for t in B['tasks']},
      {t: [d['tasks'][t]['cues']['boundary']['n_with_cue'] / d['tasks'][t]['n_units'] for d in (B, X2, X4)] for t in B['tasks']})
    )(A['exp/out/exp82_grain.json'], A['exp/out/exp82_summary.json'], A['exp/out/exp82_cues/olmoearth_base_x2.json'], A['exp/out/exp82_cues/olmoearth_base_x4.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: boundary-cue-weakens-with-the-window-grain}
    - {file: docs/Findings.md, marker: boundary-cue-weakens-with-the-window-grain}
  note: >-
    The coarse grid's confidence is the mean fine margin, a proxy used only for the low-confidence cue, which this
    claim does not read. The monotone statement is the recordable one; the bars are recorded as they fell.

- id: rare-error-warning-marks-the-misses
  statement: "On the nine rare-error cells of exp81's OlmoEarth Base record, the 'few errors' warning (a per-class interval resting on one to four sampled errors of the kind it counts) fires on 1,081 of the 1,351 draws whose interval misses the truth (0.800 against a preregistered 0.80), on 796 of 800 on EuroSAT and MADOS and 285 of 551 on Brick Kiln and Nandi Landsat; the draws it does not warn cover at least 0.943; across 85,281 graded (draw, class, quantity) cells of the seventeen classification tasks at 300 labels it fires on 11.1%."
  crosscheck: tests/test_per_class.py::test_the_few_errors_warning_fires_on_one_to_four_sampled_errors_and_not_on_zero_or_five
  status: measured
  experiments: [exp81]
  artifacts: [exp/out/exp81_rare_error_warning.json]
  check: |-
    (lambda d: (lambda V, cells: (lambda em, bn:
      V['a_warning_marks_the_misses']['holds'] is True and V['a_warning_marks_the_misses']['misses'] == 1351 and V['a_warning_marks_the_misses']['misses_warned'] == 1081
      and round(V['a_warning_marks_the_misses']['share'], 3) == 0.800
      and (sum(v['misses_warned'] for v in em), sum(v['misses'] for v in em)) == (796, 800)
      and (sum(v['misses_warned'] for v in bn), sum(v['misses'] for v in bn)) == (285, 551)
      and round(V['b_unwarned_draws_cover']['min_coverage_unwarned'], 3) == 0.943
      and V['c_warning_is_not_everywhere']['n_graded'] == 85281 and round(V['c_warning_is_not_everywhere']['share_warned'], 3) == 0.111
      and len(cells) == 9
    )([v for k, v in cells.items() if k.startswith(('m_eurosat', 'mados'))], [v for k, v in cells.items() if k.startswith(('m_brick_kiln', 'nandi_landsat'))])
    )(d['verdicts'], d['cells']))(A['exp/out/exp81_rare_error_warning.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: rare-error-warning-marks-the-misses}
  note: >-
    Preregistered in docs/plan/per_class_assessment.md, seventh amendment; (a) holds at its bar, not with room. The
    warning explains EuroSAT's and MADOS's shortfalls almost wholly and Brick Kiln's and Nandi Landsat's about
    half; their unwarned draws still cover 0.943 to 0.966.


- id: exp79-gate-fails-on-five-encoders-on-segmentation
  statement: "At seed 0, eleven of exp79's sixteen exports reproduce every test accuracy the record holds (largest difference below 1e-10) and five miss the 1e-4 gate, on segmentation tasks only: CopernicusFM (PASTIS S1), CROMA Base (m-cashew-plant, PASTIS S1), CROMA Large (m-cashew-plant, PASTIS S1, PASTIS S1+S2), TerraMind Base (PASTIS S1, PASTIS S1+S2) and TerraMind Large (PASTIS S1+S2), by 1.2e-4 to 5.4e-4, a net 53 to 192 errors on tasks of 204,800 and 458,638 windows; on those nine cells the margin's smallest lead at any seed is +0.075."
  crosscheck: tests/test_known_answer.py::test_exp79_all_sixteen_gate_p1_and_p3_recompute_by_a_second_route
  status: measured
  experiments: [exp79]
  artifacts: [exp/out/exp79_seeds/anysat.json, exp/out/exp79_seeds/clay_large.json, exp/out/exp79_seeds/copernicusfm.json, exp/out/exp79_seeds/croma_base.json, exp/out/exp79_seeds/croma_large.json, exp/out/exp79_seeds/galileo_base.json, exp/out/exp79_seeds/galileo_nano.json, exp/out/exp79_seeds/galileo_tiny.json, exp/out/exp79_seeds/olmoearth_base.json, exp/out/exp79_seeds/olmoearth_large.json, exp/out/exp79_seeds/olmoearth_nano.json, exp/out/exp79_seeds/olmoearth_tiny.json, exp/out/exp79_seeds/panopticon.json, exp/out/exp79_seeds/satlas_base.json, exp/out/exp79_seeds/terramind_base.json, exp/out/exp79_seeds/terramind_large.json, exp/out/exp74_summary.json, exp/out/exp70_summary.json]
  check: |-
