  statement: "On the same forty cards and five arms with Qwen/Qwen2.5-7B-Instruct, all three preregistered tests hold: the tool arm grounds 100.0% of its numbers against the sandbox's 0.1% (40 cards to 0), captures 0.997 of the package's errors against 0.144 (39 to 0) and declines the side question on 10 of 10 comparison cards against 0; the sandbox produced no gradeable answer in 51 of 120 runs and left 53.3% of comparison questions unanswered, and the no-raster arm fabricated 372 windows and left every comparison question unanswered. Beside the 27B run, where P1 and P2 failed, at 7B the package separates the arms on all three measures, grounding, capture and the decline. At 27B it is not the decline: the no-raster arm, with no package and no data, declined on every comparison run too."
