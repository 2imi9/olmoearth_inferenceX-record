- id: exp115-flag-and-bound-show-a-collapsed-class
  statement: "In exp115, of the 17 classes with a true share of at least 5% that the map draws at half of it or less, 400 random labels flag 16 as drawn too little with probability at least 0.8 (P3 does not hold as written: the miss, a 6.1% class drawn at 3.0%, is flagged with probability 0.644), and of the 10 classes with a share of at least 5% and producer's accuracy at most 0.10, they bound 9 at or below 0.25 with probability at least 0.8 (P5 does not hold as written: the miss is at 0.684). On exp113's v1.3 maps, Guyane's Meadow (drawn on 0.1% against 14.3%) and Réunion's Sugarcane (0.1% against 16.0%) are flagged with probability 1.000; rarer collapsed crops less often (Mayotte's, 0.5% of its windows together, at most 0.716). Over every class, of 84 drawn at half their share or less with a share under 5%, 15 are flagged with probability at least 0.8."
  crosscheck: tests/test_exp115.py::test_exp115_recorded_by_a_second_route
  status: rejected
