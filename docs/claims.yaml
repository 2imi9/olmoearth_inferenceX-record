      and round(max(c[2]['design_effect'] for c in cells if c[1] == 'm_cashew_plant'), 2) == 1.28
      and round(min(median([r['design_effect'] for r in rows.values()]) for rows in P.values()), 2) == 2.94
      and round(max(median([r['design_effect'] for r in rows.values()]) for rows in P.values()), 2) == 3.71
      and min(c[2]['srs_coverage'] for c in cells) == 0.933 and max(c[2]['srs_coverage'] for c in cells) == 0.963
