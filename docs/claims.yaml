- id: exp103-v12-transfer-ranking-misses-under-strict
  statement: "exp99's frozen rules give the same verdicts for the v1.2 fine-tune: at the 271 TimeSync plots with 2017 input the design-weighted AUROC for the STRICT errors is 0.642 (90% bootstrap 0.582 to 0.703; bar 0.70), so P1 does not hold, and the least confident 10% close 0.267 of the gap (0.017 to 0.497; bar 0.25), so P2 holds on the point value, as for v1 (0.638, 0.434). Under LENIENT the AUROC is 0.730 (0.670 to 0.791), which meets the bar on the point value, so the frozen rule labels the failure STRICT's only, where v1's (0.678) was labelled both rules failing; like v1's, the interval contains 0.70, so the different label is the rule's, not a difference between the models. The error rate is 37.0% under STRICT (exact interval 27.3% to 47.3%) and 16.6% under LENIENT (9.8% to 25.5%); P3's call is not determined."
