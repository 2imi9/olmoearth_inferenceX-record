      and round(s['part_b']['pooled_capture_expected']['tile-phase (aligned)']['0.2'], 3) == 0.707 and round(s['part_b']['pooled_capture_expected']['confidence (baseline)']['0.2'], 3) == 0.749
      and s['part_b']['bootstrap_pooled_gain_vs_confidence']['boundary indicator']['0.05']['lo'] > 0 and s['part_b']['bootstrap_pooled_gain_vs_confidence']['boundary indicator']['0.2']['hi'] < 0
      and (s['part_b']['per_tile_tests_vs_confidence']['boundary indicator']['0.05']['w'], s['part_b']['per_tile_tests_vs_confidence']['boundary indicator']['0.05']['l'], s['part_b']['per_tile_tests_vs_confidence']['boundary indicator']['0.05']['t']) == (181, 147, 23)
      and round(s['part_b']['pooled_capture_expected']['control NDWI level']['0.2'], 3) == 0.795
      and round(s['part_awf']['crops']['16']['bootstrap_vs_confidence']['tile-phase (aligned)']['0.2']['gain'], 3) == 0.073 and s['part_awf']['crops']['16']['bootstrap_vs_confidence']['tile-phase (aligned)']['0.2']['lo'] <= 0
      and all(s['part_a']['tests_vs_confidence']['tile-phase (aligned)'][b]['river']['w'] == 8 for b in ('0.1', '0.2'))
