- id: exp111-v12-strict-only-errors-rank-just-above-the-bar
  statement: "In exp111's blind test (preregistered, graded for the v1.2 fine-tune), the confidence ranks v1.2's STRICT-only errors against the STRICT-correct fresh plots at a standardised AUROC of 0.656 (90% bootstrap 0.617 to 0.693) and its LENIENT errors at 0.778 (0.746 to 0.808), a gap of 0.122 (0.083 to 0.162). Two of P2(b)'s three arms hold, but the STRICT-only AUROC exceeds the bar of at most 0.65 by 0.006, with an interval on both sides of it, so preregistered P2(b), and with it P2, does not hold. The STRICT-only errors still rank well below the LENIENT ones and below every product confidence the record graded (0.720 to 0.787), but less near chance than at the 271 seen plots (0.561). The floor of 30 STRICT-only errors counted all of them (190); counted among the confident only (22) it would have left v1.2's P2 without a verdict. v1, report-only: STRICT-only 0.646, LENIENT 0.780, gap 0.135, so P2 holds for v1 as standardised, but region-weighted (0.665) or unweighted (0.653) its STRICT-only arm would fail."
  crosscheck: tests/test_exp111.py::test_exp111_recorded_by_a_second_route
