    - {file: docs/Findings.md, marker: exp111-v12-twenty-label-audit-does-not-reliably-flag-the-pair}
  note: >-
    P(note) is the audit's operating characteristic computed from the zone's estimated rates (the binomial limit of the
    package's interval), not twenty labels drawn from the map's pixels. The literal draw is report-only, unweighted
    (Open Grassland over-represented) and one draw. On grassland_barren the package's note text appears in the literal
    run under the extended-code reading although note_fires is false; the record quotes note_fires.

- id: exp111-v1-does-not-reproduce-exp98-under-rslearn-0117
  statement: "Run with rslearn 0.1.17 (olmoearth-pretrain-minimal 0.1.2, torch 2.14.1) on an NVIDIA B200, the GPU model of exp98's run, Ai2's FT-AWF v1 checkpoint does not reproduce exp98's deployment (rslearn 0.0.27, olmoearth_pretrain 0.0.2, torch 2.7.1) at Ai2's 259 validation points: 245 of 259 points the same class (14, 5.4%, change class; exp111's gate needed 98%), 39 with |p1 - exp98's p1| above 0.05 (5 allowed) and a Spearman correlation of the suspicion of 0.916, identically in three jobs (the failed gate 1365118, the passing gate 1369594 and the route diagnostic's formula variant 1369140). v1's own stored temporal table gave 245 (40 above the tolerance), that with the encodings added in float32 245 (40), and without autocast 244 (39), so the table, the encodings' precision and autocast are not the cause, which is not isolated. At exp99's 2017 plots it gave 237 of 263 the same class (89 above, Spearman 0.840, 76 of 91 confident plots kept). v1.2 on the same route reproduced exp103 at 259 of 259 and 262 of 263. So the owner made v1.2 exp111's graded model (16 October 2026, after gate A and before any blind prediction), and v1's blind verdicts are report-only."
