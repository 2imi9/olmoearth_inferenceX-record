      and C['arm4']['loio:Guyane']['v1.3~tessera_v2']['better_agreeing'] == 'B'
      and max(gap(W[t][k]) for t in ('Guyane', 'Mayotte') for k in W[t]) < 0.001 and round(gap(W['Réunion']['oe13_vs_tessera2']), 4) == 0.0012
      and [round(gap(W[t][k]), 3) for t in ('Guadeloupe', 'Martinique') for k in W[t]] == [0.01, 0.019, 0.009, 0.004, 0.012, 0.008]
      and [round(gap(W['Réunion'][k]), 3) for k in ('oe13_vs_aef', 'tessera2_vs_aef')] == [0.107, 0.106]
      and [round(W[t][k]['n']['400']['p_names_better'], 2) for t in ('Guyane',) for k in W[t]] + [round(W['Réunion']['oe13_vs_tessera2']['n']['400']['p_names_better'], 2)] == [0.16, 0.04, 0.15, 0.12]
      and min(W[t][k]['n']['400']['p_names_better'] for t in ('Guadeloupe', 'Martinique') for k in W[t]) > 0.649
      and [W['Mayotte'][k]['D'] for k in W['Mayotte']] == [40, 89, 120]
      and [round(sum(S['maps']['loio:' + t][e]['miou'] for t in T) / 5, 3) for e in ('oe13', 'tessera2', 'aef')] == [0.2, 0.185, 0.168]
    )(S['which_map'], lambda v: abs(v['acc_A'] - v['acc_B']), ('Guadeloupe', 'Martinique', 'Guyane', 'Réunion', 'Mayotte')))(A['exp/out/exp113_summary.json'], A['exp/out/exp113_crosscheck.json'])
