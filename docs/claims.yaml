      and round(s['results']['v1_2']['test']['tile_level']['averaged confidence']['aurc'], 3) == 0.134 and round(s['results']['v1_2']['test']['tile_level']['tile-fitted fusion (labelled)']['aurc'], 3) == 0.086
      and s['results']['v1_2']['bolivia']['tile_level']['tile-fitted fusion (labelled)']['diff_ci95'][0] < 0 < s['results']['v1_2']['bolivia']['tile_level']['tile-fitted fusion (labelled)']['diff_ci95'][1]
      and s['results']['v1']['bolivia']['tile_level']['tile-fitted fusion (labelled)']['diff_ci95'][1] > 0
