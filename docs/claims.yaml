- id: exp111-v12-grass-shrub-pair-is-most-confident-strict-errors
  statement: "In exp111's blind test (preregistered, graded for the v1.2 fine-tune), the contested legend pair exp109 found at the 271 seen plots, the map's shrubland_savanna where TimeSync says Open Grassland, is again most of the confident STRICT errors at 890 fresh plots: 13 of v1.2's 25 (p1 at or above exp109's cut; 25 is exactly the preregistered floor), a share of 0.611 standardised to the 271's label mix (90% bootstrap 0.438 to 0.768, crossing 0.50), so preregistered P2(a), at least 0.50, holds. 22 of the 25 are STRICT-only (0.881 standardised); the reverse pair, grassland_barren on Wooded Grassland, holds 0.114. The share depends on the weighting: region-weighted it is 0.334, and the class holding the most region-weighted confident STRICT-only errors is montane_forest (0.469), while standardised or unweighted it is shrubland_savanna. v1, report-only: 20 of 40, 0.534 (0.394 to 0.666)."
  crosscheck: tests/test_exp111.py::test_exp111_recorded_by_a_second_route
  status: supported
  experiments: [exp111]
  artifacts: [exp/out/exp111_summary.json, exp/out/exp111_crosscheck.json]
