- id: calibrate-family-lock
  statement: "The side rule fitted on the pooled frozen pairs' training windows, forced onto the frozen-vs-fine-tuned pair, is right on 43.8% and 49.2% of its differing windows, below the raw margin rule (61.1% and 55.4%) and far below the pair's own cross-fit (74.9% and 72.8%), and the module raises before scoring another family unless forced; preregistered P3 holds."
