- id: exp105-confidence-design-narrower-than-map-class-strata
  statement: "On the 18 tasks of exp78's export gradable at 300 labels (12 label sets; OlmoEarth Base linear probes on benchmark test splits, every window labelled), the shipped confidence design gives an interval for the map's overall window error rate that covers at least 0.93 and is no wider than map-class strata with proportional allocation (Olofsson's stratified estimator; the map-class allocation most favourable to the overall rate) on 14 of the 18 (bar 14), at a coverage-first median half-width ratio of 0.853 (bar 0.90): P1 holds, at its bar. Both designs cover on every task (0.940 to 0.957 and 0.946 to 0.959), so width decided each comparison: the confidence design is narrower by 10% or more on 11, and wider by 1.5% to 2.6% on the four that map-class strata win (CropHarvest China 6 and its S1+S2 input, So2Sat, Nandi Sentinel-1)."
  crosscheck: tests/test_exp105.py::test_exp105_recorded_by_a_second_route
  status: supported
  experiments: [exp105]
  artifacts: [exp/out/exp105_summary.json]
  check: |-
    (lambda S: (lambda V, T: S['prereg_status'] == 'frozen' and S['dirty'] is False and S['commit'].startswith('76b7a3c')
      and V['n_gradable'] == 18 and V['P1']['holds'] is True and (V['P1']['wins'], V['P1']['of']) == (14, 18)
      and round(V['P1']['median_half_width_ratio'], 3) == 0.853
      and sorted(set(V['gradable_tasks']) - set(V['P1']['won'])) == ['cropharvest_Peoples_Republic_of_China_6',
          'cropharvest_Peoples_Republic_of_China_6_sentinel1_sentinel2', 'm_so2sat', 'nandi_sentinel1']
      and min(T[t]['budgets']['300']['arms']['B']['coverage'] for t in V['gradable_tasks']) >= 0.939
      and min(T[t]['budgets']['300']['arms']['C']['coverage'] for t in V['gradable_tasks']) >= 0.946
      and sum(T[t]['budgets']['300']['arms']['B']['half_width'] <= 0.9 * T[t]['budgets']['300']['arms']['C']['half_width']
              for t in V['gradable_tasks']) == 11
    )(S['verdicts'], S['tasks']))(A['exp/out/exp105_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: exp105-confidence-design-narrower-than-map-class-strata}
    - {file: docs/Findings.md, marker: exp105-confidence-design-narrower-than-map-class-strata}
    - {file: docs/Summary.md, marker: exp105-confidence-design-narrower-than-map-class-strata}
  note: >-
    Run once at the frozen 76b7a3c (job 1287676), 2,000 draws, seed 105; recorded after an independent audit that
    reproduced every cell by its own sampler and at 10^6 count-level draws. The count turns on the coverage rule at
    m-brick-kiln (error rate 0.036), where the confidence design covers 0.941 in this run, 0.9325 in exp81 and about
    0.934 pooled over 30 reruns at other seeds made by the audit: 7 of those 30 gave 13 wins (P1 would fail), while
    the widths and the median ratio (0.851 to 0.877) did not move. The verdict is the frozen rule's on the seed-105 run.

- id: exp105-the-gain-is-from-the-strata
  statement: "Against map-class strata given the confidence design's own allocation rule (Neyman from the model's confidence, floored at 0.02), the confidence design wins on 16 of the 18 tasks gradable at 300 labels (bar 12), at a median half-width ratio of 0.863: P2 holds, so the narrowing comes from stratifying by confidence rather than from the allocation. On map-class strata the confidence allocation changes the half-width by under 1% on 12 of the 18 tasks, narrows it by 9% on MADOS and widens it on the three CropHarvest China 6 tasks (by up to 9%); map-class strata win against the confidence design on 4 of the 18 and with its allocation on 2, below the page's 10 for any change of recommendation."
  crosscheck: tests/test_exp105.py::test_exp105_recorded_by_a_second_route
  status: supported
  experiments: [exp105]
  artifacts: [exp/out/exp105_summary.json]
