- id: dw-margin-ranks-a-production-model
  statement: "On Dynamic World's 409 expert-annotated test tiles (4,348,526 windows of 4 px), the served product's own margin ranks its own errors better than a control that sees neither the imagery nor the probabilities, only how rare the predicted class is within its tile: pooled excess AURC 0.0637 against 0.1120, a lead of 0.0483, on 315 tiles against 91 (one-sided p = 2.7e-30); the product agrees with the expert consensus on 0.7367 of windows, against the 0.74 its own paper reports, and our pooled decision reproduces its published Top-1 on 0.9899; preregistered P1 holds."
  crosscheck: tests/test_recorded.py::test_exp67_dynamic_world_recomputes_from_the_committed_windows
