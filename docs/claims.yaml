    - {file: docs/results/comparisons.md, marker: operating-points-null}

- id: v12-replication-mixed
  statement: On OlmoEarth v1.2 Base the cue enrichments and the shift-averaged window replicate on both hand-label testbeds, the boundary-first order replicates on Bolivia (pooled 0.461 vs 0.423 at 10%) but not on the test split, and confidence is no longer the best ranker on Bolivia while v1.2 matches v1's accuracy (0.906 and 0.953).
  status: mixed
  experiments: [exp45]
  artifacts: [exp/out/exp45_summary.json]
  check: |-
    (lambda s:
      s['prereg'] == {'R1_best_ranker': False, 'R2_boundary_first': False, 'R3_cue_enrichment': True, 'R4_shift_averaged_window': True, 'complete': True}
      and s['results']['bolivia']['R2_boundary_first']['replicates'] is True and s['results']['test']['R2_boundary_first']['replicates'] is False
      and round(s['results']['bolivia']['R2_boundary_first']['pooled']['0.1']['lex'], 3) == 0.461 and round(s['results']['bolivia']['R2_boundary_first']['pooled']['0.1']['confidence'], 3) == 0.423
      and s['results']['bolivia']['R1_best_ranker']['replicates'] is False and s['results']['test']['R1_best_ranker']['replicates'] is True
      and round(s['results']['bolivia']['head_accuracy'], 3) == 0.906 and round(s['results']['test']['head_accuracy'], 3) == 0.953
      and all(s['results'][n]['R4_shift_averaged_window']['replicates'] and s['results'][n]['R3_cue_enrichment']['replicates'] for n in ('bolivia', 'test'))
      and round(s['results']['bolivia']['R4_shift_averaged_window']['mean_gain'], 4) == 0.0110 and round(s['results']['test']['R4_shift_averaged_window']['mean_gain'], 4) == 0.0096
    )(A['exp/out/exp45_summary.json'])
  cited_in:
