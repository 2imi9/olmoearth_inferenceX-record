  note: >-
    The share is P2(a) as preregistered, standardised to the 271's label mix (O 97, W 129, X 45) so that the pool's
    other mix does not move it; the region-weighted reading is reported beside it. The 25 confident STRICT errors sit at
    the floor; no p1 lies within 2.9e-5 of the cut, so no precision question moves the count. Labels are taken as right:
