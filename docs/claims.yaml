- id: two-view-disagreement-rejected
  statement: A head on an outside representation of the same windows errs where OlmoEarth errs (phi 0.77-0.81 on Sen1Floods11, as its own family does), so two-view disagreement captures 0.242 of the errors at 10% against 0.454 for confidence on Sen1Floods11 and 0.180 against 0.246 on AWF.
  status: rejected
  experiments: [exp41]
  artifacts: [exp/out/exp41_summary.json]
  check: |-
    (lambda f, a:
      f['prereg']['supported_vs_confidence'] is False and a['prereg']['supported_vs_confidence'] is False
      and all(0.765 <= c['phi_test'] <= 0.815 for c in f['error_correlation'].values())
      and f['falsification_correlation']['outside_below_family'] is False
      and round(f['pooled_capture']['weighted disagreement (selected partner)']['0.1'], 3) == 0.242 and round(f['pooled_capture']['confidence (OlmoEarth)']['0.1'], 3) == 0.454
      and round(f['pooled_eaurc']['weighted disagreement (selected partner)'], 3) == 0.067 and f['pooled_eaurc']['confidence (OlmoEarth)'] < 0.022
      and round(a['pooled_capture']['weighted disagreement (selected partner)']['0.1'], 3) == 0.180 and round(a['pooled_capture']['confidence (OlmoEarth)']['0.1'], 3) == 0.246
      and all(0.49 <= c['phi_test'] <= 0.71 for c in a['error_correlation'].values() if c['family'])
    )(A['exp/out/exp41_summary.json']['tasks']['sen1floods11'], A['exp/out/exp41_summary.json']['tasks']['awf_sentinel2'])
  cited_in:
    - {file: docs/TECHNIQUES.md, marker: two-view-disagreement-rejected}
  note: The Sen1Floods11 confidence E-AURC is 0.0215 (the ledger prints 0.022); on AWF the outside models' test-split phi runs 0.32-0.64 over eleven models, not only 0.32-0.48.

