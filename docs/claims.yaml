- id: consensus-hides-less-than-the-shared-share-and-debits-the-best
  statement: "Over the suite's multi-encoder panels (six encoders on MADOS and PASTIS S2, eight on Sen1Floods11), Dawid-Skene run to convergence hides a share of each encoder's errors (its estimate minus its accuracy, over its error rate) that is below the share of those errors a strict majority of the other raters make with it on 13 of 20 raters, by up to 0.45 (TerraMind on MADOS: hidden 0.12, shared 0.57); the preregistered P1 (agreement within 0.10) fails."
