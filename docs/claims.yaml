      s['prereg']['P3'] is False and s['prereg']['P3_detail']['arms_negative'] == 3 and s['prereg']['P3_detail']['arms_positive'] == 0
      and all(g[a]['gap_lc_minus_dfc'] < 0 for a in ('s2', 's1', 's1s2'))
      and all(g[a]['dfc'] < 0 and g[a]['lc'] < g[a]['dfc'] for a in ('s2', 's1', 's1s2'))
