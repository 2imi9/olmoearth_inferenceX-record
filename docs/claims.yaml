- id: exp104-forest-loss-confidence-ranks-the-disagreements
  statement: "At a stratified sample of the 3,954 agriculture and mining alerts MapBiomas Alerta published for the Amazon biome, detected from 1 January to 30 June 2026 and read on 11 October 2026 (agriculture a simple random 300 of 3,565; mining, garimpo and mining, all 389), Ai2's Forest Loss Driver model, run with Ai2's configuration on windows centred on each alert's centroid, disagrees with the analysts' driver crosswalked to its classes at 71 of 689 alerts. The design-weighted AUROC of its confidence for those disagreements is 0.770, at least 0.70: P1 holds on its point value, as frozen; its 90% bootstrap interval, resampling alerts within each stratum, is 0.682 to 0.855 and contains 0.70, so the run does not show the AUROC above the bar. The least confident 10% of the design weight hold 47.5% of the weighted disagreements (10% at random, a ceiling of 91.9%), closing 0.457 of the gap (bar 0.25): P2 holds, its interval (0.339 to 0.644) above the bar. Agriculture carries 0.90 of the weight and ranks at 0.754 on its own, the mining census at 0.943 (post hoc)."
  crosscheck: tests/test_exp104.py::test_exp104_recorded_by_a_second_route
  status: supported
  experiments: [exp104]
  artifacts: [exp/out/exp104_summary.json, exp/out/exp104_posthoc.json]
  check: |-
    (lambda S, H: (lambda P, R, U: S['prereg_status'] == 'frozen' and S['dirty'] is False and S['commit'].startswith('deace9d')
      and (P['P1']['holds'], P['P2']['holds']) == (True, True)
      and [round(P['P1']['value'], 3), round(P['P2']['value'], 3)] == [0.77, 0.457]
      and [round(R['auroc_weighted_bootstrap'][k], 3) for k in ('lo90', 'hi90')] == [0.682, 0.855]
      and R['auroc_weighted_bootstrap']['lo90'] < 0.70 < R['auroc_weighted_bootstrap']['hi90']
      and [round(R['gap_closed_0.1_weighted_bootstrap'][k], 3) for k in ('lo90', 'hi90')] == [0.339, 0.644]
      and (R['n'], R['n_errors']) == (689, 71)
      and [round(R['weighted'][k]['0.1'], 3) for k in ('capture', 'ceiling')] == [0.475, 0.919]
      and [(U[s]['N'], U[s]['with_prediction']) for s in ('agriculture', 'mining')] == [(3565, 300), (389, 389)]
      and [round(H['by_stratum'][s]['auroc'], 3) for s in ('agriculture', 'mining')] == [0.754, 0.943]
    )(S['prereg'], S['ranking'], S['units']))(A['exp/out/exp104_summary.json'], A['exp/out/exp104_posthoc.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: exp104-forest-loss-confidence-ranks-the-disagreements}
    - {file: docs/Findings.md, marker: exp104-forest-loss-confidence-ranks-the-disagreements}
    - {file: docs/Summary.md, marker: exp104-forest-loss-confidence-ranks-the-disagreements}
  note: >-
    Run at the frozen page (54b1dfe): predict 1289592 and read 1289593 at 4c2f6c2; graded again (1290492) at deace9d
    after the audit found the units file's rows unshuffled (shuffle_units, ce23f6d); the numbers did not change. The
    labels are MapBiomas analysts' drivers taken as right; the frame is 2 of the model's 10 classes; the per-stratum
    AUROCs are post hoc (exp/exp104_posthoc.py). The shift is months after training inside the model's training
    region, not a new region or decade: this does not explain exp99's or exp103's miss.

