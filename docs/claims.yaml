- id: boundary-cue-enrichment-is-fragmentation-not-class-count
  statement: "Across the seven segmentation tasks the boundary cue's enrichment runs from 1.24 (m-cashew-plant, 7 classes, 76% of windows on a boundary) to 8.13 (MADOS, 15 classes, 10%); its rank correlation with class count is -0.26 and with the prevalence ceiling (1 - theta)/(p - theta) is 1.00, while the error rate inside the boundary set is at least 2.1 times the rate outside on every task. The preregistered P1 (enrichment >= 2 on every task with at most ten classes) fails on cashew."
  crosscheck: tests/test_exp82.py::test_the_tile_count_bootstrap_matches_the_window_bootstrap_on_mados
  status: mixed
  experiments: [exp82]
  artifacts: [exp/out/exp82_summary.json]
  check: |-
    (lambda s: (lambda rows: (lambda enr, ceil, C, risk, rank:
      len(rows) == 7
      and round(min(enr.values()), 2) == 1.24 and min(enr, key=enr.get) == 'm_cashew_plant'
      and round(max(enr.values()), 2) == 8.13 and max(enr, key=enr.get) == 'mados'
      and rank([enr[t] for t in rows], [ceil[t] for t in rows]) == 1.0
      and round(rank([enr[t] for t in rows], [C[t] for t in rows]), 2) == -0.26
      and min(risk.values()) >= 2.1
      and enr['m_cashew_plant'] < 2 and s['tasks']['m_cashew_plant']['n_classes'] <= 10
    )({t: v['cues']['boundary']['enrichment'] for t, v in rows.items()},
      {t: (1 - v['error_rate']) / (v['cues']['boundary']['n_with_cue'] / v['n_units'] - v['error_rate']) for t, v in rows.items()},
      {t: v['n_classes'] for t, v in rows.items()},
      {t: v['cues']['boundary']['precision'] / ((v['error_rate'] * v['n_units'] - v['cues']['boundary']['precision'] * v['cues']['boundary']['n_with_cue'])
                                                 / (v['n_units'] - v['cues']['boundary']['n_with_cue'])) for t, v in rows.items()},
      lambda a, b: (lambda ra, rb: (lambda ma, mb: sum((x - ma) * (y - mb) for x, y in zip(ra, rb))
                                    / (sum((x - ma) ** 2 for x in ra) * sum((y - mb) ** 2 for y in rb)) ** 0.5)
                                   (sum(ra) / len(ra), sum(rb) / len(rb)))
                   (*[[sum(1 for y in v if y < x) + (sum(1 for y in v if y == x) + 1) / 2 for x in v] for v in (a, b)])
    ))(s['tasks']))(A['exp/out/exp82_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: boundary-cue-enrichment-is-fragmentation-not-class-count}
    - {file: docs/Findings.md, marker: boundary-cue-enrichment-is-fragmentation-not-class-count}
  note: >-
    The ceiling and the risk ratio are recomputed from each task's error rate, boundary prevalence and precision;
    the rank correlation is a Spearman on mid-ranks (the three PASTIS arms tie at 19 classes) written inline. The crosscheck recomputes MADOS's
    enrichment through explain.cue_enrichment's window bootstrap, a second route to the same statistic.

