- id: dfc2020-sensor-difference-dominates-land-cover
  statement: "On DFC2020 the Sentinel-2 and Sentinel-1 inferences of the same scenes differ on 44.27% of the windows, 33 times the 1.34% that a second probe seed moves, and the differing windows carry the boundary cue 3.30 times as often as the agreeing ones; the optical side is right on 50.4% of them, the radar side on 17.2%, and 32.4% are wrong on both; on binary flood water the same axis moved 4.9% of windows (exp60); preregistered P2 holds."
