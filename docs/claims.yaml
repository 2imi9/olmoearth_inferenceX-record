- id: dw-published-probabilities-are-underconfident
  statement: "Dynamic World's published top-1 probability understates its own accuracy by about 0.20 against the expert consensus, at the product's own resolution (0.539 mean probability against 0.738 accuracy over 4,135,162 annotated pixels, expected calibration error 0.199) and on the pooled 4 px windows alike (0.535 against 0.737), so it is a property of the product and not of our pooling; the under-confidence is monotone across every populated bin, for instance a published probability near 0.665 carries an accuracy of 0.911, and the published value never exceeds about 0.8. This reverses the experiment's stated prediction of overconfidence and separates two uses of the same numbers: they order a review well and threshold badly."
  crosscheck: tests/test_recorded.py::test_exp67_dynamic_world_recomputes_from_the_committed_windows
  status: measured
  experiments: [exp67]
  artifacts: [exp/out/exp67_summary.json]
  check: |-
    (lambda C, P:
      C['overconfidence'] < -0.15 and P['overconfidence'] < -0.15
      and round(P['mean_top1_probability'], 3) == 0.539 and round(P['accuracy'], 3) == 0.738
      and abs(C['overconfidence'] - P['overconfidence']) < 0.02
      and P['n_pixels'] > 4000000
      and all(b['accuracy'] > b['confidence'] for b in P['reliability'] if b['n'] > 1000)
      and max(b['confidence'] for b in P['reliability']) < 0.85
    )(A['exp/out/exp67_summary.json']['results']['calibration'], A['exp/out/exp67_summary.json']['results']['calibration']['per_pixel'])
