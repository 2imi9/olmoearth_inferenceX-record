- id: exp106-second-opinion-order-gains-on-two-of-three
  statement: "Putting first the rows where a second product made by another programme, Esri's 10 m land use and land cover, disagrees with a published product, least confident first within each group, raises the AUROC for the product's errors over the product's own confidence by at least 0.02 on 2 of 3 cells (preregistered P1, as frozen): ODSE-LULC at 4,807 S2GLC points, 0.787 to 0.863 (+0.077, 90% bootstrap by tile +0.056 to +0.097); LCMAP at 4,794 of LCMAP's reference plots, 0.753 to 0.832 (+0.079, +0.066 to +0.093); CGLS-LC100 at 12,574 East Africa TimeSync 2017 plots, 0.721 to 0.718 (-0.002, within country -0.008 to +0.004). Of the two cells blind for P1, one meets the bar (Europe): the LCMAP cell is not blind, since exp92 graded both scores on its rows, and 0.035 of its gain comes from error/correct pairs tied in lcpconf (99 on 2,645 rows); the remaining 0.044 is above the bar on its own. Every row is weighted equally, so the gradings describe these rows."
