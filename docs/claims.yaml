- id: exp113-v13-ranking-holds-on-held-out-territories
  statement: "In a preregistered test (exp113, frozen 3f0f580) on Ai2's PLANTEUR crop-type benchmark, a default logistic regression (StandardScaler, then LogisticRegression) on the 2019 OlmoEarth v1.3 embeddings, fitted on 100,000 random non-void pixels of the other territories' train patches and applied to one held-out territory, ranks its 4 x 4 pixel window errors at AUROC 0.874 (Guadeloupe; 90% patch bootstrap 0.870 to 0.879), 0.857 (Martinique; 0.848 to 0.866), 0.816 (Guyane; 0.795 to 0.837), 0.876 (Réunion; 0.868 to 0.884) and 0.742 (Mayotte; 0.710 to 0.773), with capture at 10% of 0.420, 0.403, 0.323, 0.320 and 0.286 and leads of 0.137, 0.224, 0.303, 0.089 and 0.238 over the best no-model control (boundary 0.738, boundary 0.633, boundary 0.513, distance from the fit mean 0.787, rarity 0.504): preregistered P1 holds in 5 of 5 (bar 4). The lead is informative in Guadeloupe, Martinique and Réunion, where a control ranks errors on its own; in Guyane and Mayotte every control is near chance. TESSERA v2 and AlphaEarth meet both parts in 4 of 5 (not Mayotte and not Réunion)."
  crosscheck: tests/test_exp113.py::test_exp113_recorded_by_a_second_route
