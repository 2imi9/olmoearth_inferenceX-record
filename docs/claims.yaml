- id: exp97-sequential-certificate-costs-labels
  statement: "With the anchor of a first budget of 300, the sequential certificate needed a median 1.71 times the one-look rule's labels (quartiles 1.55 and 2.19; 1.709 to 1.710 across five seeds) to reach half the largest mean certified share that rule reaches, on the 213 maps eligible under exp97's preregistered rule (bar 2; 2 never reached). Over budgets 50 to 3,000 its mean certified share was a median 0.146 against the one-look rule's 0.222 on the same 279 maps (a median 0.70 of it per map); it certified more on 17, 14 of them Sen1Floods11 (of 16), where its default anchor sits at the 0.25 cap above the small zones whose entry lowers the one-look rule's share."
  crosscheck: tests/test_exp97.py::test_exp97_verdicts_from_the_summary
  status: supported
  experiments: [exp97]
  artifacts: [exp/out/exp97_summary.json, exp/out/exp97_audit.json]
  check: |-
    (lambda d, au: (lambda C, M: (lambda R: len(R) == 213 and sum(r == float("inf") for r in R) == 2
      and round(sorted(R)[106], 2) == 1.71 and [round(sorted(R)[i], 2) for i in (53, 159)] == [1.55, 2.19]
      and d["prereg"]["P4"]["holds"] is True and d["prereg"]["P4"]["cells"] == 213
      and len(M) == 279
      and round(median(C[k]["arm"]["S(n0=300)"]["area"] for k in M), 3) == 0.146
      and round(median(C[k]["arm"]["F"]["area"] for k in M), 3) == 0.222
      and round(median(C[k]["arm"]["S(n0=300)"]["area"] / C[k]["arm"]["F"]["area"] for k in M if C[k]["arm"]["F"]["area"] > 0), 2) == 0.70
      and sum(C[k]["arm"]["S(n0=300)"]["area"] > C[k]["arm"]["F"]["area"] for k in M) == 17
      and sum(C[k]["arm"]["S(n0=300)"]["area"] > C[k]["arm"]["F"]["area"] for k in M if k.endswith("sen1floods11")) == 14
      and sum(k.endswith("sen1floods11") for k in M) == 16
      and all(v["P1"]["holds"] and v["P4"]["holds"] for v in au["by_seed"].values()) and len(au["by_seed"]) == 5
      and [round(g(v["P4"]["median_rho"] for v in au["by_seed"].values()), 3) for g in (min, max)] == [1.709, 1.710]
      and [round(g(v["P4"]["rho_quartiles_inverted_cdf"][2] for v in au["by_seed"].values()), 2) for g in (min, max)] == [2.19, 2.40]
      and [round(g(v["P1"]["max_violation"] for v in au["by_seed"].values()), 4) for g in (min, max)] == [0.095, 0.1175]
    )([
      (min((b for b, c in zip(C[k]["budgets"], C[k]["arm"]["S(n0=300)"]["mean_coverage"]) if c >= max(C[k]["arm"]["F"]["mean_coverage"]) / 2), default=float("inf"))
       / min(b for b, c in zip(C[k]["budgets"], C[k]["arm"]["F"]["mean_coverage"]) if c >= max(C[k]["arm"]["F"]["mean_coverage"]) / 2))
      for k in M if max(C[k]["arm"]["F"]["mean_coverage"]) >= 0.1
      and max(C[k]["budgets"]) >= 2 * min(b for b, c in zip(C[k]["budgets"], C[k]["arm"]["F"]["mean_coverage"]) if c >= max(C[k]["arm"]["F"]["mean_coverage"]) / 2)]))(
      d["cells"], [k for k, v in d["cells"].items() if "S(n0=300)" in v["arm"]]))(A["exp/out/exp97_summary.json"], A["exp/out/exp97_audit.json"])
