- id: exp113-held-out-maps-mostly-background
  statement: "In three of exp113's five held-out territories v1.3's map is close to an all-Background map: Guyane's labels are 14% Meadow, which it maps at IoU 0.007; Réunion's are 16% Sugarcane, at IoU 0.013; Mayotte's are 99.4% Background. Their pixel mIoU over the eight classes is 0.120, 0.127 and 0.125, where an all-Background map would score 0.103, 0.093 and 0.124, so there the confidence mostly finds registry crop land the map calls Background. Mayotte's window error rate, 0.5%, is its registry crop share, and a 10% review list there holds about 1.5% errors. In Guadeloupe and Martinique the held-out map classifies crops (Sugarcane IoU 0.71 and 0.72, Banana 0.49 and 0.50; mIoU 0.308 and 0.319, against 0.356 on the default split)."
