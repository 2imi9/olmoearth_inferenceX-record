    (lambda G, F, D, C: G['pass'] is True and F['pass'] is False and G['device']['name'] == F['device']['name'] == 'NVIDIA B200'
      and (G['device']['job'], F['device']['job']) == ('1369594', '1365118')
      and all((r['covered_both'], r['same_class'], r['dp1_above_tol'], round(r['spearman_suspicion'], 3)) == (259, 245, 39, 0.916)
              for r in (G['A']['models']['v1'], F['A']['models']['v1'], D['variants']['formula']))
