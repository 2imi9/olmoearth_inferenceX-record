- id: exp112-p3b-fails-at-the-level-cut
  statement: "In exp112, preregistered P3(b), a median certified share of at least 0.25 of the map at alpha 0.05 and 300 labels, does not hold: half of 2,000 draws certify nothing, so the median, 0.075, is the midpoint between none and the first testable level (0.15), and an independent route's 100,000 draws put a 2,000-draw median at or above 0.25 with probability 0.00015. Found after the run, the bar is a knife-edge at this budget: the 15% zone is the first level the standard cut tests and it expects 45 labels, exactly the 45 that certify at alpha 0.05 with no error, so any map certifies a zone with probability at most 0.525, and a 2,000-draw median reaches 0.25 only when that probability is above one half, which needs at most one error among the 1,650 most confident plots (a perfect map passes with probability 0.99). This map has two there (0.0012), so it certifies with exact probability 0.494 (guard aside) and the bar fails. Beyond that edge the confident part is clean (the most confident 70% of the plots err at 0.028, 80% at 0.049); a draw that certifies has a median share of 0.70; at alpha 0.10 the same draws certify a median of 0.85 of the map (median zone error 0.076). The bar was copied from exp110, whose P3(b) sat on the same edge (three countries above one half, Sweden at 0.484 below)."
  crosscheck: tests/test_exp112.py::test_exp112_p3b_limit_is_the_level_cut
  status: supported
  experiments: [exp112, exp110]
  artifacts: [exp/out/exp112_summary.json, exp/out/exp112_crosscheck.json]
  check: |-
    (lambda S, C: (lambda c, z: S['verdicts']['P3']['b'] is False and C['verdicts']['P3b']['holds'] is False
      and c['arm3']['by_alpha']['0.05']['median_certified_share'] == 0.075 and c['arm3']['by_alpha']['0.05']['p_certify_any'] == 0.5
      and z['levels']['b_min'] == 45 and z['levels']['coverage'][0] == 0.15 and z['levels']['sizes'][0] == 1650
      and round(z['exact_p_certify_any_guard_aside'], 3) == 0.494
      and z['large_mc']['median_of_2000_draws']['p_at_least_0.25'] == 0.00015
      and round(z['zone_true_error_by_level']['0.7'], 3) == 0.028 and round(z['zone_true_error_by_level']['0.8'], 3) == 0.049
      and c['arm3']['by_alpha']['0.1']['median_certified_share'] == 0.85
      and round(c['arm3']['by_alpha']['0.1']['zone_true_error_median'], 3) == 0.076
      and (lambda k: sorted(sum(([float(v)] * n for v, n in k.items() if float(v) > 0), []))[(sum(n for v, n in k.items() if float(v) > 0) - 1) // 2])(z['certified_share_counts']) == 0.7
    )(S['by_fit']['1000']['128'], C['arm3']['0.05']))(A['exp/out/exp112_summary.json'], A['exp/out/exp112_crosscheck.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: exp112-p3b-fails-at-the-level-cut}
    - {file: docs/Findings.md, marker: exp112-p3b-fails-at-the-level-cut}
    - {file: docs/Summary.md, marker: exp112-p3b-fails-at-the-level-cut}
  note: >-
    The page's reading of a P3(b) failure ("the map's confident part is not that clean") is wrong for this run, and the
    verdict stands as written; the page carries the correction after the run. The limit 0.525 is the hypergeometric
    chance of 45 or more of 300 labels in 1,650 of 11,000 plots (tests/test_exp112.py); the conditional median 0.70 and
    the zone errors by level are the second route's. Usage already says a level holds fewer than b_min labels about
    half the time at the budget where it enters (exp95).

