  statement: "In exp117, for all 15 NLCD 2016 classes with a declared no-change stratum, the user's accuracy interval by the pure-stratum rule was narrower than the box of two betting intervals, a median 0.61 of its width (0.32 to 0.76), and 1.20 to 3.87 times the normal-theory width (median 1.43)."
