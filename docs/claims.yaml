      and all(p['median_ratio_per_task'][t] < 1 for t in ('mados', 'sen1floods11', 'pastis_sentinel1', 'pastis_sentinel2', 'pastis_sentinel1_sentinel2', 'm_cashew_plant', 'm_sa_crop_type'))
      and round(p['median_ratio_per_task']['m_brick_kiln'], 2) == 0.68 and round(p['median_ratio_per_task']['mados'], 2) == 0.69
      and min(p['median_ratio_per_task'], key=p['median_ratio_per_task'].get) == 'm_brick_kiln'
