    because each condition's windows were read by a probe trained on that input. Large's full-input row is exp88's;
    exp79's second run of the same probe differs from it on 104 of the 458,638 units.

- id: suite-controls-are-near-chance
  statement: "On exp70's 24 tasks the two no-model controls are near chance. Take a random order's excess AURC (the error rate minus the perfect order's AURC) as the gap to close: the better of the two controls closes a median 0.094 of it and does no better than a random order on 9 of the 24 tasks, while the margin closes a median 0.680. The embedding-distance control ranks errors below chance (AUROC under 0.5) on 21 of the 24 tasks. Beating both controls on 24 of 24 tasks therefore mostly shows that the margin beats a random order."
  crosscheck: tests/test_recorded.py::test_suite_controls_margin_and_ten_percent_review_by_a_second_route
  status: measured
  experiments: [exp70]
  artifacts: [exp/out/exp70_summary.json]
  check: |-
    (lambda T: (lambda rnd, best, mar:
      len(T) == 24 and all(mar[t] < best[t] for t in T)
      and sum(1 for t in T if best[t] >= rnd[t]) == 9
      and round(median([1 - best[t] / rnd[t] for t in T]), 3) == 0.094
      and round(median([1 - mar[t] / rnd[t] for t in T]), 3) == 0.680
      and sum(1 for t in T if T[t]['signals']['ctl_embedding_distance']['auroc'] < 0.5) == 21
    )({t: T[t]['error_rate'] - oracle_aurc(T[t]['n_units'], round(T[t]['error_rate'] * T[t]['n_units'])) for t in T},
      {t: min(T[t]['signals'][c]['excess_aurc'] for c in ('ctl_embedding_distance', 'ctl_class_rarity')) for t in T},
      {t: T[t]['signals']['margin']['excess_aurc'] for t in T})
    )(A['exp/out/exp70_summary.json']['results']['tasks'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: suite-controls-are-near-chance}
    - {file: docs/Findings.md, marker: suite-controls-are-near-chance}
    - {file: docs/Summary.md, marker: suite-controls-are-near-chance}
    - {file: docs/TECHNIQUES.md, marker: suite-controls-are-near-chance}
  note: >-
    The gap uses the exact finite-n perfect order (oracle_aurc), so it is not mixed with the asymptotic form the
    claim margin-takes-two-thirds-of-the-ranking-headroom uses; both give 0.68 for the margin. The class-rarity
    control reads how rare the probe's predicted class is, so it is not wholly free of the model. Other references
    carry informative controls (LUCAS, Dynamic World, EuroCrops); this claim is about the suite.

