      and S['verdicts']['P1_claims_audit']['difference'] > 0.99 and S['verdicts']['P2_review_capture']['difference'] > 0.19
      and S['claims_audit']['A']['pooled'] > 0.99 and S['share_of_package']['B']['pooled'] < 0.2
