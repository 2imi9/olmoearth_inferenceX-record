- id: exp111-v12-ranking-reaches-the-bar-at-fresh-plots
  statement: "In the record's blind transfer test (exp111, preregistered, frozen 6d80ab7 before any prediction at a fresh plot), at 890 Kenya and Tanzania TimeSync 2017 plots more than 100 km from the AWF area (a draw of 900 from the 3,691-plot pool, 300 Open Grassland, 300 Wooded Grassland and 300 other, none graded before), the record's v1.2 fine-tune of FT-AWF, the graded model, run with rslearn 0.1.17 directly, ranks its STRICT errors (419) at a design-weighted AUROC of 0.729 (90% bootstrap within country x label-group cells 0.701 to 0.758), at or above the bar of 0.70, so preregistered P1(a), a miss below 0.70 as at exp99's 271 plots within 100 km (0.642 for v1.2), does not hold: that miss does not replicate at fresh plots. LENIENT minus STRICT is -0.008 (-0.036 to 0.020), so the legend's share of the ranking that P1(b) predicted is not detected (unweighted the difference is +0.017), and LENIENT's 0.721 (0.690 to 0.751) is not determined against 0.70. The STRICT interval's lower end sits on the bar (0.6999 to 0.7017 over six other resampling streams), so the run does not show the AUROC above 0.70 beyond Monte Carlo noise. v1, report-only, which failed its known-answer gate on this route: 0.730 (0.702 to 0.760), difference -0.009, LENIENT 0.722, the same verdicts."
