- id: exp112-v13-map-confidence-ranks-its-errors
  statement: "In a preregistered test (exp112, frozen f22f434) of a map made the way OlmoEarth v1.3 invites, a default logistic regression fitted on the 2018 v1.3 embeddings (128 dimensions) of 1,000 random plots of LCMAP Reference Data Product v1.2 and applied to the other 11,000 plots of a 12,000-plot draw (a simple random sample of CONUS's 30 m pixels), the map errs on 11.7% of the plots (1,290) and its top probability ranks those errors at AUROC 0.876 (90% bootstrap 0.869 to 0.884), the least confident 10% holding 0.416 of them (ceiling 0.853): preregistered P1 holds, 0.366 above the better of two no-model controls that are near chance (predicted-class rarity 0.488, distance from the fit set's mean vector 0.511). 2.7% of the errors are as confident as the median correct plot. With 300 or 3,000 fit plots the map errs on 13.3% and 10.7% and the AUROC is 0.858 and 0.882; at the first 64 dimensions, 11.8% and 0.877."
