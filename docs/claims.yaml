- id: exp107-sign-test-on-the-tools-sample
  statement: "On the tool's own sample, the exact sign test names the better-agreeing map at least 0.05 more often than the package's interval on 5 of 9 pairs at 100 labels (+0.095 to +0.154, the five pairs differing by 2.7 points or more), never naming the wrong map more than 0.013 of the time on any pair or budget, so preregistered P2 holds. Because the sign test treats the sample as drawn with replacement, past about a quarter to two fifths of the differing windows it names the better map less often than the interval (800 labels: 0.27 against 0.39 on NLCD A2011, 0.73 against 0.86 on GFC2020, 0.02 against 0.59 on NLCD B2011); the owner chose to adopt it only up to a fifth of the differing windows, keeping the interval above and the census answer at a census."
