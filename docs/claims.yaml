- id: dfc2020-margin-beats-pixel-control
  statement: "On DFC2020's eight land-cover classes, with OlmoEarth v1 Base frozen and their linear probe, the model's own margin beats the no-model NDWI pixel control against the 10 m reference on all three arms (Sentinel-2, Sentinel-1, both): pooled excess AURC leads of 0.1576, 0.1734 and 0.1557, each on more patches than not with p below 1e-75; predictive entropy ties the margin and the boundary-first order loses to it by 0.0409 to 0.1198, as at fifteen and nineteen classes; preregistered P1 holds."
