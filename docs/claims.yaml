    (lambda S: (lambda V, T, G: S['prereg_status'] == 'frozen' and S['commit'].startswith('76b7a3c')
      and V['P2']['holds'] is True and (V['P2']['wins'], V['P2']['of']) == (16, 18)
      and round(V['P2']['median_half_width_ratio'], 3) == 0.863
      and (V['reverse']['C_over_B'], V['reverse']['D_over_B']) == (4, 2)
      and sum(abs(T[t]['budgets']['300']['arms']['D']['half_width'] / T[t]['budgets']['300']['arms']['C']['half_width'] - 1) < 0.01 for t in G) == 12
      and round(T['mados']['budgets']['300']['arms']['D']['half_width'] / T['mados']['budgets']['300']['arms']['C']['half_width'], 2) == 0.91
      and all(T[t]['budgets']['300']['arms']['D']['half_width'] > T[t]['budgets']['300']['arms']['C']['half_width']
              for t in G if t.startswith('cropharvest_Peoples_Republic_of_China_6'))
      and max(T[t]['budgets']['300']['arms']['D']['half_width'] / T[t]['budgets']['300']['arms']['C']['half_width'] for t in G) < 1.09
    )(S['verdicts'], S['tasks'], S['verdicts']['gradable_tasks']))(A['exp/out/exp105_summary.json'])
