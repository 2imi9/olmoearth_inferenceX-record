      and round(E['width_over_normal_overall_and_differences']['min'], 2) == 1.6 and round(E['width_over_normal_overall_and_differences']['max'], 2) == 1.64
      and E['worst_abs_difference_to_the_design_study'] == 0.0
    )(A['exp/out/exp117_summary.json']['end_to_end'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: exp117-valid-interval-costs-1-6-times-normal}

- id: exp117-intervals-hold-exactly-and-in-simulation
  statement: "In exp117's design study, the chosen engine's dynamic programme matched every order of the labels to 3.6e-15, its expected e-value at the truth was at most 1.000000000000001, and all 8 linear and 4 ratio cells covered by exact enumeration; the judge's 14 enumerated cells at alpha 0.1 and 0.3 held for every form claimed valid (least slack 0.076) while normal theory covered as little as 0; in 300 simulated draws at the agency designs' shapes (8 cases) the valid intervals covered 0.997 to 1.000 and normal theory 0.937 to 0.970."
  crosscheck: tests/test_exp117.py::test_the_summary_against_the_raw_outputs
  status: supported
  experiments: [exp117]
  artifacts: [exp/out/exp117_summary.json]
  check: |-
    (lambda S: S['selftest']['linear_cells_holding'] == S['selftest']['linear_cells'] == 8 and S['selftest']['ratio_cells_holding'] == S['selftest']['ratio_cells'] == 4
      and S['selftest']['dynamic_programme_vs_every_order_max_abs_difference'] < 1e-14 and S['selftest']['largest_expected_evalue_without_replacement'] <= 1 + 1e-12
      and S['judge_enumeration']['cells'] == S['judge_enumeration']['cells_holding'] == 14 and round(S['judge_enumeration']['least_slack_over_claimed_forms'], 3) == 0.076
      and S['judge_enumeration']['normal_min_coverage'] == 0.0 and S['simulation']['cases_holding'] == S['simulation']['cases'] == 8
      and round(S['simulation']['valid_coverage']['min'], 3) == 0.997 and round(S['simulation']['normal_coverage']['min'], 3) == 0.937
      and round(S['simulation']['normal_coverage']['max'], 3) == 0.97
    )(A['exp/out/exp117_summary.json'])
  cited_in:
    - {file: docs/results/comparisons.md, marker: exp117-intervals-hold-exactly-and-in-simulation}

- id: exp117-design-study-widths
  statement: "In exp117's design study (not preregistered; the method was chosen after these widths, against a selection rule that had chosen the fallback because three of its gates could not be evaluated), the betting interval was a median 0.91 of the boxed stratified Chernoff fallback's width on 12 linear quantities (0.55 to 1.10), and the box of two betting intervals a median 0.98 of the fallback's on 30 user's and producer's accuracies (0.62 to 1.15) and 1.27 of the certified ratio scan's (1.00 to 1.52)."
  crosscheck: tests/test_exp117.py::test_the_summary_against_the_raw_outputs
  status: measured
  experiments: [exp117]
  artifacts: [exp/out/exp117_summary.json]
  check: |-
    (lambda W: (W['linear_betting_over_fallback']['n'], W['ratio_box_over_fallback']['n'], W['ratio_box_over_scan']['n']) == (12, 30, 30)
      and [round(W['linear_betting_over_fallback'][k], 2) for k in ('median', 'min', 'max')] == [0.91, 0.55, 1.1]
      and [round(W['ratio_box_over_fallback'][k], 2) for k in ('median', 'min', 'max')] == [0.98, 0.62, 1.15]
      and [round(W['ratio_box_over_scan'][k], 2) for k in ('median', 'min', 'max')] == [1.27, 1.0, 1.52]
    )(A['exp/out/exp117_summary.json']['design_study_widths'])
  cited_in:
