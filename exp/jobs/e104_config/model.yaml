# exp104: Ai2's Forest Loss Driver model.yaml (allenai/olmoearth_projects @ f3c9b0c89c7670b3525647dda4c14b76245d682d,
# olmoearth_run_data/forest_loss_driver/model.yaml, sha256 e0c3829bb74f15c33581395bfacd03ea6df410c48e6829d3a309b98c93634736)
# with ONE change, as exp102 derived AWF's (exp/jobs/e102_config/model.yaml): the logger is lightning's CSVLogger under
# the trainer data path instead of Weights & Biases (no account is used). Nothing else differs: removing these header
# lines and putting Ai2's WandbLogger block back gives Ai2's file byte for byte (exp/exp104_forest_loss.py
# check_configs; tests/test_exp104.py). Run with rslearn 0.1.17 (exp/jobs/e104.sh, exp102's venv) and the Hub
# checkpoint allenai/OlmoEarth-v1-FT-ForestLossDriver-Base @ 15502f8a (uploaded 30 October 2025). Ai2's file at f3c9b0c8
# names a later run in its closing comments (20260401 Peru phase 2), whose checkpoint is not on the Hub; it differs from
# Ai2's 3388bb21 (30 October 2025, the release) only by enable_confusion_matrix, the checkpoint callback and comments,
# none of which acts at predict.
# --- end of exp104 header ---
model:
  class_path: rslearn.train.lightning_module.RslearnLightningModule
  init_args:
    model:
      class_path: rslearn.models.singletask.SingleTaskModel
      init_args:
        # We use SimpleTimeSeries not for time series but just to concatenate the
        # feature maps for pre-forest-loss and post-forest-loss.
        encoder:
          - class_path: rslearn.models.simple_time_series.SimpleTimeSeries
            init_args:
              encoder:
                class_path: rslearn.models.olmoearth_pretrain.model.OlmoEarth
                init_args:
                  model_id: OLMOEARTH_V1_BASE
                  patch_size: 4
              image_channels: 48
              image_key: "sentinel2_l2a"
              groups: [[0], [1]]
        decoder:
          - class_path: rslearn.models.pooling_decoder.PoolingDecoder
            init_args:
              in_channels: 1536
              out_channels: 10
              num_conv_layers: 1
              num_fc_layers: 2
          - class_path: rslearn.train.tasks.classification.ClassificationHead
    scheduler:
      class_path: rslearn.train.scheduler.PlateauScheduler
      init_args:
        factor: 0.2
        patience: 2
        min_lr: 0
        cooldown: 10
    optimizer:
      class_path: rslearn.train.optimizer.AdamW
      init_args:
        lr: 0.0001
data:
  class_path: rslearn.train.data_module.RslearnDataModule
  init_args:
    path: ${DATASET_PATH}
    inputs:
      sentinel2_l2a:
        data_type: "raster"
        layers: ["pre_sentinel2", "pre_sentinel2.1", "pre_sentinel2.2", "pre_sentinel2.3", "post_sentinel2", "post_sentinel2.1", "post_sentinel2.2", "post_sentinel2.3"]
        bands: ["B02", "B03", "B04", "B08", "B05", "B06", "B07", "B8A", "B11", "B12", "B01", "B09"]
        passthrough: true
        load_all_layers: true
      targets:
        data_type: "vector"
        layers: ["label"]
        is_target: true
    task:
      class_path: rslearn.train.tasks.classification.ClassificationTask
      init_args:
        property_name: "new_label"
        classes: ["agriculture", "mining", "airstrip", "road", "logging", "burned", "landslide", "hurricane", "river", "none"]
        allow_invalid: true
        metric_kwargs:
          average: "micro"
        prob_property: "probs"
        skip_unknown_categories: true
        enable_confusion_matrix: true
    batch_size: 8
    num_workers: ${NUM_WORKERS}
    default_config:
      transforms:
        - class_path: rslearn.train.transforms.pad.Pad
          init_args:
            mode: "center"
            size: 64
            image_selectors:
              - sentinel2_l2a
        - class_path: rslearn.models.olmoearth_pretrain.norm.OlmoEarthNormalize
          init_args:
            band_names:
              sentinel2_l2a: ["B02", "B03", "B04", "B08", "B05", "B06", "B07", "B8A", "B11", "B12", "B01", "B09"]
        - class_path: rslearn.train.transforms.flip.Flip
          init_args:
            image_selectors:
              - sentinel2_l2a
        # To support visualization via image key.
        - class_path: rslearn.train.transforms.concatenate.Concatenate
          init_args:
            selections:
              sentinel2_l2a: [2, 1, 0]
            output_selector: image
    train_config:
      tags:
        split: train
    val_config:
      tags:
        split: val
    test_config:
      tags:
        split: val
    predict_config:
      skip_targets: true
trainer:
  max_epochs: 100
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: ${TRAINER_DATA_PATH}
      name: log
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: "epoch"
    - class_path: rslearn.train.callbacks.freeze_unfreeze.FreezeUnfreeze
      init_args:
        module_selector: ["model", "encoder", 0, "encoder", "model"]
        unfreeze_at_epoch: 20
        unfreeze_lr_factor: 10
    - class_path: rslearn.train.callbacks.checkpointing.BestLastCheckpoint
      init_args:
        dirpath: ${TRAINER_DATA_PATH}
        monitor: val_accuracy
        mode: max
    - class_path: rslearn.train.prediction_writer.RslearnWriter
      init_args:
        path: ${DATASET_PATH}
        output_layer: ${PREDICTION_OUTPUT_LAYER}
